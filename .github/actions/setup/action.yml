name: 'Setup Seed Design'
description: 'Setup Bun, install dependencies, and optionally build packages'

inputs:
  build-packages:
    description: 'Build packages'
    required: false
    default: 'false'
  build-rootage:
    description: 'Build rootage in addition to packages'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.8"

    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Cache build outputs
      if: ${{ inputs.build-packages == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          packages/**/dist
          packages/**/build
          ecosystem/**/dist
          ecosystem/**/build
        key: ${{ runner.os }}-build-${{ hashFiles('packages/**/*.{ts,tsx,js,jsx}', 'ecosystem/**/*.{ts,tsx,js,jsx}') }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Build Packages
      if: ${{ inputs.build-packages == 'true' }}
      shell: bash
      run: |
        if [ "${{ inputs.build-rootage }}" == "true" ]; then
          bun packages:build && bun rootage:build
        else
          bun packages:build
        fi
