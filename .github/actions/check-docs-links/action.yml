name: Check docs links
description: Validate internal links in the exported docs site with lychee.

inputs:
  out-dir:
    description: "Absolute path to the exported docs site (Next static export output)"
    required: true

runs:
  using: composite
  steps:
    # `--format`은 넘기지 않는다. 액션의 failIfEmpty가 markdown 출력의 `Total | 0`을
    # grep해서 판정하므로, 다른 포맷을 주면 링크를 하나도 못 찾은 상황이 통과로 넘어간다.
    # `--output`도 넘기지 않는다. 액션이 직접 지정하며 중복되면 에러로 막는다.
    #
    # `--remap` 값은 작은따옴표로 감싼다. 액션 진입점이 `eval lychee ... ${ARGS}`로
    # 실행해서, 큰따옴표 안의 `$1`은 eval 단계에서 빈 문자열로 사라진다.
    #
    # 두 단계 모두 changelog를 뺀다. 본문이 `packages/*/CHANGELOG.md`에서 와서 거기서 썩은
    # 링크는 원천에서 고칠 수 없고, 그 안의 옛 URL은 lychee가 오프라인에서 볼 수 없는
    # `_redirects`로 풀린다.
    - name: Check links in the exported HTML
      uses: lycheeverse/lychee-action@v2
      with:
        lycheeVersion: v0.24.2
        fail: true
        args: >-
          --offline
          --no-ignore
          --no-progress
          --extensions html
          --root-dir ${{ inputs.out-dir }}
          --fallback-extensions html
          --include-fragments=anchor-only
          --exclude-path '/react/updates/changelog\.html$'
          --remap 'https://seed-design.io/(.*) file://${{ inputs.out-dir }}/$1'
          --
          ${{ inputs.out-dir }}

    # 문서마다 나가는 `<문서 URL>.md`를 검사한다. `#heading` 링크는 그 파일 자신을 가리키므로,
    # 이 단계의 프래그먼트 검사는 파일이 실제 heading을 담고 있어야만 성립한다. heading을 잃은
    # 채로 켜면 페이지에 멀쩡히 있는 앵커가 전부 깨진 걸로 잡힌다.
    - name: Check links in the markdown outputs
      uses: lycheeverse/lychee-action@v2
      with:
        lycheeVersion: v0.24.2
        fail: true
        args: >-
          --offline
          --no-ignore
          --no-progress
          --extensions md
          --root-dir ${{ inputs.out-dir }}
          --fallback-extensions html
          --include-fragments=anchor-only
          --exclude-path '/react/updates/changelog\.md$'
          --remap 'https://seed-design.io/(.*) file://${{ inputs.out-dir }}/$1'
          --
          ${{ inputs.out-dir }}
