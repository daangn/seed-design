name: Restore docs build caches
description: Restore shared Lynx Rspeedy, Fumadocs TypeScript, and Astro page caches

inputs:
  cache-generation:
    description: Suffix that controls when the current branch publishes a new immutable cache
    required: true
  cache-scope:
    description: Branch name recorded in the cache key for diagnostics
    required: true
  default-branch:
    description: Repository default branch used to report the matched cache scope
    required: true
  benchmark-cache-key:
    description: Optional isolated namespace for reproducible cache benchmarks
    required: false
    default: ""
  restore-astro-pages:
    description: Whether to restore rendered pages for the Astro incremental build
    required: false
    default: "false"

outputs:
  lynx-cache-hit:
    description: Whether the Lynx Rspeedy primary key was restored exactly
    value: ${{ steps.restore-lynx.outputs.cache-hit }}
  lynx-cache-matched-key:
    description: Key of the Lynx Rspeedy cache that was restored
    value: ${{ steps.restore-lynx.outputs.cache-matched-key }}
  lynx-cache-primary-key:
    description: Primary key to use when saving the Lynx Rspeedy cache
    value: ${{ steps.restore-lynx.outputs.cache-primary-key }}
  fumadocs-cache-hit:
    description: Whether the Fumadocs TypeScript primary key was restored exactly
    value: ${{ steps.restore-fumadocs.outputs.cache-hit }}
  fumadocs-cache-matched-key:
    description: Key of the Fumadocs TypeScript cache that was restored
    value: ${{ steps.restore-fumadocs.outputs.cache-matched-key }}
  fumadocs-cache-primary-key:
    description: Primary key to use when saving the Fumadocs TypeScript cache
    value: ${{ steps.restore-fumadocs.outputs.cache-primary-key }}
  astro-cache-hit:
    description: Whether the Astro page cache primary key was restored exactly
    value: ${{ steps.restore-astro.outputs.cache-hit }}
  astro-cache-matched-key:
    description: Key of the Astro page cache that was restored
    value: ${{ steps.restore-astro.outputs.cache-matched-key }}
  astro-cache-primary-key:
    description: Primary key to use when saving the Astro page cache
    value: ${{ steps.restore-astro.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Generate cache keys
      id: keys
      shell: bash
      env:
        BENCHMARK_CACHE_KEY: ${{ inputs.benchmark-cache-key }}
        CACHE_GENERATION: ${{ inputs.cache-generation }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        # Keep ordinary docs and package sources out of this compatibility hash.
        # Rspack tracks them in its persistent cache. Dependencies and build
        # configuration stay here because their caches are not safely interchangeable.
        LYNX_COMPATIBILITY_HASH: ${{ hashFiles('bun.lock', 'package.json', 'bunfig.toml', 'docs/package.json', 'docs/tsconfig.json', 'docs/tsconfig.lynx-node.json', 'docs/examples/lynx/tsconfig.json', 'docs/lynx.config.ts', 'docs/scripts/lynx-examples/constants.ts', 'docs/scripts/lynx-examples/cache.ts', 'docs/scripts/lynx-examples/discovery.ts', 'docs/scripts/lynx-examples/manifest.ts', 'docs/scripts/lynx-examples/web-core-styles.ts', 'docs/scripts/lynx-examples/build.ts', '.github/actions/setup/action.yml', '.bun-version') }}
      run: |
        lynx_namespace="${RUNNER_OS}-docs-lynx-rspeedy-v1-"
        fumadocs_namespace="${RUNNER_OS}-fumadocs-typescript-v2-"
        # Astro가 설정·lockfile·모듈 해시로 캐시의 호환성을 스스로 확인하므로 호환성 해시를 두지 않는다.
        # 맞지 않는 캐시는 페이지를 다시 렌더링할 뿐이다.
        astro_namespace="${RUNNER_OS}-docs-astro-pages-v1-"
        # 외부 Actions cache와 내부 JSON generation이 같은 호환성 기준을 사용한다.
        # 이 해시는 setup 단계에서 복원되는 lib와 .ultra.cache.json 같은 생성물을 제외한다.
        fumadocs_compatibility_hash="$(bun -e 'import { typeTableCacheCompatibilityHash } from "./docs/components/type-table/cache-compatibility.ts"; process.stdout.write(typeTableCacheCompatibilityHash)')"

        if [ -n "$BENCHMARK_CACHE_KEY" ]; then
          lynx_namespace+="benchmark-${BENCHMARK_CACHE_KEY}-"
          fumadocs_namespace+="benchmark-${BENCHMARK_CACHE_KEY}-"
          astro_namespace+="benchmark-${BENCHMARK_CACHE_KEY}-"
        fi

        lynx_namespace+="${LYNX_COMPATIBILITY_HASH}-"
        fumadocs_namespace+="${fumadocs_compatibility_hash}-"

        echo "lynx-primary-key=${lynx_namespace}scope-${CACHE_SCOPE}-${CACHE_GENERATION}" >> "$GITHUB_OUTPUT"
        echo "lynx-restore-prefix=${lynx_namespace}scope-${DEFAULT_BRANCH}-" >> "$GITHUB_OUTPUT"
        echo "fumadocs-primary-key=${fumadocs_namespace}scope-${CACHE_SCOPE}-${CACHE_GENERATION}" >> "$GITHUB_OUTPUT"
        echo "fumadocs-restore-prefix=${fumadocs_namespace}scope-${DEFAULT_BRANCH}-" >> "$GITHUB_OUTPUT"
        echo "astro-primary-key=${astro_namespace}scope-${CACHE_SCOPE}-${CACHE_GENERATION}" >> "$GITHUB_OUTPUT"

    - name: Restore Lynx Rspeedy cache
      id: restore-lynx
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: docs/.cache/lynx-rspeedy
        key: ${{ steps.keys.outputs.lynx-primary-key }}
        restore-keys: |
          ${{ steps.keys.outputs.lynx-restore-prefix }}

    - name: Restore Fumadocs TypeScript cache
      id: restore-fumadocs
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: docs/.cache/fumadocs-typescript
        key: ${{ steps.keys.outputs.fumadocs-primary-key }}
        restore-keys: |
          ${{ steps.keys.outputs.fumadocs-restore-prefix }}

    # 렌더링한 페이지를 재사용한다(`docs/lib/incremental-build.ts`). 기본 브랜치는 이 캐시를 만들지
    # 않으므로 현재 브랜치의 키만 찾는다.
    - name: Restore Astro page cache
      id: restore-astro
      if: ${{ inputs.restore-astro-pages == 'true' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: docs/.cache/astro
        key: ${{ steps.keys.outputs.astro-primary-key }}

    - name: Report cache restore
      shell: bash
      env:
        LYNX_CACHE_HIT: ${{ steps.restore-lynx.outputs.cache-hit }}
        LYNX_CACHE_MATCHED_KEY: ${{ steps.restore-lynx.outputs.cache-matched-key }}
        LYNX_CACHE_PRIMARY_KEY: ${{ steps.restore-lynx.outputs.cache-primary-key }}
        FUMADOCS_CACHE_HIT: ${{ steps.restore-fumadocs.outputs.cache-hit }}
        FUMADOCS_CACHE_MATCHED_KEY: ${{ steps.restore-fumadocs.outputs.cache-matched-key }}
        FUMADOCS_CACHE_PRIMARY_KEY: ${{ steps.restore-fumadocs.outputs.cache-primary-key }}
        ASTRO_CACHE_ENABLED: ${{ inputs.restore-astro-pages }}
        ASTRO_CACHE_HIT: ${{ steps.restore-astro.outputs.cache-hit }}
        ASTRO_CACHE_MATCHED_KEY: ${{ steps.restore-astro.outputs.cache-matched-key }}
        ASTRO_CACHE_PRIMARY_KEY: ${{ steps.restore-astro.outputs.cache-primary-key }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
      run: |
        report_cache() {
          local name="$1"
          local hit="$2"
          local matched_key="$3"
          local primary_key="$4"
          local result="miss"
          local matched_scope="none"

          if [ "$hit" = "true" ]; then
            result="exact hit"
            matched_scope="current branch ($CACHE_SCOPE)"
          elif [ -n "$matched_key" ]; then
            result="restore-key hit (not exact)"
            case "$matched_key" in
              *-scope-"$CACHE_SCOPE"-*) matched_scope="current branch ($CACHE_SCOPE)" ;;
              *-scope-"$DEFAULT_BRANCH"-*) matched_scope="default branch ($DEFAULT_BRANCH)" ;;
              *) matched_scope="unknown" ;;
            esac
          fi

          echo "| $name | $result | $matched_scope | ${matched_key:-none} | ${primary_key:-unknown} |"
        }

        {
          echo "## Docs build cache restore"
          echo
          echo "| Cache | Result | Matched scope | Matched key | Primary key |"
          echo "| --- | --- | --- | --- | --- |"
          report_cache "Lynx Rspeedy" "$LYNX_CACHE_HIT" "$LYNX_CACHE_MATCHED_KEY" "$LYNX_CACHE_PRIMARY_KEY"
          report_cache "Fumadocs TypeScript" "$FUMADOCS_CACHE_HIT" "$FUMADOCS_CACHE_MATCHED_KEY" "$FUMADOCS_CACHE_PRIMARY_KEY"
          if [ "$ASTRO_CACHE_ENABLED" = "true" ]; then
            report_cache "Astro pages" "$ASTRO_CACHE_HIT" "$ASTRO_CACHE_MATCHED_KEY" "$ASTRO_CACHE_PRIMARY_KEY"
          fi
          echo
          echo "Lookup order: current branch ($CACHE_SCOPE), then default branch ($DEFAULT_BRANCH)."
        } >> "$GITHUB_STEP_SUMMARY"
