name: Release automation activation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Activation step"
        required: true
        type: choice
        options: [enable-rootage-contract, enable-sync, enable-dry-run, enable-production]

concurrency:
  group: release-activation
  cancel-in-progress: false

jobs:
  create-pr:
    name: Create activation PR
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Verify exact lane bootstrap readiness
        if: inputs.operation == 'enable-sync'
        run: |
          git fetch --no-tags origin \
            +refs/heads/minor:refs/remotes/origin/minor \
            +refs/heads/major:refs/remotes/origin/major
          bun tools/release-automation/bin/control.ts bootstrap-readiness
      - name: Apply activation state
        env:
          ACTIVATION_OPERATION: ${{ inputs.operation }}
        run: bun tools/release-automation/bin/control.ts activation --operation "$ACTIVATION_OPERATION"
      - name: Create activation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: |
          CONTROL_SHA=$(git rev-parse HEAD)
          BRANCH="release-activation/${OPERATION}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release/lanes.json .github/release/control.json
          git commit -m "chore(release): ${OPERATION}"
          git push origin "$BRANCH"
          HEAD_SHA=$(git rev-parse HEAD)
          MARKER=$(bun tools/release-automation/bin/control.ts marker --type activation --lane dev --tag "$OPERATION" --expectedHeadSha "$HEAD_SHA" --controlSha "$CONTROL_SHA")
          gh pr create --base dev --head "$BRANCH" --title "chore(release): ${OPERATION}" --body "$MARKER"
          gh workflow run release-pr-validation.yml --ref dev -f head_ref="$BRANCH" -f head_sha="$HEAD_SHA"
