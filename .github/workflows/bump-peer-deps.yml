name: Bump peer dependencies

on:
  issue_comment:
    types: [created]

concurrency:
  group: bump-peer-deps-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  bump:
    name: Align released peer dependency ranges
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/bump-peer-deps' &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Acknowledge command and resolve version PR
        id: pull
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes',
              });
            } catch (error) {
              core.warning(`Acknowledgement reaction을 추가하지 못했습니다: ${error.message}`);
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const shaPattern = /^[0-9a-f]{40}$/;

            if (pull.state !== 'open') {
              core.setFailed(`열린 PR에서만 실행할 수 있습니다. 현재 상태: ${pull.state}`);
              return;
            }
            if (pull.base.ref !== 'dev') {
              core.setFailed(`dev 대상 PR에서만 실행할 수 있습니다. 현재 base: ${pull.base.ref}`);
              return;
            }
            if (pull.head.repo?.full_name !== repository) {
              core.setFailed(`동일 저장소 PR에서만 실행할 수 있습니다. 현재 head 저장소: ${pull.head.repo?.full_name}`);
              return;
            }
            if (pull.head.ref !== 'changeset-release/dev') {
              core.setFailed(`Changesets 버전 PR에서만 실행할 수 있습니다. 현재 head: ${pull.head.ref}`);
              return;
            }
            if (pull.title !== 'release: version packages') {
              core.setFailed(`Changesets 버전 PR 제목이 아닙니다. 현재 제목: ${pull.title}`);
              return;
            }
            if (!shaPattern.test(pull.base.sha) || !shaPattern.test(pull.head.sha)) {
              core.setFailed('PR base/head SHA 형식이 올바르지 않습니다.');
              return;
            }

            core.setOutput('base-sha', pull.base.sha);
            core.setOutput('head-ref', pull.head.ref);
            core.setOutput('source-sha', pull.head.sha);

      - name: Checkout trusted automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Bind automation to trusted dev history
        working-directory: control
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          git merge-base --is-ancestor "$CONTROL_SHA" refs/remotes/origin/dev

      - name: Checkout exact version PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pull.outputs.source-sha }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Align React's CSS peer dependency
        id: sync
        working-directory: source
        env:
          BASE_SHA: ${{ steps.pull.outputs.base-sha }}
          SOURCE_SHA: ${{ steps.pull.outputs.source-sha }}
        run: >-
          bun ../control/.github/scripts/bump-peer-deps.ts
          --root .
          --base-sha "$BASE_SHA"
          --source-sha "$SOURCE_SHA"

      - name: Validate, commit and push changes
        if: steps.sync.outputs.changed == 'true'
        working-directory: source
        env:
          HEAD_REF: ${{ steps.pull.outputs.head-ref }}
        run: |
          git diff --check

          UNEXPECTED_FILES="$(git status --porcelain | awk '{print $2}' | grep -vE '^(bun.lock|packages/react/package.json)$' || true)"
          if [ -n "$UNEXPECTED_FILES" ]; then
            echo "예상하지 않은 파일이 변경되었습니다:"
            echo "$UNEXPECTED_FILES"
            exit 1
          fi

          if git diff --quiet -- bun.lock || git diff --quiet -- packages/react/package.json; then
            echo "bun.lock과 packages/react/package.json이 모두 변경되어야 합니다."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock packages/react/package.json
          git commit -m "chore(react): bump @seed-design/css peer dependency"
          git push origin "HEAD:${HEAD_REF}"

      - name: Mark command success
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket',
              });
            } catch (error) {
              core.warning(`Success reaction을 추가하지 못했습니다: ${error.message}`);
            }

      - name: Mark command failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '-1',
              });
            } catch (error) {
              core.warning(`Failure reaction을 추가하지 못했습니다: ${error.message}`);
            }
