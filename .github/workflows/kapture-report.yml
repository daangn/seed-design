name: Kapture Report
on:
  workflow_run:
    workflows:
      - Kapture Capture
    types:
      - in_progress
      - completed
permissions: {}
concurrency:
  group: kapture-review-${{ github.repository }}
  cancel-in-progress: false
  queue: max
env:
  KAPTURE_CLI_VERSION: "0.11.0"
  npm_config_registry: https://registry.npmjs.org/
  npm_config_ignore_scripts: "true"
  YARN_ENABLE_SCRIPTS: "false"
jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && contains(fromJSON('["dev","minor","major"]'), github.event.workflow_run.pull_requests[0].base.ref) && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      KAPTURE_BASE_BRANCH: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - id: review
        run: bunx "@kaptures/cli@$KAPTURE_CLI_VERSION" github prepare-review --allow-initial-adoption --adapter-package-json docs/package.json --base-branch "$KAPTURE_BASE_BRANCH" --output "${{ runner.temp }}/kapture-review" --receipt "${{ runner.temp }}/kapture-receipt.json" --include-storybook
      # 완성된 배포 폴더의 한도만 검사합니다. 별도 API 호출·예약 작업·삭제는 없습니다.
      - name: Check Pages upload limits
        id: upload-limits
        if: steps.review.outputs.ready == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553
        env:
          KAPTURE_REPORT_DIRECTORY: ${{ runner.temp }}/kapture-review
        with:
          script: |
            const { readdir, lstat } = require('node:fs/promises');
            const { join } = require('node:path');
            // 현재 Wrangler 업로드 경로의 보수적인 한도. 계정 플랜을 추정하지 않습니다.
            const maxFiles = 20000;
            const maxFileBytes = 25 * 1024 * 1024;
            let files = 0, bytes = 0, largest = 0, images = 0;
            async function inspect(path) {
              const stat = await lstat(path);
              if (stat.isSymbolicLink()) throw new Error('Symlinks are not allowed in the Pages upload');
              if (stat.isDirectory()) {
                for (const entry of await readdir(path)) await inspect(join(path, entry));
              } else if (stat.isFile()) {
                files++;
                bytes += stat.size;
                largest = Math.max(largest, stat.size);
                if (path.endsWith('.png')) images++;
              } else throw new Error('Unsupported file type in the Pages upload');
            }
            await inspect(process.env.KAPTURE_REPORT_DIRECTORY);
            await core.summary.addHeading('Kapture Pages upload')
              .addTable([
                [{ data: 'Files', header: true }, { data: 'PNG images', header: true },
                 { data: 'Total bytes', header: true }, { data: 'Largest file bytes', header: true }],
                [String(files), String(images), String(bytes), String(largest)],
              ]).write();
            if (!files || files > maxFiles || largest > maxFileBytes) {
              throw new Error(`Pages upload exceeds limits or is empty: ${files} files, largest ${largest} bytes`);
            }
      - name: Deploy dashboard and Storybook together
        id: deploy
        if: steps.review.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: 4.45.3
          command: pages deploy ${{ runner.temp }}/kapture-review --project-name=seed-design-storybook --branch=kapture-pr-${{ steps.review.outputs.pr-number }} --commit-hash=${{ steps.review.outputs.head-sha }} --commit-message=kapture-pr-${{ steps.review.outputs.pr-number }}-run-${{ steps.review.outputs.run-id }}
      - name: Validate the immutable Pages URL
        id: dashboard
        if: steps.review.outputs.ready == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = new URL((process.env.DEPLOYMENT_URL || '').trim());
            if (url.protocol !== 'https:' ||
                !/^[0-9a-f]{8}\.seed-design-storybook\.pages\.dev$/.test(url.hostname) ||
                url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
              throw new Error('Expected an immutable Storybook Pages deployment URL');
            }
            core.setOutput('url', url.toString());
      - name: Publish review
        if: steps.review.outputs.ready == 'true'
        env:
          KAPTURE_REPORT_URL: ${{ steps.dashboard.outputs.url }}
        run: bunx "@kaptures/cli@$KAPTURE_CLI_VERSION" github publish-run --receipt "${{ runner.temp }}/kapture-receipt.json" --report "${{ runner.temp }}/kapture-review/report.json" --report-url "$KAPTURE_REPORT_URL" --comment-language ko
  finalize:
    needs: publish
    if: always() && github.event.action == 'completed' && github.event.workflow_run.event == 'pull_request' && contains(fromJSON('["dev","minor","major"]'), github.event.workflow_run.pull_requests[0].base.ref) && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      KAPTURE_BASE_BRANCH: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bunx "@kaptures/cli@$KAPTURE_CLI_VERSION" github finalize-run --allow-initial-adoption --adapter-package-json docs/package.json --base-branch "$KAPTURE_BASE_BRANCH" --capture-workflow-path .github/workflows/kapture-capture.yml
