name: Kapture Report

on:
  workflow_run:
    workflows: [Kapture Capture]
    types: [in_progress, completed]

permissions: {}

concurrency:
  group: kapture-review-${{ github.repository }}
  cancel-in-progress: false

env:
  npm_config_registry: https://registry.npmjs.org/
  npm_config_ignore_scripts: "true"

jobs:
  publish:
    # Stacked PR previews are published by the capture workflow before adoption.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Reconcile the exact capture run with the live PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bunx @kaptures/cli@0.4.0 github reconcile-run
          --capture-workflow-path .github/workflows/kapture-capture.yml
          --base-branch dev
          --status-context "Kapture Visual Review"

      - name: Prepare the verified report and immutable receipt
        id: prepare
        if: github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bunx @kaptures/cli@0.4.0 github prepare-run
          --capture-workflow-path .github/workflows/kapture-capture.yml
          --base-branch dev
          --output "${{ runner.temp }}/kapture-review"
          --receipt "${{ runner.temp }}/kapture-receipt.json"
          --storybook-url ./storybook/

      - name: Prepare the verified head Storybook
        if: steps.prepare.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bunx @kaptures/cli@0.4.0 github prepare-storybook-run
          --capture-workflow-path .github/workflows/kapture-capture.yml
          --base-branch dev
          --receipt "${{ runner.temp }}/kapture-receipt.json"
          --output "${{ runner.temp }}/kapture-review/storybook"

      - name: Deploy dashboard and Storybook together
        id: deploy
        if: steps.prepare.outcome == 'success'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.45.3"
          command: >-
            pages deploy ${{ runner.temp }}/kapture-review
            --project-name=seed-design-storybook
            --branch=${{ steps.prepare.outputs.preview-alias }}
            --commit-hash=${{ steps.prepare.outputs.head-sha }}

      - name: Validate the immutable Pages URL
        id: dashboard
        if: steps.prepare.outcome == 'success'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = new URL((process.env.DEPLOYMENT_URL || '').trim());
            if (url.protocol !== 'https:' ||
                !/^[0-9a-f]{8}\.seed-design-storybook\.pages\.dev$/.test(url.hostname) ||
                url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
              throw new Error('Expected an immutable Storybook Pages deployment URL');
            }
            core.setOutput('url', url.toString());

      - name: Publish the current report and review status
        if: steps.prepare.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KAPTURE_REPORT_URL: ${{ steps.dashboard.outputs.url }}
        run: >-
          bunx @kaptures/cli@0.4.0 github publish-run
          --receipt "${{ runner.temp }}/kapture-receipt.json"
          --report "${{ runner.temp }}/kapture-review/report.json"
          --report-url "$KAPTURE_REPORT_URL"
          --status-context "Kapture Visual Review"
          --comment-language ko

  finalize:
    name: Finalize capture or publication errors
    needs: publish
    if: >-
      always() && github.event.action == 'completed' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - name: Preserve published results and close failed runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bunx @kaptures/cli@0.4.0 github finalize-run
          --capture-workflow-path .github/workflows/kapture-capture.yml
          --base-branch dev
          --status-context "Kapture Visual Review"
