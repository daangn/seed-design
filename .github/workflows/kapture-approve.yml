name: Kapture Approval
on:
  issue_comment:
    types:
      - created
permissions: {}
env:
  KAPTURE_CLI_VERSION: "0.15.1"
  npm_config_registry: https://registry.npmjs.org/
  npm_config_ignore_scripts: "true"
  YARN_ENABLE_SCRIPTS: "false"
jobs:
  approve:
    concurrency:
      group: kapture-review-${{ github.repository }}-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/kapture approve ') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check supported PR base
        id: policy
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.setOutput('supported', pr.state === 'open' &&
              ['dev', 'minor', 'major'].includes(pr.base.ref) && pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`);
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.policy.outputs.supported == 'true'
        with:
          node-version: "24"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        if: steps.policy.outputs.supported == 'true'
        run: npx --yes --registry=https://registry.npmjs.org/ --@kaptures:registry=https://registry.npmjs.org/ "@kaptures/cli@$KAPTURE_CLI_VERSION" github approve --comment-language ko
