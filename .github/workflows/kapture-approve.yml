name: Kapture Approval

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: kapture-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/kapture approve ') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - name: Verify reviewer, latest SHA, run and report digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_registry: https://registry.npmjs.org/
          npm_config_ignore_scripts: "true"
        run: >-
          bunx @kaptures/cli@0.4.0 github approve
          --status-context "Kapture Visual Review"
          --comment-language ko
