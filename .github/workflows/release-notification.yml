name: Release Notification

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Exact authorized Version Packages PR number"
        required: true
        type: string
      merge-sha:
        description: "Exact successfully published merge SHA"
        required: true
        type: string
      control-sha:
        description: "Immutable trusted dev control SHA"
        required: true
        type: string
      publish-run-id:
        description: "Release publish run that wrote the durable production record"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-notification-${{ inputs.merge-sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact published release notification
    if: >-
      github.ref == 'refs/heads/dev' &&
      github.actor == 'github-actions[bot]' &&
      github.triggering_actor == github.actor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      blocks: ${{ steps.payload.outputs.blocks }}
    steps:
      - name: Checkout immutable trusted dev control plane
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.control-sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Checkout exact approved merge as changelog data
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.merge-sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Reauthorize exact production publish and select changelogs
        id: changelogs
        working-directory: control
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTIFICATION_PR_NUMBER: ${{ inputs.pr-number }}
          RELEASE_NOTIFICATION_MERGE_SHA: ${{ inputs.merge-sha }}
          RELEASE_NOTIFICATION_CONTROL_SHA: ${{ inputs.control-sha }}
          RELEASE_NOTIFICATION_PUBLISH_RUN_ID: ${{ inputs.publish-run-id }}
          RELEASE_NOTIFICATION_CONTROL_PATH: ${{ github.workspace }}/control
          RELEASE_NOTIFICATION_SOURCE_PATH: ${{ github.workspace }}/source
        run: bun tools/release-automation/src/publish/release-notification.ts
      - name: Build Slack payload with trusted control code
        id: payload
        working-directory: source
        env:
          CHANGELOG_FILES: ${{ steps.changelogs.outputs.files }}
          PR_URL: ${{ steps.changelogs.outputs.prUrl }}
        run: node ../control/.github/scripts/notify-release.js

  send:
    name: Send confirmed production release notification
    needs: prepare
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send prepared Slack payload without repository code
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_FRONTEND_CHANNEL_ID }}
            text: "🌱 SEED Design 새 버전이 릴리즈됐어요!"
            blocks: ${{ needs.prepare.outputs.blocks }}
