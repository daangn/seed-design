name: Release lane synchronization

on:
  pull_request_target:
    branches: [dev, minor, major]
    types: [closed]
  schedule:
    - cron: "*/10 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Synchronization operation to run
        required: true
        default: drain
        type: choice
        options: [drain, alert]
  workflow_run:
    workflows: ["Release lane PR validation"]
    types: [completed]

jobs:
  prepare:
    name: Read synchronization control
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action == 'closed') ||
      (github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.operation == 'drain')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.control.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
      - id: control
        run: |
          if [ "$(jq -r '.sync.activation' .github/release/lanes.json)" = "null" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  drain:
    name: Drain ${{ matrix.target }} FIFO queue
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.enabled == 'true' &&
      ((github.event_name == 'pull_request_target' && github.event.action == 'closed') ||
      (github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.operation == 'drain'))
    strategy:
      fail-fast: false
      matrix:
        target: [minor, major]
    concurrency:
      group: release-sync-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      statuses: read
    steps:
      - name: Checkout trusted dev control plane
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Apply the oldest unprocessed source PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_LANE: ${{ matrix.target }}
        run: |
          DEV_WORKSPACE="$GITHUB_WORKSPACE"
          TARGET_WORKTREE=$(mktemp -d)
          cleanup() {
            git -C "$DEV_WORKSPACE" worktree remove --force "$TARGET_WORKTREE"
          }
          trap cleanup EXIT
          git worktree add --detach "$TARGET_WORKTREE" "origin/$TARGET_LANE"
          SYNC_REPOSITORY_PATH="$TARGET_WORKTREE" bun "$DEV_WORKSPACE/tools/release-automation/src/sync/sync-worker.ts"

  merge:
    name: Revalidate and merge trusted sync PR
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'dev' &&
      startsWith(github.event.workflow_run.display_title, 'seed-release-validation:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Checkout trusted dev workflow
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Verify immutable automation diff and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun tools/release-automation/src/sync/sync-merge.ts

  alert:
    name: Alert synchronization blockers
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.operation == 'alert')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Find and comment on synchronization blockers
        id: blockers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun tools/release-automation/src/sync/sync-alert.ts
      - name: Notify Slack
        if: steps.blockers.outputs.count != '0'
        continue-on-error: true
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "SEED release sync blockers need attention: ${{ steps.blockers.outputs.urls }}"
