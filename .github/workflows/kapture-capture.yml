name: Kapture Capture
on:
  pull_request:
    branches:
      - dev
      - minor
      - major
    types:
      - opened
      - synchronize
      - reopened
      - edited
    paths:
      - docs/registry/react/**
      - docs/stories/**
      - docs/.storybook/**
      - docs/public/**
      - docs/package.json
      - packages/react/**
      - packages/react-headless/**
      - packages/css/**
      - packages/qvism-preset/**
      - ecosystem/rootage/**
      - bun.lock
      - package.json
      - scripts/kapture-*.test.ts
      - .github/workflows/kapture-*.yml
permissions:
  contents: read
  pull-requests: read
env:
  KAPTURE_CLI_VERSION: "0.11.0"
  # 캐시 검증·복원에 실패해도 일반 캡처로 복귀합니다.
  KAPTURE_CAPTURE_CACHE: "true"
  KAPTURE_CACHE_RETENTION_DAYS: "7"
  KAPTURE_CAPTURE_WORKFLOW: .github/workflows/kapture-capture.yml
concurrency:
  group: kapture-capture-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflow-tests:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test scripts/kapture-workflows.test.ts
  context:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      npm_config_ignore_scripts: "true"
    outputs:
      integration-mode: ${{ steps.context.outputs.integration-mode }}
      artifact-suffix: ${{ steps.context.outputs.artifact-suffix }}
      base-repository: ${{ steps.context.outputs.base-repository }}
      base-sha: ${{ steps.context.outputs.base-sha }}
      head-repository: ${{ steps.context.outputs.head-repository }}
      head-sha: ${{ steps.context.outputs.head-sha }}
      context-artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      context-artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KAPTURE_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          bunx "@kaptures/cli@$KAPTURE_CLI_VERSION" github context --base-branch "$KAPTURE_BASE_BRANCH" --allow-initial-adoption --adapter-package-json docs/package.json --output "${{ runner.temp }}/kapture-context/context.json" --changed-files-output "${{ runner.temp }}/kapture-context/changed-files.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: artifact
        if: steps.context.outputs.integration-mode == 'compare'
        with:
          name: kapture-context-${{ steps.context.outputs.artifact-suffix }}
          path: ${{ runner.temp }}/kapture-context
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  build-base:
    needs: context
    if: needs.context.outputs.integration-mode == 'compare'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ needs.context.outputs.base-repository }}
          ref: ${{ needs.context.outputs.base-sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Restore verified exact-base build
        id: cache
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_registry: https://registry.npmjs.org/
          npm_config_ignore_scripts: "true"
        run: >-
          bunx "@kaptures/cli@$KAPTURE_CLI_VERSION" github restore-build
          --workflow "$KAPTURE_CAPTURE_WORKFLOW"
      - name: Install project dependencies
        if: steps.cache.outputs.cache-directory == ''
        run: |
          bun install --frozen-lockfile
          bun ecosystem:build
          bun install --frozen-lockfile
          bun packages:build
      - name: Build Storybook
        if: steps.cache.outputs.cache-directory == ''
        run: |
          bun storybook:build -- --output-dir "$PWD/docs/.kapture/storybook-static"
      - name: Validate build boundary
        if: steps.cache.outputs.cache-directory == ''
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_ignore_scripts: "true"
        run: bunx "@kaptures/cli@$KAPTURE_CLI_VERSION" github validate-build --root . --directory docs/.kapture/storybook-static
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: artifact
        with:
          name: kapture-storybook-base-${{ needs.context.outputs.artifact-suffix }}
          path: ${{ steps.cache.outputs.cache-directory || 'docs/.kapture/storybook-static' }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1
      - name: Retain reusable base build
        continue-on-error: true
        if: steps.cache.outputs.cache-name != '' && steps.cache.outputs.cache-directory == ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.cache.outputs.cache-name }}
          path: docs/.kapture/storybook-static
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ env.KAPTURE_CACHE_RETENTION_DAYS }}
          overwrite: true
  build-head:
    needs: context
    if: needs.context.outputs.integration-mode == 'compare' || needs.context.outputs.integration-mode == 'initial-adoption'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ needs.context.outputs.head-repository }}
          ref: ${{ needs.context.outputs.head-sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install project dependencies
        run: |
          bun install --frozen-lockfile
          bun ecosystem:build
          bun install --frozen-lockfile
          bun packages:build
      - name: Build Storybook
        run: |
          bun storybook:build -- --output-dir "$PWD/docs/.kapture/storybook-static"
      - name: Validate build boundary
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_ignore_scripts: "true"
        run: bunx "@kaptures/cli@$KAPTURE_CLI_VERSION" github validate-build --root . --directory docs/.kapture/storybook-static
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: artifact
        with:
          name: kapture-storybook-head-${{ needs.context.outputs.artifact-suffix }}
          path: docs/.kapture/storybook-static
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1
  setup-capture:
    needs: [context, build-head]
    if: needs.context.outputs.integration-mode == 'initial-adoption'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      npm_config_registry: https://registry.npmjs.org/
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install the project's pinned CJK font
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk=1:20230817+repack1-3
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ needs.build-head.outputs.artifact-id }}
          path: ${{ runner.temp }}/storybook
      - id: capture
        continue-on-error: true
        run: >-
          bunx "@kaptures/cli@$KAPTURE_CLI_VERSION" setup capture
          --head-dir "${{ runner.temp }}/storybook"
          --base-revision ${{ needs.context.outputs.base-sha }}
          --head-revision ${{ needs.context.outputs.head-sha }}
          --output "${{ runner.temp }}/setup-capture" --install-browser --browser-with-deps
          --workers 4 --locale ko-KR --timezone Asia/Seoul
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: artifact
        with:
          name: kapture-setup-${{ needs.context.outputs.artifact-suffix }}
          path: |
            ${{ runner.temp }}/setup-capture/setup.json
            ${{ runner.temp }}/setup-capture/images/*.png
          if-no-files-found: error
          retention-days: 1
      - name: Link capture artifact
        if: steps.artifact.outputs.artifact-url != ''
        env:
          KAPTURE_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf '\n[Download capture artifact](%s)\n' "$KAPTURE_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.capture.outcome != 'success'
        run: exit 1
  capture:
    needs:
      - context
      - build-base
      - build-head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      npm_config_ignore_scripts: "true"
      YARN_ENABLE_SCRIPTS: "false"
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ needs.context.outputs.context-artifact-id }}
          path: ${{ runner.temp }}/kapture-context
      - name: Install the project's pinned CJK font
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk=1:20230817+repack1-3
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ needs.build-base.outputs.artifact-id }}
          path: ${{ runner.temp }}/kapture-storybook/base
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ needs.build-head.outputs.artifact-id }}
          path: ${{ runner.temp }}/kapture-storybook/head
      # 캐시 탐색·검증은 Kapture가 담당합니다. SEED는 workflow 경로와 보관 기간만 정합니다.
      - name: Restore merged head capture matching base
        id: capture-cache
        if: env.KAPTURE_CAPTURE_CACHE == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bunx "@kaptures/cli@$KAPTURE_CLI_VERSION" github restore-capture
          --base-dir "${{ runner.temp }}/kapture-storybook/base"
          --head-dir "${{ runner.temp }}/kapture-storybook/head"
          --base-revision ${{ needs.context.outputs.base-sha }}
          --workflow .github/workflows/kapture-capture.yml
      - id: capture
        env:
          KAPTURE_ARTIFACT_SUFFIX: ${{ needs.context.outputs.artifact-suffix }}
          KAPTURE_CONTEXT_ARTIFACT_ID: ${{ needs.context.outputs.context-artifact-id }}
          KAPTURE_CONTEXT_ARTIFACT_DIGEST: ${{ needs.context.outputs.context-artifact-digest }}
          KAPTURE_BASE_ARTIFACT_ID: ${{ needs.build-base.outputs.artifact-id }}
          KAPTURE_BASE_ARTIFACT_DIGEST: ${{ needs.build-base.outputs.artifact-digest }}
          KAPTURE_HEAD_ARTIFACT_ID: ${{ needs.build-head.outputs.artifact-id }}
          KAPTURE_HEAD_ARTIFACT_DIGEST: ${{ needs.build-head.outputs.artifact-digest }}
          KAPTURE_CACHE_DIRECTORY: ${{ steps.capture-cache.outputs.cache-directory }}
          KAPTURE_HEAD_CACHE_DIRECTORY: ${{ steps.capture-cache.outputs.head-cache-directory }}
        run: |
          cache_args=()
          if [ "$KAPTURE_CAPTURE_CACHE" = "true" ] && [ -n "$KAPTURE_CACHE_DIRECTORY" ] && [ -n "$KAPTURE_HEAD_CACHE_DIRECTORY" ]; then
            cache_args+=(--capture-cache-dir "$KAPTURE_CACHE_DIRECTORY" --capture-cache-output "$KAPTURE_HEAD_CACHE_DIRECTORY")
          fi
          bunx "@kaptures/cli@$KAPTURE_CLI_VERSION" test --github-artifacts --base-dir "${{ runner.temp }}/kapture-storybook/base" --head-dir "${{ runner.temp }}/kapture-storybook/head" --base-revision ${{ needs.context.outputs.base-sha }} --head-revision ${{ needs.context.outputs.head-sha }} --changed-files "${{ runner.temp }}/kapture-context/changed-files.json" --output "${{ runner.temp }}/kapture-result" --install-browser --browser-with-deps --workers 4 --pixel-color-threshold 0.2 --max-changed-pixel-percentage 0.1 --locale ko-KR --timezone Asia/Seoul "${cache_args[@]}"
      - name: Retain stable head capture for subsequent base comparisons
        if: env.KAPTURE_CAPTURE_CACHE == 'true' && steps.capture-cache.outputs.head-cache-name != ''
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.capture-cache.outputs.head-cache-name }}
          path: ${{ steps.capture-cache.outputs.head-cache-directory }}
          if-no-files-found: ignore
          retention-days: ${{ env.KAPTURE_CACHE_RETENTION_DAYS }}
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kapture-visual-report-${{ needs.context.outputs.artifact-suffix }}
          path: |
            ${{ steps.capture.outputs.report-path }}
            ${{ steps.capture.outputs.report-directory }}/capture-boundary.json
            ${{ steps.capture.outputs.report-directory }}/images/**/*.png
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 0
        id: report-artifact
    outputs:
      report-artifact-id: ${{ steps.report-artifact.outputs.artifact-id }}
