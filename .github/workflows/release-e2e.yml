name: Release automation E2E

on:
  pull_request:
    paths:
      - ".github/release/**"
      - ".github/workflows/release-*.yml"
      - ".github/workflows/rootage-release-contract.yml"
      - ".github/workflows/rootage-cdn-deploy.yml"
      - ".github/workflows/rootage-cdn-operations.yml"
      - "tools/rootage-cdn/**"
      - "tools/release-automation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release automation without production writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Run the same release verification used locally
        run: bun release:verify --skip-setup
