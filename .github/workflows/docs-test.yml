name: Test Docs

on:
  push:
    paths:
      - "docs/**/*"
      - "packages/css/**"
      - "packages/lynx-react/**"
      - "packages/lynx-css/**"
      - ".github/workflows/docs-test.yml"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Build dependencies
        run: bun packages:build

      - name: Run tests
        run: bun docs:test
