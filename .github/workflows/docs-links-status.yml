# `Validate docs links`는 브랜치 보호가 요구하는 commit status다. 실제 검사는
# docs를 빌드하는 alpha 배포 워크플로가 수행하는데, 그 워크플로에는 paths 필터가
# 있어서 docs와 무관한 PR에서는 아예 돌지 않는다. 그러면 required status가 영영
# 오지 않아 머지가 막힌다. 이 워크플로가 그 경우에 통과를 올려 막힘을 푼다.
#
# 아래 경로 목록은 `deploy-seed-design-docs-alpha-pages.yml`의 paths와 짝을 이룬다.
# 한쪽만 고치면 검사 없이 통과하거나 영영 pending으로 남는다. 함께 고쳐야 한다.
name: docs-links-status

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  skip-when-docs-untouched:
    name: docs-links-status
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect whether the PR can change the docs site
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          if git diff --name-only "$merge_base" "$HEAD_SHA" | grep -qE '^(docs/|packages/css/|packages/react-headless/|packages/react/|packages/lynx-react/|packages/lynx-css/|packages/stackflow/|\.github/workflows/deploy-seed-design-docs-alpha-pages\.yml|\.github/actions/setup/action\.yml|\.github/actions/(nextjs-cache|check-docs-links)/)'; then
            echo "docs-affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-affected=false" >> "$GITHUB_OUTPUT"
          fi

      # 포크 PR은 읽기 전용 토큰으로 돌아 `permissions:`와 무관하게 status를 쓸 수 없다.
      # 걸러내지 않으면 createCommitStatus가 403으로 죽어 job이 빨간불이 된다.
      - name: Pass docs link validation when nothing reaches the docs site
        if: >-
          ${{ steps.detect.outputs.docs-affected == 'false'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: 'Validate docs links',
              description: 'No change reaches the docs site, so there is nothing to check',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
