name: Test React

on:
  push:
    paths:
      - "packages/react/**/*"
      - ".github/workflows/react-test.yml"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build common dependencies
        run: bun --filter @seed-design/dom-utils build && bun headless:build && bun --filter @seed-design/react build

      - name: Run tests
        run: bun react:test
