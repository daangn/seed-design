on:
  push:
    branches:
      - "**"
      - "!main"
      - "!dev" # V3 deployment; remove this when V3 is stable
    paths:
      - "docs/**"
      - "scripts/docs-archive/**"
      - "packages/css/**"
      - "packages/react/**"
      - "packages/stackflow/**"
      - ".github/workflows/docs-deploy-alpha-pages.yml"
  workflow_dispatch:
    inputs:
      skip-figma-cache:
        description: 'Skip Figma image cache (fetch fresh images)'
        required: false
        type: boolean
        default: false

env:
  DOCS_ARCHIVE_SOURCE_BRANCH: react/v1.1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
  FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}

name: Deploy seed-design-v3 docs (Alpha)

jobs:
  deploy:
    name: Deploy Seed Design V3 Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Select archive build
        id: target
        run: bun scripts/docs-archive/build-target.ts

      - name: Restore Figma image cache
        if: ${{ !inputs.skip-figma-cache }}
        uses: actions/cache@v5
        with:
          path: docs/.cache/figma-image
          key: ${{ runner.os }}-figma-images-${{ hashFiles('docs/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-figma-images-

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: docs/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ steps.target.outputs.cache-generation }}-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ steps.target.outputs.cache-generation }}-${{ hashFiles('**/bun.lock') }}-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: bun packages:build && bun rootage:build

      - name: Test retained documentation and archive contracts
        if: steps.target.outputs.archive-version != ''
        run: bun test docs scripts/docs-archive/tests

      - name: Build matching archive Stackflow previews
        if: steps.target.outputs.archive-version != ''
        run: bun --filter @seed-design/stackflow-spa build

      - name: Deploy matching archive Stackflow previews
        if: steps.target.outputs.archive-version != ''
        id: stackflow
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.45.3"
          command: pages deploy ./examples/stackflow-spa/dist --project-name=seed-design-stackflow-spa --branch=${{ github.ref_name }}

      - name: Build Docs
        working-directory: ./docs
        env:
          NEXT_PUBLIC_ARCHIVE_STACKFLOW_URL: ${{ steps.stackflow.outputs.pages-deployment-alias-url }}
          FIGMA_CACHE_DISABLED: ${{ inputs.skip-figma-cache && '1' || '0' }}
        run: |
          if [ -n "${{ steps.target.outputs.archive-version }}" ]; then
            bun run build:archive:react "${{ steps.target.outputs.archive-version }}"
          else
            bun run build
          fi

      - name: Deploy docs at Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.45.3"
          command: pages deploy ./${{ steps.target.outputs.output-dir }} --project-name=seed-design-v3 --branch=${{ github.ref_name }}

      - name: Verify archive deployment and branch alias
        if: steps.target.outputs.archive-version != ''
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PAGES_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: bun scripts/docs-archive/verify-preview.ts
