name: Kapture Shadow Experiment

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - "docs/registry/react/**"
      - "docs/stories/**"
      - "docs/.storybook/**"
      - "docs/package.json"
      - "packages/react/**"
      - "packages/css/**"
      - "packages/qvism-preset/**"
      - "ecosystem/rootage/**"
      - "bun.lock"
      - ".github/workflows/kapture-*.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kapture-shadow-experiment-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  context:
    name: Bind exact pull request context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      integration-mode: ${{ steps.integration.outputs.integration-mode }}
      artifact-suffix: ${{ steps.context.outputs.artifact-suffix }}
      base-repository: ${{ steps.context.outputs.base-repository }}
      base-sha: ${{ steps.context.outputs.base-sha }}
      head-repository: ${{ steps.context.outputs.head-repository }}
      head-sha: ${{ steps.context.outputs.head-sha }}
      context-artifact-id: ${{ steps.context-artifact.outputs.artifact-id }}
      context-artifact-digest: ${{ steps.context-artifact.outputs.artifact-digest }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Bind exact pull request revisions
        id: context
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_registry: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          bunx @kaptures/cli@0.0.6 github context \
            --base-branch dev \
            --output "${{ runner.temp }}/kapture-context/context.json" \
            --changed-files-output "${{ runner.temp }}/kapture-context/changed-files.json"

      - name: Validate the optional bootstrap marker
        id: marker
        shell: bash
        env:
          KAPTURE_BOOTSTRAP_MARKER: ""
        run: |
          set -euo pipefail
          marker="$KAPTURE_BOOTSTRAP_MARKER"
          if [[ -z "$marker" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$marker" == /* || "$marker" == */ || "$marker" == *\\* ]]; then
            echo "bootstrap-marker must be a project-relative file path" >&2
            exit 1
          fi
          if [[ ! "$marker" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "bootstrap-marker contains unsupported characters" >&2
            exit 1
          fi
          IFS='/' read -ra segments <<< "$marker"
          for segment in "${segments[@]}"; do
            if [[ -z "$segment" || "$segment" == "." || "$segment" == ".." ]]; then
              echo "bootstrap-marker must not contain empty, dot, or parent segments" >&2
              exit 1
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Inspect the exact base marker without executing repository code
        if: steps.marker.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.context.outputs.base-repository }}
          ref: ${{ steps.context.outputs.base-sha }}
          path: .kapture/bootstrap/base
          persist-credentials: false
          sparse-checkout: .github/workflows/kapture-capture.yml
          sparse-checkout-cone-mode: false

      - name: Inspect the exact head marker without executing repository code
        if: steps.marker.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.context.outputs.head-repository }}
          ref: ${{ steps.context.outputs.head-sha }}
          path: .kapture/bootstrap/head
          persist-credentials: false
          sparse-checkout: .github/workflows/kapture-capture.yml
          sparse-checkout-cone-mode: false

      - name: Resolve bootstrap integration mode
        id: integration
        shell: bash
        env:
          KAPTURE_BOOTSTRAP_MARKER: ""
        run: |
          set -euo pipefail
          marker="$KAPTURE_BOOTSTRAP_MARKER"
          if [[ -z "$marker" ]]; then
            echo "integration-mode=compare" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_marker="$GITHUB_WORKSPACE/.kapture/bootstrap/base/$marker"
          head_marker="$GITHUB_WORKSPACE/.kapture/bootstrap/head/$marker"
          if [[ ! -f "$head_marker" || -L "$head_marker" ]]; then
            echo "bootstrap-marker must exist as a regular file at the exact head revision" >&2
            exit 1
          fi
          if [[ -f "$base_marker" && ! -L "$base_marker" ]]; then
            echo "integration-mode=compare" >> "$GITHUB_OUTPUT"
          else
            echo "integration-mode=bootstrap-skip" >> "$GITHUB_OUTPUT"
            echo "Kapture bootstrap detected; visual comparison is intentionally skipped for this run."
          fi

      - name: Mark the exact head revision as pending
        if: steps.integration.outputs.integration-mode == 'compare'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          KAPTURE_HEAD_SHA: ${{ steps.context.outputs.head-sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.KAPTURE_HEAD_SHA,
              state: 'pending',
              context: 'SEED Kapture Shadow Experiment',
              description: 'Storybook pixel comparison is running',
            });

      - name: Upload the transient context boundary
        id: context-artifact
        if: steps.integration.outputs.integration-mode == 'compare'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kapture-context-${{ steps.context.outputs.artifact-suffix }}
          path: |
            ${{ steps.context.outputs.context-path }}
            ${{ steps.context.outputs.changed-files-path }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1
  build-base:
    name: Build exact base Storybook
    if: needs.context.outputs.integration-mode == 'compare'
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.storybook-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.storybook-artifact.outputs.artifact-digest }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the exact base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ needs.context.outputs.base-repository }}
          ref: ${{ needs.context.outputs.base-sha }}
          path: .kapture/source
          persist-credentials: false

      - name: Checkout only the head instrumentation files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ needs.context.outputs.head-repository }}
          ref: ${{ needs.context.outputs.head-sha }}
          path: .kapture/instrumentation
          persist-credentials: false
          sparse-checkout: |
            bun.lock
            docs/.storybook/main.ts
            docs/.storybook/preview.ts
            docs/package.json
            docs/stories/utils/parameters.ts
          sparse-checkout-cone-mode: false

      - name: Instrument the exact base without copying head story content
        shell: bash
        env:
          KAPTURE_BASE_SOURCE: .kapture/source
          KAPTURE_INSTRUMENTATION_SOURCE: .kapture/instrumentation
        run: |
          set -euo pipefail
          cp "$KAPTURE_INSTRUMENTATION_SOURCE/bun.lock" "$KAPTURE_BASE_SOURCE/bun.lock"
          cp "$KAPTURE_INSTRUMENTATION_SOURCE/docs/package.json" "$KAPTURE_BASE_SOURCE/docs/package.json"
          cp "$KAPTURE_INSTRUMENTATION_SOURCE/docs/.storybook/main.ts" \
            "$KAPTURE_BASE_SOURCE/docs/.storybook/main.ts"
          cp "$KAPTURE_INSTRUMENTATION_SOURCE/docs/.storybook/preview.ts" \
            "$KAPTURE_BASE_SOURCE/docs/.storybook/preview.ts"
          cp "$KAPTURE_INSTRUMENTATION_SOURCE/docs/stories/utils/parameters.ts" \
            "$KAPTURE_BASE_SOURCE/docs/stories/utils/parameters.ts"

          find "$KAPTURE_BASE_SOURCE/docs/stories" -name '*.stories.tsx' -type f \
            -exec perl -0pi -e \
              's/chromatic: \{ modes: VIEWPORT_MODES \},/...VISUAL_VIEWPORT_PARAMETERS,/g; s/withChromaticParameters/withVisualTestParameters/g; s/VIEWPORT_MODES/VISUAL_VIEWPORT_PARAMETERS/g' \
              {} +

          if rg -n 'withChromaticParameters|VIEWPORT_MODES' \
            "$KAPTURE_BASE_SOURCE/docs/stories"; then
            echo "Base Storybook instrumentation left an unsupported Chromatic-only helper" >&2
            exit 1
          fi

      - name: Validate the Storybook output input
        working-directory: .kapture/source
        shell: bash
        env:
          KAPTURE_STORYBOOK_OUTPUT: docs/.kapture/storybook-static
        run: |
          set -euo pipefail
          output="$KAPTURE_STORYBOOK_OUTPUT"
          if [[ -z "$output" || "$output" == /* || "$output" == */ || "$output" == *\\* ]]; then
            echo "storybook-output must be a project-relative directory" >&2
            exit 1
          fi
          if [[ ! "$output" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "storybook-output contains unsupported characters" >&2
            exit 1
          fi
          IFS='/' read -ra segments <<< "$output"
          for segment in "${segments[@]}"; do
            if [[ -z "$segment" || "$segment" == "." || "$segment" == ".." ]]; then
              echo "storybook-output must not contain empty, dot, or parent segments" >&2
              exit 1
            fi
          done

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        working-directory: .kapture/source
        shell: bash
        env:
          KAPTURE_STORYBOOK_OUTPUT: docs/.kapture/storybook-static
        run: |
          bun install --frozen-lockfile
          bun ecosystem:build
          bun install --frozen-lockfile
          bun packages:build

      - name: Build Storybook
        working-directory: .kapture/source
        shell: bash
        env:
          KAPTURE_STORYBOOK_OUTPUT: docs/.kapture/storybook-static
        run: |
          bun storybook:build -- --output-dir "$PWD/$KAPTURE_STORYBOOK_OUTPUT"

      - name: Validate the Storybook output boundary
        working-directory: .kapture/source
        shell: bash
        env:
          KAPTURE_STORYBOOK_OUTPUT: docs/.kapture/storybook-static
        run: |
          set -euo pipefail
          output="$KAPTURE_STORYBOOK_OUTPUT"
          if [[ ! -d "$output" || -L "$output" ]]; then
            echo "storybook-output must exist as a non-symlink directory" >&2
            exit 1
          fi

          inventory="$(mktemp "$RUNNER_TEMP/kapture-storybook-inventory.XXXXXX")"
          find "$output" -xdev -mindepth 1 -print0 > "$inventory"

          file_count=0
          total_bytes=0
          while IFS= read -r -d '' entry; do
            if [[ -L "$entry" ]]; then
              echo "storybook-output must not contain symbolic links" >&2
              exit 1
            fi
            if [[ -d "$entry" ]]; then
              continue
            fi
            if [[ ! -f "$entry" ]]; then
              echo "storybook-output must contain only regular files and directories" >&2
              exit 1
            fi

            size="$(stat -c '%s' -- "$entry")"
            file_count=$((file_count + 1))
            total_bytes=$((total_bytes + size))
            if (( file_count > 100000 )); then
              echo "storybook-output exceeds the 100000 file limit" >&2
              exit 1
            fi
            if (( size > 104857600 )); then
              echo "storybook-output contains a file larger than 100 MiB" >&2
              exit 1
            fi
            if (( total_bytes > 1073741824 )); then
              echo "storybook-output exceeds the 1 GiB uncompressed limit" >&2
              exit 1
            fi
          done < "$inventory"
          echo "Validated $file_count Storybook files ($total_bytes bytes)."

      - name: Upload the exact base Storybook
        id: storybook-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kapture-storybook-base-${{ needs.context.outputs.artifact-suffix }}
          path: .kapture/source/docs/.kapture/storybook-static
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

  build-head:
    name: Build exact head Storybook
    if: needs.context.outputs.integration-mode == 'compare'
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.storybook-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.storybook-artifact.outputs.artifact-digest }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the exact head revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ needs.context.outputs.head-repository }}
          ref: ${{ needs.context.outputs.head-sha }}
          path: .kapture/source
          persist-credentials: false

      - name: Validate the Storybook output input
        working-directory: .kapture/source
        shell: bash
        env:
          KAPTURE_STORYBOOK_OUTPUT: docs/.kapture/storybook-static
        run: |
          set -euo pipefail
          output="$KAPTURE_STORYBOOK_OUTPUT"
          if [[ -z "$output" || "$output" == /* || "$output" == */ || "$output" == *\\* ]]; then
            echo "storybook-output must be a project-relative directory" >&2
            exit 1
          fi
          if [[ ! "$output" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "storybook-output contains unsupported characters" >&2
            exit 1
          fi
          IFS='/' read -ra segments <<< "$output"
          for segment in "${segments[@]}"; do
            if [[ -z "$segment" || "$segment" == "." || "$segment" == ".." ]]; then
              echo "storybook-output must not contain empty, dot, or parent segments" >&2
              exit 1
            fi
          done

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        working-directory: .kapture/source
        shell: bash
        env:
          KAPTURE_STORYBOOK_OUTPUT: docs/.kapture/storybook-static
        run: |
          bun install --frozen-lockfile
          bun ecosystem:build
          bun install --frozen-lockfile
          bun packages:build

      - name: Build Storybook
        working-directory: .kapture/source
        shell: bash
        env:
          KAPTURE_STORYBOOK_OUTPUT: docs/.kapture/storybook-static
        run: |
          bun storybook:build -- --output-dir "$PWD/$KAPTURE_STORYBOOK_OUTPUT"

      - name: Validate the Storybook output boundary
        working-directory: .kapture/source
        shell: bash
        env:
          KAPTURE_STORYBOOK_OUTPUT: docs/.kapture/storybook-static
        run: |
          set -euo pipefail
          output="$KAPTURE_STORYBOOK_OUTPUT"
          if [[ ! -d "$output" || -L "$output" ]]; then
            echo "storybook-output must exist as a non-symlink directory" >&2
            exit 1
          fi

          inventory="$(mktemp "$RUNNER_TEMP/kapture-storybook-inventory.XXXXXX")"
          find "$output" -xdev -mindepth 1 -print0 > "$inventory"

          file_count=0
          total_bytes=0
          while IFS= read -r -d '' entry; do
            if [[ -L "$entry" ]]; then
              echo "storybook-output must not contain symbolic links" >&2
              exit 1
            fi
            if [[ -d "$entry" ]]; then
              continue
            fi
            if [[ ! -f "$entry" ]]; then
              echo "storybook-output must contain only regular files and directories" >&2
              exit 1
            fi

            size="$(stat -c '%s' -- "$entry")"
            file_count=$((file_count + 1))
            total_bytes=$((total_bytes + size))
            if (( file_count > 100000 )); then
              echo "storybook-output exceeds the 100000 file limit" >&2
              exit 1
            fi
            if (( size > 104857600 )); then
              echo "storybook-output contains a file larger than 100 MiB" >&2
              exit 1
            fi
            if (( total_bytes > 1073741824 )); then
              echo "storybook-output exceeds the 1 GiB uncompressed limit" >&2
              exit 1
            fi
          done < "$inventory"
          echo "Validated $file_count Storybook files ($total_bytes bytes)."

      - name: Upload the exact head Storybook
        id: storybook-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kapture-storybook-head-${{ needs.context.outputs.artifact-suffix }}
          path: .kapture/source/docs/.kapture/storybook-static
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

  capture:
    name: Capture affected Stories
    if: needs.context.outputs.integration-mode == 'compare'
    needs: [context, build-base, build-head]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      report-artifact-name: ${{ steps.artifact.outputs.name }}
      report-artifact-id: ${{ steps.report-artifact.outputs.artifact-id }}
      report-artifact-digest: ${{ steps.report-artifact.outputs.artifact-digest }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Validate optional capture runner packages
        id: apt
        shell: bash
        env:
          KAPTURE_APT_PACKAGES: fonts-noto-cjk=1:20230817+repack1-3
        run: |
          set -euo pipefail
          raw="$KAPTURE_APT_PACKAGES"
          if [[ -z "$raw" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$raw" == *$'\n'* || "$raw" == *$'\r'* ]]; then
            echo "apt-packages must be a single whitespace-separated line" >&2
            exit 1
          fi

          read -ra packages <<< "$raw"
          if (( ${#packages[@]} == 0 )); then
            echo "apt-packages must contain at least one package name" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            if [[ ! "$package" =~ ^[a-z0-9][a-z0-9+.-]*(:[a-z0-9][a-z0-9-]*)?(=[0-9A-Za-z.+:~_-]+)?$ ]]; then
              echo "apt-packages contains an invalid Debian package token" >&2
              exit 1
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "packages=${packages[*]}" >> "$GITHUB_OUTPUT"

      - name: Install capture runner packages
        if: steps.apt.outputs.enabled == 'true'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          KAPTURE_APT_PACKAGES: ${{ steps.apt.outputs.packages }}
        run: |
          set -euo pipefail
          read -ra packages <<< "$KAPTURE_APT_PACKAGES"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"

      - name: Download the exact context boundary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.context.outputs.context-artifact-id }}
          path: ${{ runner.temp }}/kapture-context

      - name: Download the exact base Storybook
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.build-base.outputs.artifact-id }}
          path: ${{ runner.temp }}/kapture-storybook/base

      - name: Download the exact head Storybook
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.build-head.outputs.artifact-id }}
          path: ${{ runner.temp }}/kapture-storybook/head

      - name: Validate the downloaded Storybook boundaries
        shell: bash
        env:
          KAPTURE_BASE_STORYBOOK: ${{ runner.temp }}/kapture-storybook/base
          KAPTURE_HEAD_STORYBOOK: ${{ runner.temp }}/kapture-storybook/head
        run: |
          set -euo pipefail
          for output in "$KAPTURE_BASE_STORYBOOK" "$KAPTURE_HEAD_STORYBOOK"; do
            if [[ ! -d "$output" || -L "$output" ]]; then
              echo "downloaded Storybook must be a non-symlink directory" >&2
              exit 1
            fi

            inventory="$(mktemp "$RUNNER_TEMP/kapture-downloaded-inventory.XXXXXX")"
            find "$output" -xdev -mindepth 1 -print0 > "$inventory"
            file_count=0
            total_bytes=0
            while IFS= read -r -d '' entry; do
              if [[ -L "$entry" ]]; then
                echo "downloaded Storybook must not contain symbolic links" >&2
                exit 1
              fi
              if [[ -d "$entry" ]]; then
                continue
              fi
              if [[ ! -f "$entry" ]]; then
                echo "downloaded Storybook must contain only regular files and directories" >&2
                exit 1
              fi
              size="$(stat -c '%s' -- "$entry")"
              file_count=$((file_count + 1))
              total_bytes=$((total_bytes + size))
              if (( file_count > 100000 || size > 104857600 || total_bytes > 1073741824 )); then
                echo "downloaded Storybook exceeds its file or size boundary" >&2
                exit 1
              fi
            done < "$inventory"
          done

      - name: Capture only affected Stories in isolated browsers
        id: kapture
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: |
          set -uo pipefail
          bunx @kaptures/cli@0.0.6 test \
            --base-dir "${{ runner.temp }}/kapture-storybook/base" \
            --head-dir "${{ runner.temp }}/kapture-storybook/head" \
            --base-revision "${{ needs.context.outputs.base-sha }}" \
            --head-revision "${{ needs.context.outputs.head-sha }}" \
            --changed-files "${{ runner.temp }}/kapture-context/changed-files.json" \
            --output "${{ runner.temp }}/kapture-result" \
            --install-browser \
            --browser-with-deps \
            --workers 2 \
            --pixel-threshold 0.2 \
            --max-diff-ratio 0 \
            --frozen-time 2026-01-01T00:00:00.000Z \
            --random-seed 20260101 \
            --locale ko-KR \
            --timezone Asia/Seoul
          exit_code=$?
          if [[ "$exit_code" -ne 0 && "$exit_code" -ne 2 ]]; then
            exit "$exit_code"
          fi
          report_directory="${{ runner.temp }}/kapture-result/report"
          {
            echo "report-directory=$report_directory"
            echo "report-path=$report_directory/report.json"
          } >> "$GITHUB_OUTPUT"

      - name: Bind the exact downloaded artifact identities
        shell: bash
        env:
          KAPTURE_BOUNDARY_PATH: ${{ steps.kapture.outputs.report-directory }}/capture-boundary.json
          KAPTURE_ARTIFACT_SUFFIX: ${{ needs.context.outputs.artifact-suffix }}
          KAPTURE_CONTEXT_ARTIFACT_ID: ${{ needs.context.outputs.context-artifact-id }}
          KAPTURE_CONTEXT_ARTIFACT_DIGEST: ${{ needs.context.outputs.context-artifact-digest }}
          KAPTURE_BASE_ARTIFACT_ID: ${{ needs.build-base.outputs.artifact-id }}
          KAPTURE_BASE_ARTIFACT_DIGEST: ${{ needs.build-base.outputs.artifact-digest }}
          KAPTURE_HEAD_ARTIFACT_ID: ${{ needs.build-head.outputs.artifact-id }}
          KAPTURE_HEAD_ARTIFACT_DIGEST: ${{ needs.build-head.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { writeFile } from "node:fs/promises";

            const required = (name) => {
              const value = process.env[name];
              if (!value) throw new Error(`${name} is required`);
              return value;
            };
            const artifact = (label, idName, digestName, name) => {
              const id = required(idName);
              const digest = required(digestName);
              if (!/^[1-9][0-9]*$/.test(id) || !Number.isSafeInteger(Number(id))) {
                throw new Error(`${label} artifact ID is invalid`);
              }
              if (!/^[0-9a-f]{64}$/.test(digest)) {
                throw new Error(`${label} artifact digest is invalid`);
              }
              return { id: Number(id), name, digest: `sha256:${digest}` };
            };

            const suffix = required("KAPTURE_ARTIFACT_SUFFIX");
            if (!/^pr-[1-9][0-9]*-base-[0-9a-f]{40}-head-[0-9a-f]{40}$/.test(suffix)) {
              throw new Error("artifact suffix is invalid");
            }
            const boundary = {
              schemaVersion: 1,
              artifacts: {
                context: artifact(
                  "context",
                  "KAPTURE_CONTEXT_ARTIFACT_ID",
                  "KAPTURE_CONTEXT_ARTIFACT_DIGEST",
                  `kapture-context-${suffix}`,
                ),
                baseStorybook: artifact(
                  "base Storybook",
                  "KAPTURE_BASE_ARTIFACT_ID",
                  "KAPTURE_BASE_ARTIFACT_DIGEST",
                  `kapture-storybook-base-${suffix}`,
                ),
                headStorybook: artifact(
                  "head Storybook",
                  "KAPTURE_HEAD_ARTIFACT_ID",
                  "KAPTURE_HEAD_ARTIFACT_DIGEST",
                  `kapture-storybook-head-${suffix}`,
                ),
              },
            };
            await writeFile(
              required("KAPTURE_BOUNDARY_PATH"),
              `${JSON.stringify(boundary)}\n`,
              { encoding: "utf8", flag: "wx", mode: 0o600 },
            );
          '

      - name: Bind the report artifact name
        id: artifact
        shell: bash
        env:
          KAPTURE_ARTIFACT_SUFFIX: ${{ needs.context.outputs.artifact-suffix }}
        run: echo "name=kapture-visual-report-$KAPTURE_ARTIFACT_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Upload transient report JSON and referenced PNGs
        id: report-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.kapture.outputs.report-path }}
            ${{ steps.kapture.outputs.report-directory }}/capture-boundary.json
            ${{ steps.kapture.outputs.report-directory }}/images/**/*.png
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          compression-level: 0
          retention-days: 1

  publish-experiment:
    name: Publish the experimental dashboard and review comment
    needs: [context, build-head, capture]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      report-digest: ${{ steps.report.outputs.digest }}
      dashboard-url: ${{ steps.dashboard.outputs.immutable-url }}
      published-at: ${{ steps.comment.outputs.published-at }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Download the exact raw report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.capture.outputs.report-artifact-id }}
          path: ${{ runner.temp }}/kapture-raw

      - name: Download the exact head Storybook
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.build-head.outputs.artifact-id }}
          path: ${{ runner.temp }}/kapture-head-storybook

      - name: Rebuild the dashboard from validated JSON and PNG files
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          bunx @kaptures/cli@0.0.6 report build \
            --input "${{ runner.temp }}/kapture-raw" \
            --output "${{ runner.temp }}/kapture-review" \
            --storybook-url ./storybook/
          mkdir "${{ runner.temp }}/kapture-review/storybook"
          cp -R "${{ runner.temp }}/kapture-head-storybook"/. \
            "${{ runner.temp }}/kapture-review/storybook/"

      - name: Bind the exact report summary and digest
        id: report
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          KAPTURE_REPORT_PATH: ${{ runner.temp }}/kapture-review/report.json
          KAPTURE_EXPECTED_BASE_SHA: ${{ needs.context.outputs.base-sha }}
          KAPTURE_EXPECTED_HEAD_SHA: ${{ needs.context.outputs.head-sha }}
        with:
          script: |
            const { readFile } = require('node:fs/promises');
            const report = JSON.parse(await readFile(process.env.KAPTURE_REPORT_PATH, 'utf8'));
            if (report.baseRevision !== process.env.KAPTURE_EXPECTED_BASE_SHA) {
              throw new Error('The report base revision does not match the pull request');
            }
            if (report.headRevision !== process.env.KAPTURE_EXPECTED_HEAD_SHA) {
              throw new Error('The report head revision does not match the pull request');
            }
            if (!/^[0-9a-f]{64}$/.test(report.contentDigest || '')) {
              throw new Error('The trusted report does not contain a valid content digest');
            }
            for (const key of ['total', 'unchanged', 'changed', 'added', 'removed', 'errors']) {
              const value = report.summary?.[key];
              if (!Number.isSafeInteger(value) || value < 0) {
                throw new Error(`Invalid report summary field: ${key}`);
              }
              core.setOutput(key, String(value));
            }
            core.setOutput('digest', report.contentDigest);

      - name: Deploy the dashboard and exact Storybook to the existing Pages project
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.45.3"
          command: >-
            pages deploy ${{ runner.temp }}/kapture-review
            --project-name=seed-design-storybook
            --branch=kapture-shadow-pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ needs.context.outputs.head-sha }}

      - name: Accept only the immutable deployment URL
        id: dashboard
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = new URL((process.env.DEPLOYMENT_URL || '').trim());
            if (
              url.protocol !== 'https:' ||
              !/^[0-9a-f]{8}\.seed-design-storybook\.pages\.dev$/.test(url.hostname) ||
              url.username || url.password || url.pathname !== '/' || url.search || url.hash
            ) {
              throw new Error('The deploy step did not return an immutable Storybook Pages URL');
            }
            core.setOutput('immutable-url', url.toString());

      - name: Publish the experimental review comment and pending status
        id: comment
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          KAPTURE_DASHBOARD_URL: ${{ steps.dashboard.outputs.immutable-url }}
          KAPTURE_HEAD_SHA: ${{ needs.context.outputs.head-sha }}
          KAPTURE_REPORT_DIGEST: ${{ steps.report.outputs.digest }}
          KAPTURE_TOTAL: ${{ steps.report.outputs.total }}
          KAPTURE_UNCHANGED: ${{ steps.report.outputs.unchanged }}
          KAPTURE_CHANGED: ${{ steps.report.outputs.changed }}
          KAPTURE_ADDED: ${{ steps.report.outputs.added }}
          KAPTURE_REMOVED: ${{ steps.report.outputs.removed }}
          KAPTURE_ERRORS: ${{ steps.report.outputs.errors }}
        with:
          script: |
            const marker = '<!-- seed-kapture-shadow-experiment -->';
            const dashboard = new URL(process.env.KAPTURE_DASHBOARD_URL);
            const storybook = new URL('./storybook/', dashboard);
            const command = `/kapture approve ${process.env.KAPTURE_HEAD_SHA} ${process.env.KAPTURE_REPORT_DIGEST}`;
            const body = [
              marker,
              '## Kapture shadow experiment',
              '',
              `- [Pixel comparison dashboard](${dashboard})`,
              `- [Exact head Storybook](${storybook})`,
              `- Snapshots: ${process.env.KAPTURE_TOTAL}`,
              `- Unchanged: ${process.env.KAPTURE_UNCHANGED}`,
              `- Changed: ${process.env.KAPTURE_CHANGED}`,
              `- Added: ${process.env.KAPTURE_ADDED}`,
              `- Removed: ${process.env.KAPTURE_REMOVED}`,
              `- Errors: ${process.env.KAPTURE_ERRORS}`,
              `- Head: \`${process.env.KAPTURE_HEAD_SHA}\``,
              `- Report digest: \`${process.env.KAPTURE_REPORT_DIGEST}\``,
              '',
              '검토 후 아래 명령을 이 PR에 정확히 댓글로 남기면 이 실험 run이 승인됩니다.',
              '',
              `\`${command}\``,
              '',
              '> 이 댓글 승인기는 기본 브랜치에 workflow를 설치하지 않고 단일 PR에서 UX를 검증하기 위한 bounded harness입니다.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.KAPTURE_HEAD_SHA,
              state: 'pending',
              context: 'SEED Kapture Shadow Experiment',
              description: 'Pixel changes are waiting for an exact comment approval',
              target_url: dashboard.toString(),
            });
            core.setOutput('published-at', new Date().toISOString());

  approve-experiment:
    name: Wait for an exact SHA and digest approval comment
    needs: [context, publish-experiment]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Accept one exact authorized approval comment
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          KAPTURE_DASHBOARD_URL: ${{ needs.publish-experiment.outputs.dashboard-url }}
          KAPTURE_HEAD_SHA: ${{ needs.context.outputs.head-sha }}
          KAPTURE_REPORT_DIGEST: ${{ needs.publish-experiment.outputs.report-digest }}
          KAPTURE_PUBLISHED_AT: ${{ needs.publish-experiment.outputs.published-at }}
        with:
          script: |
            const command = `/kapture approve ${process.env.KAPTURE_HEAD_SHA} ${process.env.KAPTURE_REPORT_DIGEST}`;
            const publishedAt = Date.parse(process.env.KAPTURE_PUBLISHED_AT);
            const allowed = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            let approval;
            for (let attempt = 0; attempt < 100; attempt += 1) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              approval = comments.find((comment) =>
                comment.body?.trim() === command &&
                allowed.has(comment.author_association) &&
                Date.parse(comment.created_at) >= publishedAt
              );
              if (approval) break;
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            if (!approval) {
              throw new Error(`Timed out waiting for exact approval command: ${command}`);
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.KAPTURE_HEAD_SHA,
              state: 'success',
              context: 'SEED Kapture Shadow Experiment',
              description: `Approved by @${approval.user.login}`,
              target_url: process.env.KAPTURE_DASHBOARD_URL,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Kapture shadow report approved by @${approval.user.login} for \`${process.env.KAPTURE_HEAD_SHA}\`.`,
            });

  finalize-experiment:
    name: Finalize the exact head status
    if: always() && needs.context.result == 'success' && needs.approve-experiment.result != 'success'
    needs: [context, publish-experiment, approve-experiment]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Mark an incomplete experiment as failed
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          KAPTURE_HEAD_SHA: ${{ needs.context.outputs.head-sha }}
          KAPTURE_DASHBOARD_URL: ${{ needs.publish-experiment.outputs.dashboard-url }}
        with:
          script: |
            const status = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.KAPTURE_HEAD_SHA,
              state: 'failure',
              context: 'SEED Kapture Shadow Experiment',
              description: 'The shadow experiment did not complete or receive approval',
            };
            if (process.env.KAPTURE_DASHBOARD_URL) {
              status.target_url = process.env.KAPTURE_DASHBOARD_URL;
            }
            await github.rest.repos.createCommitStatus(status);
