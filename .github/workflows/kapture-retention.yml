name: Kapture Retention
on:
  schedule:
    - cron: "23 19 * * *"
  pull_request_target:
    types: [closed]
    branches: [dev, minor, major]
  workflow_run:
    workflows: [Kapture Capture]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: List candidates without deleting artifacts or deployments
        type: boolean
        default: true
permissions: {}
concurrency:
  group: kapture-review-${{ github.repository }}
  cancel-in-progress: false
  queue: max
jobs:
  cleanup:
    # Never run privileged cleanup code from a workflow_dispatch feature ref.
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      pull-requests: read
      issues: write
      statuses: read
    steps:
      - name: Check out trusted policy only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Prune reusable builds
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
        with:
          script: |
            const { cleanupBuilds } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/kapture-retention.mjs`);
            await cleanupBuilds({ github, context, core, dryRun: process.env.DRY_RUN === 'true' });
      - name: Prune expired PR previews
        # Daily reconciliation catches missed close events and late uploads.
        if: github.event_name != 'workflow_run'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
        with:
          script: |
            const { cleanupPreviews, cloudflareClient } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/kapture-retention.mjs`);
            const cf = cloudflareClient({ accountId: process.env.CF_ACCOUNT_ID, token: process.env.CF_API_TOKEN });
            await cleanupPreviews({ github, context, core, cf, dryRun: process.env.DRY_RUN === 'true' });
