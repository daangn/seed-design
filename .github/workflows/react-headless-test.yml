name: Test React Headless

on:
  push:
    paths:
      - "packages/react-headless/**/*"
      - ".github/workflows/react-headless-test.yml"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # running fumadocs-mdx in docs requires these
  FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
  FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build headless common dependencies
        run: bun --filter @seed-design/dom-utils build && bun headless:build

      - name: Run tests
        run: bun headless:test
