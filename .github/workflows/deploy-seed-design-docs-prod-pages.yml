on:
  push:
    branches:
      - main
      - dev # V3 deployment; remove this when V3 is stable
    paths:
      - "docs/**"
      - "packages/css/**"
      - "packages/react/**"
      - "packages/lynx-react/**"
      - "packages/lynx-css/**"
      - "packages/stackflow/**"
      - ".github/workflows/deploy-seed-design-docs-prod-pages.yml"
      - ".github/actions/setup/action.yml"
      - ".bun-version"
      - ".github/actions/docs-build-cache/**"
      - ".github/actions/check-docs-links/**"
  workflow_dispatch:
    inputs:
      skip-figma-cache:
        description: "Skip Figma image cache (fetch fresh images)"
        required: false
        type: boolean
        default: false
      bypass-cache-node-ids:
        description: "Comma-separated Figma node IDs to bypass cache for (fetch fresh)"
        required: false
        type: string
        default: ""
      skip-page-cache:
        description: "Render every page instead of restoring unchanged pages from the cache"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
  FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}

name: deploy-seed-design-docs-prod-pages

jobs:
  deploy:
    name: deploy-seed-design-docs-prod-pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FIGMA_CACHE_DISABLED: ${{ inputs.skip-figma-cache && '1' || '0' }}
      FIGMA_BYPASS_CACHE_NODE_IDS: ${{ inputs.bypass-cache-node-ids }}
      # 정적 빌드라 공개 값(`NEXT_PUBLIC_*`, 이름은 Next 시절 그대로)이 빌드 때 있어야 한다.
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      # Astro 빌드의 최대 RSS는 4 CPU 측정에서 3.5–4GiB였다. Node 기본 heap 상한보다 크다.
      NODE_OPTIONS: --max-old-space-size=6144
      # 안 바뀐 페이지는 렌더링하지 않고 캐시에서 복원한다.
      SEED_DOCS_INCREMENTAL_BUILD: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 페이지의 수정일과 incremental cacheKey가 Git 이력을 읽는다. 얕은 clone에서는 모든 문서가 배포
          # 커밋 시각을 받아 커밋마다 모든 페이지가 바뀐다. blob 없이 commit과 tree만 받는다.
          fetch-depth: 0
          filter: blob:none

      - name: Hash docs cache inputs
        uses: ./.github/actions/docs-build-cache
        with:
          phase: prepare

      - uses: ./.github/actions/setup
        with:
          build-packages: true
          build-rootage: true

      - name: Restore docs build caches
        id: cache
        uses: ./.github/actions/docs-build-cache
        with:
          phase: restore
          # Production keeps publishing refreshed state for the default-branch fallback.
          cache-generation: ${{ github.sha }}
          cache-scope: ${{ github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          skip-figma-cache: ${{ inputs.skip-figma-cache }}
          skip-page-cache: ${{ inputs.skip-page-cache }}

      - name: "Build: pre"
        working-directory: ./docs
        env:
          SEED_DOCS_LYNX_PREBUILT: ${{ steps.cache.outputs.lynx-out-hit == 'true' && '1' || '0' }}
          # Sanity webhook 빌드의 목적이 새 데이터다. 스냅숏을 못 받으면 빈 표로 배포하지 않고 실패한다.
          SEED_DOCS_REQUIRE_SANITY: "1"
        run: |
          trap 'echo "DOCS_BUILD_PRE_SECONDS=$SECONDS" >> "$GITHUB_ENV"' EXIT
          set -o pipefail
          bun run build:pre 2>&1 | tee "$RUNNER_TEMP/docs-build-pre.log"

      - name: "Build: astro"
        working-directory: ./docs
        env:
          ASTRO_FLAGS: ${{ inputs.skip-page-cache && '--force' || '' }}
        run: |
          trap 'echo "DOCS_BUILD_ASTRO_SECONDS=$SECONDS" >> "$GITHUB_ENV"' EXIT
          set -o pipefail
          bun run build:astro $ASTRO_FLAGS 2>&1 | tee "$RUNNER_TEMP/docs-build-astro.log"

      - name: "Build: post"
        working-directory: ./docs
        run: |
          trap 'echo "DOCS_BUILD_POST_SECONDS=$SECONDS" >> "$GITHUB_ENV"' EXIT
          set -o pipefail
          bun run build:post 2>&1 | tee "$RUNNER_TEMP/docs-build-post.log"

      - name: Report docs build timings
        if: ${{ always() && steps.cache.outcome == 'success' }}
        uses: ./.github/actions/docs-build-cache
        with:
          phase: report

      # 링크 검사 전에 둔다. 빌드 산출물은 링크가 깨져도 유효한 캐시다.
      - name: Save docs build caches
        uses: ./.github/actions/docs-build-cache
        with:
          phase: save

      # 배포 전에 둔다. 깨진 링크가 프로덕션에 나가는 것보다 배포가 멈추는 편이 낫다.
      - name: Validate docs links
        uses: ./.github/actions/check-docs-links
        with:
          out-dir: ${{ github.workspace }}/docs/out

      - name: Deploy docs at Cloudflare Pages in `seed-design-v3` project (Production)
        run: |
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }} \
          CLOUDFLARE_API_TOKEN=${{ secrets.CF_API_TOKEN }} \
          bun wrangler pages deploy ./docs/out --project-name=seed-design-v3 --branch=${{ github.ref_name }}

      # 이 워크플로는 Sanity webhook으로도 돌아간다. 그때는 PR도 없고 실패 알림이 닿을
      # 사람도 없어서, 편집한 URL이 링크 검사에 걸리면 사이트가 조용히 갱신되지 않는다.
      - name: 실패하면 Slack payload를 빌드해요
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          REF_NAME: ${{ github.ref_name }}
          TRIGGER: ${{ github.event_name }}
        run: |
          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg run_url "$RUN_URL" \
            --arg ref "$REF_NAME" \
            --arg trigger "$TRIGGER" \
            '{
              channel: $channel,
              text: "SEED Docs 프로덕션 배포가 실패했어요.",
              blocks: [
                {type: "header", text: {type: "plain_text", text: "SEED Docs 프로덕션 배포가 실패했어요"}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: ("*브랜치*\n`" + $ref + "`")},
                  {type: "mrkdwn", text: ("*트리거*\n`" + $trigger + "`")}
                ]},
                {type: "section", text: {type: "mrkdwn", text: "사이트는 이전 배포 상태로 남아 있어요. 링크 검사에 걸린 경우 Sanity에서 편집한 URL을 확인해주세요."}},
                {type: "actions", elements: [{type: "button", style: "danger", text: {type: "plain_text", text: "로그 보기"}, url: $run_url}]}
              ]
            }' > /tmp/slack-failure-payload.json

      # `errors` 기본값이 false라, 켜지 않으면 Slack이 거절해도 스텝이 성공으로 넘어간다.
      - name: 실패를 Slack에 알려요
        if: failure()
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: /tmp/slack-failure-payload.json
          errors: true
