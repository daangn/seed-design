on:
  push:
    branches:
      - main
      - dev # V3 deployment; remove this when V3 is stable
    paths:
      - "docs/**"
      - "packages/css/**"
      - "packages/react/**"
      - "packages/lynx-react/**"
      - "packages/lynx-css/**"
      - "packages/stackflow/**"
      - ".github/workflows/deploy-seed-design-docs-prod-pages.yml"
      - ".github/actions/setup/action.yml"
      - ".bun-version"
      - ".github/actions/docs-build-cache/**"
      - ".github/actions/check-docs-links/**"
  workflow_dispatch:
    inputs:
      skip-figma-cache:
        description: "Skip Figma image cache (fetch fresh images)"
        required: false
        type: boolean
        default: false
      bypass-cache-node-ids:
        description: "Comma-separated Figma node IDs to bypass cache for (fetch fresh)"
        required: false
        type: string
        default: ""
      skip-page-cache:
        description: "Render every page instead of restoring unchanged pages from the cache"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
  FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}

name: deploy-seed-design-docs-prod-pages

jobs:
  deploy:
    name: deploy-seed-design-docs-prod-pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 문서의 수정일은 Git 이력에서 읽는다. 얕은 clone에서는 모든 문서가 배포 커밋 시각을 받아
          # 커밋마다 모든 페이지가 바뀐다. blob 없이 commit과 tree만 받아 이력을 채운다.
          fetch-depth: 0
          filter: blob:none

      - name: Restore Figma image cache
        if: ${{ !inputs.skip-figma-cache }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: docs/.cache/figma-image
          key: ${{ runner.os }}-figma-images-${{ hashFiles('docs/.cache/figma-image/**') }}
          restore-keys: |
            ${{ runner.os }}-figma-images-

      - uses: ./.github/actions/setup
        with:
          build-packages: true
          build-rootage: true

      - name: Restore docs build caches
        id: restore-build-cache
        uses: ./.github/actions/docs-build-cache
        with:
          # Production keeps publishing refreshed state for the default-branch fallback.
          cache-generation: ${{ github.sha }}
          cache-scope: ${{ github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}

      - name: Build Docs
        working-directory: ./docs
        env:
          # docs is a static Astro build, so NEXT_PUBLIC_* values must be present at build time.
          FIGMA_CACHE_DISABLED: ${{ inputs.skip-figma-cache && '1' || '0' }}
          FIGMA_BYPASS_CACHE_NODE_IDS: ${{ inputs.bypass-cache-node-ids }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          # Figma image processing exceeded Node's default ~2GB heap on CI with the Next build.
          # Kept until the Astro build is measured without it.
          NODE_OPTIONS: --max-old-space-size=6144
          # 안 바뀐 페이지는 렌더링하지 않고 캐시에서 복원한다.
          SEED_DOCS_INCREMENTAL_BUILD: ${{ inputs.skip-page-cache && '0' || '1' }}
        run: |
          bun run build

      # 배포 전에 둔다. 깨진 링크가 프로덕션에 나가는 것보다 배포가 멈추는 편이 낫다.
      - name: Validate docs links
        uses: ./.github/actions/check-docs-links
        with:
          out-dir: ${{ github.workspace }}/docs/out

      - name: Save Lynx Rspeedy cache
        if: ${{ steps.restore-build-cache.outputs.lynx-cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: docs/.cache/lynx-rspeedy
          key: ${{ steps.restore-build-cache.outputs.lynx-cache-primary-key }}

      - name: Save Fumadocs TypeScript cache
        if: ${{ steps.restore-build-cache.outputs.fumadocs-cache-hit != 'true' && hashFiles('docs/.cache/fumadocs-typescript/**') != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: docs/.cache/fumadocs-typescript
          key: ${{ steps.restore-build-cache.outputs.fumadocs-cache-primary-key }}

      - name: Save Astro page cache
        if: ${{ steps.restore-build-cache.outputs.astro-cache-hit != 'true' && hashFiles('docs/.cache/astro/incremental-build.json') != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: docs/.cache/astro
          key: ${{ steps.restore-build-cache.outputs.astro-cache-primary-key }}

      - name: Save Figma image cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: docs/.cache/figma-image
          key: ${{ runner.os }}-figma-images-${{ hashFiles('docs/.cache/figma-image/**') }}

      - name: Deploy docs at Cloudflare Pages in `seed-design-v3` project (Production)
        run: |
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }} \
          CLOUDFLARE_API_TOKEN=${{ secrets.CF_API_TOKEN }} \
          bun wrangler pages deploy ./docs/out --project-name=seed-design-v3 --branch=${{ github.ref_name }}

      # 이 워크플로는 Sanity webhook으로도 돌아간다. 그때는 PR도 없고 실패 알림이 닿을
      # 사람도 없어서, 편집한 URL이 링크 검사에 걸리면 사이트가 조용히 갱신되지 않는다.
      - name: 실패하면 Slack payload를 빌드해요
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          REF_NAME: ${{ github.ref_name }}
          TRIGGER: ${{ github.event_name }}
        run: |
          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg run_url "$RUN_URL" \
            --arg ref "$REF_NAME" \
            --arg trigger "$TRIGGER" \
            '{
              channel: $channel,
              text: "SEED Docs 프로덕션 배포가 실패했어요.",
              blocks: [
                {type: "header", text: {type: "plain_text", text: "SEED Docs 프로덕션 배포가 실패했어요"}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: ("*브랜치*\n`" + $ref + "`")},
                  {type: "mrkdwn", text: ("*트리거*\n`" + $trigger + "`")}
                ]},
                {type: "section", text: {type: "mrkdwn", text: "사이트는 이전 배포 상태로 남아 있어요. 링크 검사에 걸린 경우 Sanity에서 편집한 URL을 확인해주세요."}},
                {type: "actions", elements: [{type: "button", style: "danger", text: {type: "plain_text", text: "로그 보기"}, url: $run_url}]}
              ]
            }' > /tmp/slack-failure-payload.json

      # `errors` 기본값이 false라, 켜지 않으면 Slack이 거절해도 스텝이 성공으로 넘어간다.
      - name: 실패를 Slack에 알려요
        if: failure()
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: /tmp/slack-failure-payload.json
          errors: true
