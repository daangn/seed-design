name: Daily PR Digest

on:
  push:
    branches:
      - feat/noti-pr-test
  schedule:
    - cron: "0 1 * * *" # KST 10:00 every day
  workflow_dispatch:

jobs:
  digest:
    name: Send Daily PR Digest
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Fetch merged PRs and build Slack payload
        id: payload
        run: node .github/scripts/daily-digest.js
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Slack에 알려요
        if: steps.payload.outputs.has_prs == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_NOTI_CHANNEL_ID }}
            text: "📋 SEED Design 일간 PR 현황"
            blocks: ${{ steps.payload.outputs.blocks }}
