name: Sync Figma Entities

on:
  schedule:
    - cron: "0 2 * * *" # KST 11:00 every day
  workflow_dispatch:

jobs:
  sync:
    name: Sync Figma Entities
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Figma entity 데이터를 동기화해요
        run: bun --filter @seed-design/figma sync-entities
        env:
          FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}
          FIGMA_FOUNDATIONS_FILE_KEY: ${{ secrets.FIGMA_FOUNDATIONS_FILE_KEY }}
          FIGMA_COMPONENTS_FILE_KEY: ${{ secrets.FIGMA_COMPONENTS_FILE_KEY }}
          FIGMA_TEMPLATES_FILE_KEY: ${{ secrets.FIGMA_TEMPLATES_FILE_KEY }}

      - name: packages/figma를 빌드해요
        id: build
        continue-on-error: true
        run: bun --filter @seed-design/figma build

      - name: 변경사항이 있는지 확인해요
        id: check-diff
        run: |
          if git diff --quiet packages/figma/src/entities/data/__generated__; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            FILE_COUNT=$(git diff --name-only packages/figma/src/entities/data/__generated__ | wc -l | tr -d ' ')
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: 변경사항이 있으면 브랜치를 만들고 커밋해요
        if: steps.check-diff.outputs.has_changes == 'true'
        id: create-branch
        run: |
          BRANCH_NAME="sync-entities/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add packages/figma/src/entities/data/__generated__
          git commit -m "chore(figma): sync entities from Figma"
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: PR을 만들어요
        if: steps.check-diff.outputs.has_changes == 'true'
        id: create-pr
        run: |
          PR_URL=$(gh pr create \
            --base dev \
            --head "${{ steps.create-branch.outputs.branch_name }}" \
            --title "chore(figma): sync entities from Figma" \
            --body "$(cat <<EOF
          Figma entity 데이터가 변경되었어요.

          - 변경된 파일 수: ${{ steps.check-diff.outputs.file_count }}개
          - 빌드 결과: ${{ steps.build.outcome == 'success' && '✅ 성공' || '❌ 실패' }}
          EOF
          )")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Slack에 알려요
        if: steps.check-diff.outputs.has_changes == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "Figma Entity 변경이 감지되었어요."
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "Figma Entity 변경이 감지되었어요"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "변경된 파일 수: *${{ steps.check-diff.outputs.file_count }}개*\n빌드 결과: *${{ steps.build.outcome == 'success' && '✅ 성공' || '❌ 실패' }}*"
              - type: "actions"
                elements:
                  - type: "button"
                    style: "primary"
                    text:
                      type: "plain_text"
                      text: "PR 보기"
                    url: "${{ steps.create-pr.outputs.pr_url }}"
