on:
  push:
    branches:
      - "**"
      - "!main"
      - "!dev" # V3 deployment; remove this when V3 is stable
    paths:
      - "docs/**"
      - "scripts/docs-archive/**"
      - "packages/css/**"
      - "packages/react-headless/**"
      - "packages/react/**"
      - "packages/lynx-react/**"
      - "packages/lynx-react-headless/**"
      - "packages/lynx-css/**"
      - "packages/stackflow/**"
      - ".github/workflows/deploy-seed-design-docs-alpha-pages.yml"
      - ".github/actions/setup/action.yml"
      - ".bun-version"
      - ".github/actions/docs-build-cache/**"
      - ".github/actions/check-docs-links/**"
  workflow_dispatch:
    inputs:
      skip-figma-cache:
        description: "Skip Figma image cache (fetch fresh images)"
        required: false
        type: boolean
        default: false
      bypass-cache-node-ids:
        description: "Comma-separated Figma node IDs to bypass cache for (fetch fresh)"
        required: false
        type: string
        default: ""
      skip-page-cache:
        description: "Render every page instead of restoring unchanged pages from the cache"
        required: false
        type: boolean
        default: false
      benchmark-cache-key:
        description: "Optional identifier for a reproducible cold/warm Docs benchmark"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
  FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}

name: deploy-seed-design-docs-alpha-pages

jobs:
  deploy:
    name: deploy-seed-design-docs-alpha-pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FIGMA_CACHE_DISABLED: ${{ inputs.skip-figma-cache && '1' || '0' }}
      FIGMA_BYPASS_CACHE_NODE_IDS: ${{ inputs.bypass-cache-node-ids }}
      # 정적 빌드라 공개 값(`NEXT_PUBLIC_*`, 이름은 Next 시절 그대로)이 빌드 때 있어야 한다.
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      # Astro 빌드의 최대 RSS는 4 CPU 측정에서 3.5–4GiB였다. Node 기본 heap 상한보다 크다.
      NODE_OPTIONS: --max-old-space-size=6144
      # 안 바뀐 페이지는 렌더링하지 않고 캐시에서 복원한다.
      SEED_DOCS_INCREMENTAL_BUILD: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 페이지의 수정일과 incremental cacheKey가 Git 이력을 읽는다. 얕은 clone에서는 모든 문서가 배포
          # 커밋 시각을 받아 커밋마다 모든 페이지가 바뀐다. blob 없이 commit과 tree만 받는다.
          fetch-depth: 0
          filter: blob:none

      - name: Hash docs cache inputs
        uses: ./.github/actions/docs-build-cache
        with:
          phase: prepare

      - uses: ./.github/actions/setup
        with:
          build-packages: true
          build-rootage: true

      - name: Select archive build channel
        id: target
        run: bun scripts/docs-archive/build-target.ts

      - name: Restore docs build caches
        id: cache
        uses: ./.github/actions/docs-build-cache
        with:
          phase: restore
          # A branch publishes one immutable baseline per compatibility namespace.
          # Later pushes restore it exactly instead of creating a cache per SHA.
          cache-generation: ${{ steps.target.outputs.cache-generation }}
          cache-scope: ${{ github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          benchmark-cache-key: ${{ inputs.benchmark-cache-key }}
          skip-figma-cache: ${{ inputs.skip-figma-cache }}
          skip-page-cache: ${{ inputs.skip-page-cache }}

      - name: "Build: pre"
        if: ${{ steps.target.outputs.archive-version == '' }}
        working-directory: ./docs
        env:
          SEED_DOCS_LYNX_PREBUILT: ${{ steps.cache.outputs.lynx-out-hit == 'true' && '1' || '0' }}
        run: |
          trap 'echo "DOCS_BUILD_PRE_SECONDS=$SECONDS" >> "$GITHUB_ENV"' EXIT
          set -o pipefail
          bun run build:pre 2>&1 | tee "$RUNNER_TEMP/docs-build-pre.log"

      - name: "Build: astro"
        if: ${{ steps.target.outputs.archive-version == '' }}
        working-directory: ./docs
        env:
          ASTRO_FLAGS: ${{ inputs.skip-page-cache && '--force' || '' }}
        run: |
          trap 'echo "DOCS_BUILD_ASTRO_SECONDS=$SECONDS" >> "$GITHUB_ENV"' EXIT
          set -o pipefail
          bun run build:astro $ASTRO_FLAGS 2>&1 | tee "$RUNNER_TEMP/docs-build-astro.log"

      - name: "Build: post"
        if: ${{ steps.target.outputs.archive-version == '' }}
        working-directory: ./docs
        run: |
          trap 'echo "DOCS_BUILD_POST_SECONDS=$SECONDS" >> "$GITHUB_ENV"' EXIT
          set -o pipefail
          bun run build:post 2>&1 | tee "$RUNNER_TEMP/docs-build-post.log"

      # archive 빌드는 `build:archive:*`가 같은 `build`(pre → astro → post)를 돌린 뒤 내보낸다.
      - name: "Build: archive"
        if: ${{ steps.target.outputs.archive-version != '' }}
        working-directory: ./docs
        env:
          DOCS_ARCHIVE_PLATFORM: ${{ steps.target.outputs.archive-platform }}
          DOCS_ARCHIVE_VERSION: ${{ steps.target.outputs.archive-version }}
          SEED_DOCS_LYNX_PREBUILT: ${{ steps.cache.outputs.lynx-out-hit == 'true' && '1' || '0' }}
          SEED_DOCS_INCREMENTAL_BUILD: ${{ inputs.skip-page-cache && '0' || '1' }}
        run: |
          trap 'echo "DOCS_BUILD_ARCHIVE_SECONDS=$SECONDS" >> "$GITHUB_ENV"' EXIT
          set -o pipefail
          bun run "build:archive:$DOCS_ARCHIVE_PLATFORM" "$DOCS_ARCHIVE_VERSION" 2>&1 | tee "$RUNNER_TEMP/docs-build-archive.log"

      - name: Report docs build timings
        if: ${{ always() && steps.cache.outcome == 'success' }}
        uses: ./.github/actions/docs-build-cache
        with:
          phase: report
          benchmark-cache-key: ${{ inputs.benchmark-cache-key }}

      - name: Save docs build caches
        uses: ./.github/actions/docs-build-cache
        with:
          phase: save

      - name: Deploy docs at Cloudflare Pages in `seed-design-v3` project (Alpha)
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.161.0"
          command: pages deploy ./${{ steps.target.outputs.output-dir }} --project-name=seed-design-v3 --branch=${{ github.ref_name }}

      - name: Verify archive deployment and branch alias
        if: steps.target.outputs.archive-version != ''
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PAGES_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: bun scripts/docs-archive/verify-preview.ts

      # 프리뷰 배포 뒤에 둔다. 링크가 깨졌다고 리뷰어가 볼 프리뷰까지 막히면 손해가
      # 더 크다. 결과는 아래 PR 코멘트에 실리고 job은 마지막에 실패한다. 실제 배포
      # 차단은 prod 워크플로가 배포 전에 한다.
      - name: Validate docs links
        id: links
        continue-on-error: true
        uses: ./.github/actions/check-docs-links
        with:
          out-dir: ${{ github.workspace }}/${{ steps.target.outputs.output-dir }}
          canonical-prefix: ${{ steps.target.outputs.prefix }}
          llms-exclude: |
            ${{ steps.target.outputs.prefix || 'react/' }}llms-full.txt
            ${{ steps.target.outputs.prefix }}llms/react/updates/changelog.txt
            ${{ steps.target.outputs.prefix }}llms/react/updates/changelog/*

      - name: Find related PR
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            if (!context.ref.startsWith('refs/heads/')) {
              core.setOutput('number', '');
              return;
            }

            const branch = context.ref.replace('refs/heads/', '');
            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 1,
            });

            core.setOutput('number', pulls.data[0] ? String(pulls.data[0].number) : '');

      - name: Upsert PR preview comment
        if: ${{ steps.pr.outputs.number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          LINKS_OUTCOME: ${{ steps.links.outcome }}
          PREVIEW_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_PATH: ${{ steps.target.outputs.preview-path }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- seed-design-preview:docs-alpha -->';
            const aliasUrl = (process.env.PREVIEW_ALIAS_URL || '').trim();
            const deploymentUrl = (process.env.PREVIEW_DEPLOYMENT_URL || '').trim();
            const previewUrl = (url) => url ? url.replace(/\/$/, '') + process.env.PREVIEW_PATH : '(not available)';

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const linksBroken = process.env.LINKS_OUTCOME === 'failure';

            const body = [
              marker,
              '## Alpha Preview (Docs)',
              '',
              `- Branch Preview URL: ${previewUrl(aliasUrl)}`,
              `- Preview URL: ${previewUrl(deploymentUrl)}`,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
              // 통과했을 때는 줄을 넣지 않는다. 이 코멘트를 쓰는 job이 검사도 하므로
              // 줄이 없다는 것 자체가 통과를 뜻한다.
              ...(linksBroken ? [`- ❌ Docs links: broken, see the [run log](${runUrl})`] : []),
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail when docs links are broken
        if: ${{ steps.links.outcome == 'failure' }}
        run: exit 1
