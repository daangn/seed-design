on:
  push:
    branches:
      - "**"
      - "!main"
      - "!dev" # V3 deployment; remove this when V3 is stable
    paths:
      - "docs/**"
      - "packages/css/**"
      - "packages/react-headless/**"
      - "packages/react/**"
      - "packages/lynx-react/**"
      - "packages/lynx-css/**"
      - "packages/stackflow/**"
      - ".github/workflows/deploy-seed-design-docs-alpha-pages.yml"
      - ".github/actions/setup/action.yml"
      - ".github/actions/nextjs-cache/**"
      - ".github/actions/check-docs-links/**"
  workflow_dispatch:
    inputs:
      skip-figma-cache:
        description: "Skip Figma image cache (fetch fresh images)"
        required: false
        type: boolean
        default: false
      bypass-cache-node-ids:
        description: "Comma-separated Figma node IDs to bypass cache for (fetch fresh)"
        required: false
        type: string
        default: ""
      benchmark-cache-key:
        description: "Optional identifier for a reproducible cold/warm Docs benchmark"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
  FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}

name: deploy-seed-design-docs-alpha-pages

jobs:
  deploy:
    name: deploy-seed-design-docs-alpha-pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # 링크 검사 결과는 job 성패가 아니라 commit status로 알린다. 브랜치 보호는 이
      # context를 요구하고, 되돌려야 할 때는 같은 context에 success를 덮어써서 푼다.
      # `docs-links-status.yml`이 docs를 건드리지 않은 PR에 같은 context를 올린다.
      - name: Mark docs link validation pending
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Validate docs links',
              description: 'Building docs before checking links',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Restore Figma image cache
        if: ${{ !inputs.skip-figma-cache }}
        uses: actions/cache/restore@v5
        with:
          path: docs/.cache/figma-image
          key: ${{ runner.os }}-figma-images-${{ hashFiles('docs/.cache/figma-image/**') }}
          restore-keys: |
            ${{ runner.os }}-figma-images-

      - uses: ./.github/actions/setup
        id: setup
        with:
          build-packages: true
          build-rootage: true

      - name: Restore Next.js cache
        id: restore-nextjs-cache
        uses: ./.github/actions/nextjs-cache
        with:
          # A branch publishes one immutable baseline per compatibility namespace.
          # Later pushes restore it exactly instead of creating a 0.7-1GB cache per SHA.
          cache-generation: baseline
          cache-scope: ${{ github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          legacy-build-cache-key-suffix: ${{ steps.setup.outputs.build-cache-key-suffix }}
          benchmark-cache-key: ${{ inputs.benchmark-cache-key }}

      - name: Build Docs
        id: build-docs
        working-directory: ./docs
        env:
          # docs uses Next static export, so NEXT_PUBLIC_* values must be present at build time.
          FIGMA_CACHE_DISABLED: ${{ inputs.skip-figma-cache && '1' || '0' }}
          FIGMA_BYPASS_CACHE_NODE_IDS: ${{ inputs.bypass-cache-node-ids }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          # Figma image processing + Next webpack export exceed Node's default ~2GB heap on CI.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          build_started_at="$(date +%s)"
          set +e
          bun run build
          status=$?
          echo "duration-seconds=$(( $(date +%s) - build_started_at ))" >> "$GITHUB_OUTPUT"
          echo "lynx-cache-size-kib=$(du -sk .next/cache/lynx-rspeedy 2>/dev/null | cut -f1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report docs build benchmark
        if: ${{ always() }}
        env:
          BENCHMARK_CACHE_KEY: ${{ inputs.benchmark-cache-key }}
          NEXTJS_CACHE_HIT: ${{ steps.restore-nextjs-cache.outputs.cache-hit }}
          NEXTJS_CACHE_MATCHED_KEY: ${{ steps.restore-nextjs-cache.outputs.cache-matched-key }}
          NEXTJS_CACHE_PRIMARY_KEY: ${{ steps.restore-nextjs-cache.outputs.cache-primary-key }}
          BUILD_DURATION_SECONDS: ${{ steps.build-docs.outputs.duration-seconds }}
          LYNX_CACHE_SIZE_KIB: ${{ steps.build-docs.outputs.lynx-cache-size-kib }}
          BUILD_EXIT_CODE: ${{ steps.build-docs.outputs.exit-code }}
        run: |
          cache_result="miss"
          if [ "$NEXTJS_CACHE_HIT" = "true" ]; then
            cache_result="exact hit"
          elif [ -n "$NEXTJS_CACHE_MATCHED_KEY" ]; then
            cache_result="restore-key hit (not exact)"
          fi

          {
            echo "## Docs build benchmark"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Benchmark cache key | ${BENCHMARK_CACHE_KEY:-default deployment cache} |"
            echo "| Next.js Actions cache | $cache_result |"
            echo "| Next.js cache exact hit | ${NEXTJS_CACHE_HIT:-false} |"
            echo "| Next.js cache matched key | ${NEXTJS_CACHE_MATCHED_KEY:-none} |"
            echo "| Next.js cache primary key | ${NEXTJS_CACHE_PRIMARY_KEY:-unknown} |"
            echo "| Total docs build time (seconds) | ${BUILD_DURATION_SECONDS:-not-recorded} |"
            echo "| Lynx Rspeedy cache size (KiB) | ${LYNX_CACHE_SIZE_KIB:-not-recorded} |"
            echo "| Build exit code | ${BUILD_EXIT_CODE:-not-recorded} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Next.js cache
        if: ${{ steps.restore-nextjs-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: docs/.next/cache
          key: ${{ steps.restore-nextjs-cache.outputs.cache-primary-key }}

      - name: Save Fumadocs TypeScript cache
        if: ${{ steps.restore-nextjs-cache.outputs.fumadocs-cache-hit != 'true' && hashFiles('docs/.next/cache/fumadocs-typescript/**') != '' }}
        uses: actions/cache/save@v5
        with:
          path: docs/.next/cache/fumadocs-typescript
          key: ${{ steps.restore-nextjs-cache.outputs.fumadocs-cache-primary-key }}

      - name: Save Figma image cache
        uses: actions/cache/save@v5
        with:
          path: docs/.cache/figma-image
          key: ${{ runner.os }}-figma-images-${{ hashFiles('docs/.cache/figma-image/**') }}

      - name: Deploy docs at Cloudflare Pages in `seed-design-v3` project (Alpha)
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.45.3"
          command: pages deploy ./docs/out --project-name=seed-design-v3 --branch=${{ github.ref_name }}

      - name: Find related PR
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            if (!context.ref.startsWith('refs/heads/')) {
              core.setOutput('number', '');
              return;
            }

            const branch = context.ref.replace('refs/heads/', '');
            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 1,
            });

            core.setOutput('number', pulls.data[0] ? String(pulls.data[0].number) : '');

      - name: Upsert PR preview comment
        if: ${{ steps.pr.outputs.number != '' }}
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- seed-design-preview:docs-alpha -->';
            const aliasUrl = (process.env.PREVIEW_ALIAS_URL || '').trim();
            const deploymentUrl = (process.env.PREVIEW_DEPLOYMENT_URL || '').trim();

            const body = [
              marker,
              '## Alpha Preview (Docs)',
              '',
              `- Branch Preview URL: ${aliasUrl || '(not available)'}`,
              `- Preview URL: ${deploymentUrl || '(not available)'}`,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      # 프리뷰 배포와 PR 코멘트 뒤에 둔다. 링크가 깨졌다고 리뷰어가 볼 프리뷰까지
      # 막히면 손해가 더 크다. 머지는 아래 commit status가 막는다.
      - name: Validate docs links
        id: links
        continue-on-error: true
        uses: ./.github/actions/check-docs-links
        with:
          out-dir: ${{ github.workspace }}/docs/out

      - name: Record docs link validation result
        if: ${{ always() }}
        uses: actions/github-script@v9
        env:
          LINKS_OUTCOME: ${{ steps.links.outcome }}
        with:
          script: |
            // 링크가 깨진 것(failure)과 빌드가 죽어 검사 자체를 못 한 것(error)을 구분한다.
            // 이 저장소의 docs 빌드는 컴포넌트 페이지마다 Sanity를 조회해서 네트워크로
            // 간헐 실패하므로, 둘을 뭉치면 엉뚱한 곳을 파게 된다.
            const outcome = process.env.LINKS_OUTCOME;
            const [state, description] =
              outcome === 'success'
                ? ['success', 'No broken links in the exported docs site']
                : outcome === 'failure'
                  ? ['failure', 'Broken links found in the exported docs site']
                  : ['error', 'Docs build failed, so links were never checked'];

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Validate docs links',
              description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Fail when docs links are broken
        if: ${{ steps.links.outcome == 'failure' }}
        run: exit 1
