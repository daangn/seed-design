name: Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "packages/**"
      - "docs/**"
      - ".changeset/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Release Seed Design Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Changelog
        run: |
          if [ -n "$(ls -A .changeset/*.md 2>/dev/null || true)" ]; then
            bun generate:changelog
          else
            echo "No changeset files found, skipping changelog generation"
          fi
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: 릴리즈 Pull Request를 만들거나 패키지를 배포해요
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun release
          version: bun version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: 릴리즈 PR이 만들어지거나 업데이트된 경우 해당 PR의 base 브랜치를 체크아웃해요
        if: steps.changesets.outputs.published == 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: changeset-release/${{ github.ref_name }}

      - name: rootage json 파일의 버전을 @seed-design/rootage-artifacts 버전에 맞춰요
        if: steps.changesets.outputs.published == 'false'
        run: |
          bun install --frozen-lockfile
          bun rootage:build
          bun install # link
          bun rootage:generate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/rootage
          git commit -m "Update public rootage version" || echo "No changes to commit"
          git push
