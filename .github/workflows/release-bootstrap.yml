name: Release lanes bootstrap

on:
  workflow_dispatch:

concurrency:
  group: release-bootstrap
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify clean stable baseline
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dev_sha: ${{ steps.baseline.outputs.dev_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Require DES-2201 and a clean dev baseline
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(jq -r '.rootageContractReady' .github/release/control.json)" = "true"
          test "$(jq -r '.mode' .github/release/control.json)" = "dry-run"
          test "$(jq -r '.sync.activation' .github/release/lanes.json)" = "null"
          CHANGESETS=$(rg --files .changeset -g '*.md' | rg -v '^\.changeset/README\.md$' || true)
          test -z "$CHANGESETS"
          OPEN_VERSION_PR=$(gh pr list --state open --base dev --head changeset-release/dev --json number --jq '.[0].number')
          test -z "$OPEN_VERSION_PR"
          echo "dev_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  create-branches:
    name: Create fixed lanes
    if: github.ref == 'refs/heads/dev'
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dev_sha: ${{ steps.create.outputs.dev_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.dev_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Create branches from the same dev SHA
        id: create
        env:
          BOOTSTRAP_DEV_SHA: ${{ needs.preflight.outputs.dev_sha }}
          GH_TOKEN: ${{ secrets.RELEASE_BOOTSTRAP_TOKEN }}
        run: bun tools/release-automation/src/setup/bootstrap.ts
      - name: Summarize manual protection setup
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 수동 branch protection 설정 필요

          `dev`, `minor`, `major`에 다음 보호 규칙을 설정한 뒤 bootstrap PR을 merge합니다.

          - Require branches to be up to date before merging
          - Required status check: `Validate release lane`
          - Require conversation resolution before merging
          - Block force pushes
          - Block branch deletion
          EOF

  configure:
    name: Configure ${{ matrix.lane }} beta lane
    if: github.ref == 'refs/heads/dev'
    needs: [preflight, create-branches]
    strategy:
      fail-fast: false
      matrix:
        lane: [minor, major]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-branches.outputs.dev_sha }}
          fetch-depth: 0
      - name: Bind checkout and remote lane to exact dev baseline
        env:
          BASELINE_SHA: ${{ needs.create-branches.outputs.dev_sha }}
          LANE: ${{ matrix.lane }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          git fetch --no-tags origin "+refs/heads/${LANE}:refs/remotes/origin/${LANE}"
          REMOTE_LANE_SHA=$(git rev-parse "origin/${LANE}")
          test "$REMOTE_LANE_SHA" = "$BASELINE_SHA"
      - uses: ./.github/actions/setup
      - name: Configure baseBranch and enter beta
        env:
          LANE: ${{ matrix.lane }}
        run: |
          jq --arg lane "$LANE" '.baseBranch = $lane' .changeset/config.json > /tmp/changeset-config.json
          cp /tmp/changeset-config.json .changeset/config.json
          bun changeset pre enter beta
      - name: Create bootstrap PR
        env:
          BASELINE_SHA: ${{ needs.create-branches.outputs.dev_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANE: ${{ matrix.lane }}
        run: |
          CONTROL_SHA="$BASELINE_SHA"
          BRANCH="release-bootstrap/${LANE}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset/config.json .changeset/pre.json
          git commit -m "chore(release): bootstrap ${LANE} beta lane"
          git push origin "$BRANCH"
          HEAD_SHA=$(git rev-parse HEAD)
          MARKER=$(bun tools/release-automation/bin/control.ts marker --type bootstrap --lane "$LANE" --targetLane "$LANE" --tag beta --expectedHeadSha "$HEAD_SHA" --controlSha "$CONTROL_SHA")
          gh pr create --base "$LANE" --head "$BRANCH" --title "chore(release): bootstrap ${LANE} beta lane" --body "$MARKER"
          gh workflow run release-pr-validation.yml --ref dev -f head_ref="$BRANCH" -f head_sha="$HEAD_SHA"
