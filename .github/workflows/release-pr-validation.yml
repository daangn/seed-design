name: Release lane PR validation
run-name: "seed-release-validation:${{ inputs.validation_kind == 'code-promotion-preflight' && 'code-promotion-preflight' || 'lane' }}:${{ inputs.head_sha || github.event.pull_request.head.sha }}"

on:
  pull_request_target:
    branches: [dev, minor, major]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Exact generated PR head branch"
        required: true
        type: string
      head_sha:
        description: "Exact generated PR head SHA"
        required: true
        type: string
      pull_number:
        description: "Exact PR number for ordinary PR revalidation"
        required: false
        type: string
      validation_kind:
        description: "Validation receipt kind"
        required: false
        default: lane
        type: choice
        options:
          - lane
          - code-promotion-preflight

permissions:
  contents: read

jobs:
  mark-pending:
    name: Mark release lane validation pending
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'dev')
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      VALIDATION_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
      VALIDATION_EVENT_KIND: ${{ github.event_name }}
      VALIDATION_KIND: ${{ inputs.validation_kind == 'code-promotion-preflight' && 'code-promotion-preflight' || 'lane' }}
      VALIDATION_PULL_NUMBER: ${{ inputs.pull_number || github.event.pull_request.number }}
      VALIDATION_STATUS_CONTEXT: ${{ inputs.validation_kind == 'code-promotion-preflight' && 'Validate code promotion preflight' || 'Validate release lane' }}
    steps:
      - name: Mark exact PR head validation pending
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.VALIDATION_HEAD_SHA,
              state: "pending",
              context: process.env.VALIDATION_STATUS_CONTEXT,
              description: `seed-release-validation:${process.env.VALIDATION_KIND}:${process.env.VALIDATION_EVENT_KIND}:${process.env.VALIDATION_HEAD_SHA}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  validate:
    name: Run release lane validation without write credentials
    needs: mark-pending
    if: needs.mark-pending.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    env:
      VALIDATION_HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
      VALIDATION_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
      VALIDATION_EVENT_KIND: ${{ github.event_name }}
      VALIDATION_KIND: ${{ inputs.validation_kind == 'code-promotion-preflight' && 'code-promotion-preflight' || 'lane' }}
      VALIDATION_PULL_NUMBER: ${{ inputs.pull_number }}
    steps:
      - name: Checkout trusted dev validation control plane
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Validate current PR with trusted dev code
        id: trusted-validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$VALIDATION_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$VALIDATION_PULL_NUMBER" ]; then
            bun tools/release-automation/bin/control.ts validate-pr \
              --repository "$GITHUB_REPOSITORY" \
              --number "$VALIDATION_PULL_NUMBER" \
              --head-ref "$VALIDATION_HEAD_REF" \
              --head-sha "$VALIDATION_HEAD_SHA"
          elif [ "$VALIDATION_EVENT_NAME" = "workflow_dispatch" ]; then
            bun tools/release-automation/src/validation/generated-pr-validation.ts
          else
            bun tools/release-automation/bin/control.ts validate-pr --event "$GITHUB_EVENT_PATH"
          fi

      - name: Checkout exact validated generated head
        id: generated-checkout
        if: steps.trusted-validation.outputs.type == 'sync' || steps.trusted-validation.outputs.type == 'code-promotion'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VALIDATION_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact projected Stable baseline
        if: steps.trusted-validation.outputs.type == 'code-promotion'
        env:
          PROMOTION_CODE_HEAD_SHA: ${{ env.VALIDATION_HEAD_SHA }}
          PROMOTION_EXPECTED_BASELINE_TREE_SHA: ${{ steps.trusted-validation.outputs.expectedBaselineTreeSha }}
          PROMOTION_EXPECTED_CODE_TREE_SHA: ${{ steps.trusted-validation.outputs.expectedCodeTreeSha }}
          PROMOTION_STABLE_BASE_SHA: ${{ steps.trusted-validation.outputs.stableBaseSha }}
          PROMOTION_STABLE_HEAD_SHA: ${{ steps.trusted-validation.outputs.stableHeadSha }}
        run: bun tools/release-automation/src/promotion/materialize-projected-baseline.ts

      - name: Setup exact validated generated head
        id: generated-setup
        if: steps.trusted-validation.outputs.type == 'sync' || steps.trusted-validation.outputs.type == 'code-promotion'
        uses: ./.github/actions/setup
        with:
          build-packages: true

      - name: Run full trusted generated tree gate
        if: steps.trusted-validation.outputs.type == 'sync' || steps.trusted-validation.outputs.type == 'code-promotion'
        run: |
          bun generate:all
          test -z "$(git status --porcelain --untracked-files=all)"
          bun test:all
          bun generate:all
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  record-result:
    name: Record release lane validation result
    needs: [mark-pending, validate]
    if: always() && needs.mark-pending.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    env:
      VALIDATION_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
      VALIDATION_EVENT_KIND: ${{ github.event_name }}
      VALIDATION_KIND: ${{ inputs.validation_kind == 'code-promotion-preflight' && 'code-promotion-preflight' || 'lane' }}
      VALIDATION_PULL_NUMBER: ${{ inputs.pull_number || github.event.pull_request.number }}
      VALIDATION_RESULT: ${{ needs.validate.result }}
      VALIDATION_STATUS_CONTEXT: ${{ inputs.validation_kind == 'code-promotion-preflight' && 'Validate code promotion preflight' || 'Validate release lane' }}
    steps:
      - name: Record exact PR head validation result
        uses: actions/github-script@v9
        with:
          script: |
            const state = process.env.VALIDATION_RESULT === "success" ? "success" : "failure";
            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: process.env.VALIDATION_HEAD_SHA,
              },
            );
            const openReleasePulls = associated.filter((pull) =>
              pull.state === "open" &&
              pull.head.sha === process.env.VALIDATION_HEAD_SHA &&
              ["dev", "minor", "major"].includes(pull.base.ref),
            );
            if (
              openReleasePulls.length !== 1 ||
              (process.env.VALIDATION_PULL_NUMBER &&
                String(openReleasePulls[0].number) !== process.env.VALIDATION_PULL_NUMBER)
            ) {
              throw new Error("Exact open release PR/head uniqueness changed during validation.");
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.VALIDATION_HEAD_SHA,
              state,
              context: process.env.VALIDATION_STATUS_CONTEXT,
              description: `seed-release-validation:${process.env.VALIDATION_KIND}:${process.env.VALIDATION_EVENT_KIND}:${process.env.VALIDATION_HEAD_SHA}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
