[install]
# registry = "https://registry.npmjs.org/" # moved to .npmrc; bunfig.toml is overridden by user ~/.npmrc
linker = "isolated"
minimumReleaseAge = 259200 # 3 days
minimumReleaseAgeExcludes = ["@karrotmarket/assets-monochrome", "@karrotmarket/assets-multicolor", "@karrotmarket/react-monochrome-icon", "@karrotmarket/react-multicolor-icon", "@karrotmarket/lynx-monochrome-icon", "@karrotmarket/lynx-multicolor-icon", "@karrotmarket/icon-data", "@seed-design/rootage-artifacts", "@kaptures/cli", "@kaptures/storybook"]

[test]
preload = ["./scripts/happydom.ts", "./scripts/testing-library.ts"]
