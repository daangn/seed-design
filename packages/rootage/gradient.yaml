kind: Tokens
metadata:
  id: gradient
  name: Gradient
data:
  collection: color
  tokens:
    $gradient.shimmer-neutral:
      description: Shimmer effect, used for loading states
      values:
        theme-light:
          type: gradient
          value:
            - color: "#FFFFFF00"
              position: 0
            - color: "#FFFFFF66"
              position: 0.46
            - color: "#FFFFFF66"
              position: 0.54
            - color: "#FFFFFF00"
              position: 1
        theme-dark:
          type: gradient
          value:
            - color: "#FFFFFF00"
              position: 0
            - color: "#FFFFFF1A"
              position: 0.46
            - color: "#FFFFFF1A"
              position: 0.54
            - color: "#FFFFFF00"
              position: 1

    $gradient.shimmer-magic:
      description: Shimmer effect, used for magic states
      values:
        theme-light:
          type: gradient
          value:
            - color: "#FEF0E700"
              position: 0
            - color: "#FEF0E78A"
              position: 0.46
            - color: "#FEF0E78A"
              position: 0.54
            - color: "#FEF0E700"
              position: 1
        theme-dark:
          type: gradient
          value:
            - color: "#FEF0E700"
              position: 0
            - color: "#FEF0E71A"
              position: 0.46
            - color: "#FEF0E71A"
              position: 0.54
            - color: "#FEF0E700"
              position: 1

    $gradient.fade-neutral:
      description: Fade effect, used for loading states
      values:
        theme-light:
          type: gradient
          value:
            - color: "#FFFFFF"
              position: 0
            - color: "#FFFFFF00"
              position: 1
        theme-dark:
          type: gradient
          value:
            - color: "#1D2025"
              position: 0
            - color: "#1D202500"
              position: 1

    $gradient.glow-magic:
      description: Glow effect, used for magic states
      values:
        theme-light:
          type: gradient
          value:
            - color: "#FEF6F7"
              position: 0
            - color: "#FEF0E7"
              position: 0.80
            - color: "#F9F7F5"
              position: 1
        theme-dark:
          type: gradient
          value:
            - color: "#2D252D"
              position: 0
            - color: "#3A312B"
              position: 0.80
            - color: "#333232"
