# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: menu-item
  name: Menu Item
data:
  schema:
    slots:
      root:
        properties:
          highlightInset:
            type: dimension
          highlightCornerRadius:
            type: dimension
          pressedColor:
            type: color
          colorTransitionDuration:
            type: duration
          colorTransitionTimingFunction:
            type: cubicBezier
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          gap:
            type: dimension
      prefixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      suffixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      body:
        properties:
          gap:
            type: dimension
      label:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      description:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
    variants:
      tone:
        values:
          neutral:
            description: 일반적인 작업을 수행하는 기본 아이템입니다.
          critical:
            description: 데이터 삭제와 같이 되돌릴 수 없는 작업을 수행하는 아이템입니다.
  definitions:
    base:
      enabled:
        root:
          highlightInset: $dimension.x2
          highlightCornerRadius: $radius.r3
          colorTransitionDuration: $duration.color-transition
          colorTransitionTimingFunction: $timing-function.easing
        body:
          gap: $dimension.x0_5
        label:
          fontWeight: $font-weight.regular
        description:
          fontWeight: $font-weight.regular
          color: $color.fg.neutral-subtle # 확인
      pressed:
        root:
          pressedColor: $color.bg.transparent-pressed
      disabled:
        prefixIcon:
          color: $color.fg.disabled
        suffixIcon:
          color: $color.fg.disabled
        label:
          color: $color.fg.disabled
        description:
          color: $color.fg.disabled
    size=medium:
      enabled:
        root:
          paddingX: $dimension.x4
          paddingY: $dimension.x3
          gap: $dimension.x3 # 확인
        prefixIcon:
          size: 22px
        suffixIcon:
          size: 18px
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        description:
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
    size=small:
      enabled:
        root:
          paddingX: $dimension.x4
          paddingY: $dimension.x2_5
          gap: $dimension.x2 # 확인
        prefixIcon:
          size: 18px
        suffixIcon:
          size: 16px
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        description:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
    tone=neutral:
      enabled:
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
        label:
          color: $color.fg.neutral
    tone=critical:
      enabled:
        prefixIcon:
          color: $color.fg.critical
        suffixIcon:
          color: $color.fg.critical
        label:
          color: $color.fg.critical
