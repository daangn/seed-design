# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: menu-item
  name: Menu Item
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
          marginX:
            type: dimension
          cornerRadius:
            type: dimension
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          marginDuration:
            type: duration
          marginTimingFunction:
            type: cubicBezier
          borderRadiusDuration:
            type: duration
          borderRadiusTimingFunction:
            type: cubicBezier
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          gap:
            type: dimension
      prefixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      suffixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      body:
        properties:
          gap:
            type: dimension
      label:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      description:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
    variants:
      tone:
        values:
          neutral:
            description: 일반적인 작업을 수행하는 기본 아이템입니다.
          critical:
            description: 데이터 삭제와 같이 되돌릴 수 없는 작업을 수행하는 아이템입니다.
      size:
        values:
          medium:
            description: 뷰포트 너비와 관계없이 사용할 수 있습니다.
          small:
            description: Breakpoint `lg` 이상(데스크톱)에서만 사용하고, 모바일에서는 사용하지 않습니다. 정밀한 선택이 가능한 마우스 입력 환경에서 사이즈를 더 작게 만들고자 할 때 사용합니다.
  definitions:
    base:
      enabled:
        root:
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
          marginDuration: $duration.d3
          marginTimingFunction: $timing-function.easing
          borderRadiusDuration: $duration.d3
          borderRadiusTimingFunction: $timing-function.easing
        body:
          gap: $dimension.x0_5
        label:
          fontWeight: $font-weight.regular
        description:
          fontWeight: $font-weight.regular
          color: $color.fg.neutral-subtle
      pressed:
        root:
          color: $color.bg.transparent-pressed
          marginX: $dimension.x2
          cornerRadius: $radius.r3
      disabled:
        prefixIcon:
          color: $color.fg.disabled
        suffixIcon:
          color: $color.fg.disabled
        label:
          color: $color.fg.disabled
        description:
          color: $color.fg.disabled
    size=medium:
      enabled:
        root:
          paddingX: $dimension.x4
          paddingY: $dimension.x3
          gap: $dimension.x3
        prefixIcon:
          size: 22px
        suffixIcon:
          size: 18px
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        description:
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
    size=small:
      enabled:
        root:
          paddingX: $dimension.x4
          paddingY: $dimension.x2_5
          gap: $dimension.x2
        prefixIcon:
          size: 18px
        suffixIcon:
          size: 16px
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        description:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
    tone=neutral:
      enabled:
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
        label:
          color: $color.fg.neutral
    tone=critical:
      enabled:
        prefixIcon:
          color: $color.fg.critical
        suffixIcon:
          color: $color.fg.critical
        label:
          color: $color.fg.critical
