# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: link-content
  name: Link Content
  deprecated: Use Action Button with variant="ghost" instead.
data:
  schema:
    slots:
      root:
        properties:
          gap:
            type: dimension
      label:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      suffixIcon:
        properties:
          size:
            type: dimension
    variants:
      weight:
        values:
          regular: {}
          bold: {}
      size:
        values:
          t4: {}
          t5: {}
          t6: {}
  rules:
    - variants:
        weight: regular
      slots:
        label:
          fontWeight: $font-weight.regular
    - variants:
        weight: bold
      slots:
        label:
          fontWeight: $font-weight.bold
    - variants:
        size: t4
      slots:
        root:
          gap: $dimension.x0_5
        suffixIcon:
          size: $dimension.x3
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
    - variants:
        size: t5
      slots:
        root:
          gap: $dimension.x0_5
        suffixIcon:
          size: $dimension.x3_5
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
    - variants:
        size: t6
      slots:
        root:
          gap: $dimension.x0_5
        suffixIcon:
          size: $dimension.x4
        label:
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
