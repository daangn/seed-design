# yaml-language-server: $schema=./schema.json
# parts: root, label, control, icon
kind: ComponentSpec
metadata:
  id: checkbox
  name: Checkbox
data:
  schema:
    slots:
      root:
        properties:
          gap:
            type: dimension
          minHeight:
            type: dimension
      label:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      control:
        properties:
          color:
            type: color
          strokeColor:
            type: color
          strokeWidth:
            type: dimension
          size:
            type: dimension
          cornerRadius:
            type: dimension
      icon:
        properties:
          color:
            type: color
          size:
            type: dimension
  definitions:
    base:
      enabled:
        label:
          color: $color.fg.neutral
        root:
          gap: $dimension.x2

    weight=default:
      enabled:
        label:
          fontWeight: $font-weight.regular
    weight=stronger:
      enabled:
        label:
          fontWeight: $font-weight.bold

    variant=square:
      enabled:
        control:
          strokeColor: $color.stroke.control
          strokeWidth: 1px
      enabled,selected:
        control:
          color: $color.bg.brand-solid
        icon:
          color: $color.palette.static-white
      pressed:
        control:
          color: $color.bg.layer-default-pressed
      pressed,selected:
        control:
          color: $color.bg.brand-solid-pressed
        icon:
          color: $color.palette.static-white
      disabled:
        control:
          color: $color.bg.disabled
          strokeColor: $color.stroke.neutral
        label:
          color: $color.fg.disabled
        icon:
          color: $color.fg.disabled
      disabled,selected:
        label:
          color: $color.fg.disabled
        icon:
          color: $color.fg.disabled

    variant=ghost:
      enabled:
        icon:
          color: $color.fg.placeholder
      enabled,selected:
        icon:
          color: $color.fg.brand
      pressed:
        control:
          color: $color.bg.layer-default-pressed
      pressed,selected:
        control:
          color: $color.palette.carrot-200
      disabled:
        label:
          color: $color.fg.disabled
        icon:
          color: $color.fg.disabled
      disabled,selected:
        label:
          color: $color.fg.disabled
        icon:
          color: $color.fg.disabled

    size=medium:
      enabled:
        root:
          minHeight: $dimension.x8
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        control:
          size: $dimension.x5
          cornerRadius: $radius.r1

    size=large:
      enabled:
        root:
          minHeight: $dimension.x9
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        control:
          size: $dimension.x6
          cornerRadius: $radius.r1

    variant=square,size=medium:
      enabled:
        icon:
          size: 12px
    variant=square,size=large:
      enabled:
        icon:
          size: 14px
    variant=ghost,size=medium:
      enabled:
        icon:
          size: 14px
    variant=ghost,size=large:
      enabled:
        icon:
          size: 18px
