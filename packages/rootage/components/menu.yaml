# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: menu
  name: Menu
data:
  schema:
    slots:
      root:
        properties:
          cornerRadius:
            type: dimension
          color:
            type: color
          shadow:
            type: shadow
          paddingY:
            type: dimension
          gap:
            type: dimension
          enterDuration:
            type: duration
          enterTimingFunction:
            type: cubicBezier
          enterScale:
            type: number
          enterOpacity:
            type: number
          exitDuration:
            type: duration
          exitTimingFunction:
            type: cubicBezier
          exitScale:
            type: number
          exitOpacity:
            type: number
          gutter:
            type: dimension
            description: 트리거와 메뉴 사이의 간격을 정의합니다.
          overflowPadding:
            type: dimension
            description: 메뉴와 뷰포트 경계 사이의 최소 간격을 정의합니다.
          maxHeight:
            type: dimension
          width:
            type: dimension
      group:
        properties: {}
      groupLabel:
        properties:
          color:
            type: color
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      divider:
        properties:
          marginX:
            type: dimension
          height:
            type: dimension
          color:
            type: color

  definitions:
    base:
      enabled:
        root:
          cornerRadius: $radius.r5
          color: $color.bg.layer-floating
          shadow: $shadow.s3
          enterDuration: $duration.d3
          enterTimingFunction: $timing-function.enter
          enterScale: 0.95
          enterOpacity: 0
          exitDuration: $duration.d2
          exitTimingFunction: $timing-function.exit
          exitScale: 0.95
          exitOpacity: 0
          paddingY: $dimension.x2
          gap: $dimension.x2
          gutter: $dimension.x2
          overflowPadding: $dimension.x2
          maxHeight: 480px
        groupLabel:
          color: $color.fg.neutral-subtle
        divider:
          marginX: $dimension.x4
          height: 1px
          color: $color.stroke.neutral-muted
    size=medium:
      enabled:
        root:
          width: 240px
        groupLabel:
          paddingY: $dimension.x2_5
          paddingX: $dimension.x4
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
          fontWeight: $font-weight.medium
    size=small:
      enabled:
        root:
          width: 200px
        groupLabel:
          paddingY: $dimension.x2
          paddingX: $dimension.x4
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
          fontWeight: $font-weight.regular
