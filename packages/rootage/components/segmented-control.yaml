# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: segmented-control
  name: Segmented Control
data:
  schema:
    slots:
      root:
        properties:
          padding:
            type: dimension
          cornerRadius:
            type: dimension
          color:
            type: color
      indicator:
        properties:
          color:
            type: color
          cornerRadius:
            type: dimension
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
          transformDuration:
            type: duration
          transformTimingFunction:
            type: cubicBezier
  definitions:
    base:
      enabled:
        root:
          padding: $dimension.x1
          cornerRadius: $radius.full
          color: $color.bg.neutral-weak
        indicator:
          color: $color.palette.gray-00
          cornerRadius: $radius.full
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-muted
          transformDuration: $duration.d4
          transformTimingFunction: $timing-function.easing
