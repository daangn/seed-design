# yaml-language-server: $schema=./schema.json
# parts: root, segment, indicator
kind: ComponentSpec
metadata:
  id: segmented-control
  name: Segmented Control
data:
  schema:
    slots:
      root:
        properties:
          padding:
            type: dimension
          cornerRadius:
            type: dimension
          color:
            type: color
      indicator:
        properties:
          color:
            type: color
          cornerRadius:
            type: dimension
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
          shadow:
            type: shadow
          transformDuration:
            type: duration
          transformTimingFunction:
            type: cubicBezier
  definitions:
    base:
      enabled:
        root:
          padding: $dimension.x1
          cornerRadius: $radius.full
          color: $color.bg.neutral-weak
        indicator:
          color: $color.palette.gray-00
          cornerRadius: $radius.full
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-weak
          shadow:
            type: shadow
            value:
              - offsetX: 0px
                offsetY: 1px
                blur: 6px
                spread: 0px
                color: "#0000000d"
          transformDuration: $duration.d4
          transformTimingFunction: $timing-function.easing
