# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: text-input
  name: Text Input
data:
  schema:
    slots:
      root:
        properties:
          gap:
            type: dimension
          minHeight:
            type: dimension
          cornerRadius:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          strokeWidth:
            type: dimension
          strokeBottomWidth:
            type: dimension
          strokeColor:
            type: color
          color:
            type: color
          strokeDuration:
            type: duration
            description: enabled 상태의 stroke 위에 focused/invalid 상태의 stroke가 fade in/out 되는 데에 걸리는 시간입니다. stroke 두께나 색상 자체를 transition하지 않습니다.
          strokeTimingFunction:
            type: cubicBezier
      value:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      placeholder:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      prefixText:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      prefixIcon:
        properties:
          color:
            type: color
          size:
            type: dimension
      suffixText:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      suffixIcon:
        properties:
          color:
            type: color
          size:
            type: dimension
    variants:
      variant:
        values:
          outline:
            description: 기본 스타일입니다.
          underline:
            description: 화면에 하나의 Input만 있는 경우 사용을 권장합니다.
      size:
        values:
          large:
            description: 뷰포트 너비와 관계없이 사용할 수 있습니다.
          medium:
            description: Breakpoint `lg` 이상(데스크톱)에서만 사용하고, 모바일에서는 사용하지 않습니다. 정밀한 선택이 가능한 마우스 입력 환경에서 사이즈를 더 작게 만들고자 할 때 사용합니다.
      type:
        values:
          singleline:
            description: 한 줄 입력입니다.
          multiline:
            description: 여러 줄 입력입니다. 같은 size의 singleline보다 높이가 큽니다.
    states:
      - id: focused
      - id: invalid
      - id: readonly
      - id: disabled
  rules:
    - slots:
        root:
          strokeColor: $color.stroke.neutral-weak
          strokeDuration: 0.1s
          strokeTimingFunction: $timing-function.easing
        value:
          color: $color.fg.neutral
          fontWeight: $font-weight.regular
        placeholder:
          color: $color.fg.placeholder
          fontWeight: $font-weight.regular
        prefixText:
          color: $color.fg.neutral-subtle
          fontWeight: $font-weight.regular
        prefixIcon:
          color: $color.fg.neutral-muted
        suffixText:
          color: $color.fg.neutral-subtle
          fontWeight: $font-weight.regular
        suffixIcon:
          color: $color.fg.neutral-muted
    - states:
        - focused
      slots:
        root:
          strokeColor: $color.stroke.neutral-contrast
    - states:
        - invalid
      slots:
        root:
          strokeColor: $color.stroke.critical-solid
    - states:
        - focused
        - invalid
      slots:
        root:
          strokeColor: $color.stroke.critical-solid # being obvious
    - states:
        - disabled
      slots:
        value:
          color: $color.fg.disabled
        placeholder:
          color: $color.fg.disabled
        prefixText:
          color: $color.fg.disabled
        prefixIcon:
          color: $color.fg.disabled
        suffixText:
          color: $color.fg.disabled
        suffixIcon:
          color: $color.fg.disabled
    - variants:
        variant: outline
      slots:
        root:
          strokeWidth: 1px
    - variants:
        variant: outline
      states:
        - focused
      slots:
        root:
          strokeWidth: 2px
    - variants:
        variant: outline
      states:
        - invalid
      slots:
        root:
          strokeWidth: 2px
    - variants:
        variant: outline
      states:
        - readonly
      slots:
        root:
          color: $color.bg.disabled
    - variants:
        variant: outline
      states:
        - disabled
      slots:
        root:
          color: $color.bg.disabled
    # Height is the one thing a multiline input overrides, so it is stated against
    # `type=singleline` rather than against every type. Written as `variant`+`size`
    # it would merely overlap the multiline rule, and neither would win.
    - variants:
        variant: outline
        size: large
        type: singleline
      slots:
        root:
          minHeight: $dimension.x13
    - variants:
        variant: outline
        size: large
      slots:
        root:
          gap: $dimension.x2_5
          cornerRadius: $radius.r3
          paddingX: $dimension.x4
        value:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        placeholder:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        prefixText:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        prefixIcon:
          size: $dimension.x5
        suffixText:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        suffixIcon:
          size: $dimension.x5
    - variants:
        variant: outline
        size: medium
        type: singleline
      slots:
        root:
          minHeight: $dimension.x10
    - variants:
        variant: outline
        size: medium
      slots:
        root:
          gap: $dimension.x2
          cornerRadius: $radius.r2
          paddingX: $dimension.x3_5
        value:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        placeholder:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        prefixText:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        prefixIcon:
          size: $dimension.x4
        suffixText:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        suffixIcon:
          size: $dimension.x4
    - variants:
        variant: underline
      slots:
        root:
          strokeBottomWidth: 1px
    - variants:
        variant: underline
      states:
        - focused
      slots:
        root:
          strokeBottomWidth: 2px
    - variants:
        variant: underline
      states:
        - invalid
      slots:
        root:
          strokeBottomWidth: 2px
    - variants:
        variant: underline
      states:
        - readonly
      slots:
        value:
          color: $color.fg.neutral-muted
        placeholder:
          color: $color.fg.neutral-muted
    - variants:
        variant: underline
        size: large
        type: singleline
      slots:
        root:
          minHeight: $dimension.x10
          paddingY: $dimension.x2
    - variants:
        variant: underline
        size: large
      slots:
        root:
          gap: $dimension.x2_5
        value:
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
        placeholder:
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
        prefixText:
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
        prefixIcon:
          size: $dimension.x6
        suffixText:
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
        suffixIcon:
          size: $dimension.x6
    - variants:
        variant: underline
        size: medium
        type: singleline
      slots:
        root:
          minHeight: 34px
          paddingY: $dimension.x1_5
    - variants:
        variant: underline
        size: medium
      slots:
        root:
          gap: $dimension.x2
        value:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        placeholder:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        prefixText:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        prefixIcon:
          size: $dimension.x5
        suffixText:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        suffixIcon:
          size: $dimension.x5
    - variants:
        size: large
        type: multiline
      slots:
        root:
          minHeight: 94px
          paddingY: $dimension.x3_5
    - variants:
        size: medium
        type: multiline
      slots:
        root:
          minHeight: 82px
          paddingY: $dimension.x3
