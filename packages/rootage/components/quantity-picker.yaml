# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: quantity-picker
  name: Quantity Picker
data:
  schema:
    slots:
      root:
        properties:
          height:
            type: dimension
          cornerRadius:
            type: dimension
          color:
            type: color
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
      valueDisplay:
        properties:
          paddingX:
            type: dimension
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      divider:
        properties:
          width:
            type: dimension
          height:
            type: dimension
          color:
            type: color
    variants:
      size:
        values:
          small: {}
          medium: {}
          large: {}
  definitions:
    base:
      enabled:
        root:
          color: $color.bg.layer-default
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-weak
        valueDisplay:
          fontWeight: $font-weight.medium
          color: $color.fg.neutral
        divider:
          color: $color.stroke.neutral-subtle
      invalid:
        root:
          strokeWidth: 2px
          strokeColor: $color.stroke.critical-solid
      disabled:
        valueDisplay:
          color: $color.fg.disabled
    size=small:
      enabled:
        root:
          height: $dimension.x9
          cornerRadius: $radius.r2
        valueDisplay:
          paddingX: $dimension.x2
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        divider:
          width: 1px
          height: $dimension.x4
    size=medium:
      enabled:
        root:
          height: $dimension.x10
          cornerRadius: $radius.r2
        valueDisplay:
          paddingX: $dimension.x2
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        divider:
          width: 1px
          height: $dimension.x4
    size=large:
      enabled:
        root:
          height: $dimension.x13
          cornerRadius: $radius.r3
        valueDisplay:
          paddingX: $dimension.x2
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
        divider:
          width: 1px
          height: $dimension.x4
