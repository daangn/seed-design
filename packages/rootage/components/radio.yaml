# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: radio
  name: Radio
data:
  schema:
    slots:
      root:
        properties:
          gap:
            type: dimension
          minHeight:
            type: dimension
      label:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
    states:
      - id: disabled
    variants:
      weight:
        values:
          regular: {}
          bold: {}
      size:
        values:
          medium: {}
          large: {}
  rules:
    - slots:
        label:
          color: $color.fg.neutral
        root:
          gap: $dimension.x2
    - states:
        - disabled
      slots:
        label:
          color: $color.fg.disabled
    - variants:
        weight: regular
      slots:
        label:
          fontWeight: $font-weight.regular
    - variants:
        weight: bold
      slots:
        label:
          fontWeight: $font-weight.bold
    - variants:
        size: medium
      slots:
        root:
          minHeight: $dimension.x8
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
    - variants:
        size: large
      slots:
        root:
          minHeight: $dimension.x9
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
