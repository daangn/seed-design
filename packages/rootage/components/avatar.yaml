# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: avatar
  name: Avatar
data:
  schema:
    slots:
      root:
        properties:
          cornerRadius:
            type: dimension
          size:
            type: dimension
      badgeMask:
        properties:
          offset:
            type: dimension
          size:
            type: dimension
      badge:
        properties:
          offset:
            type: dimension
          size:
            type: dimension
  definitions:
    base:
      enabled:
        root:
          cornerRadius: $radius.full
    size=20:
      enabled:
        root:
          size: 20px
    size=24:
      enabled:
        root:
          size: 24px
        badgeMask:
          offset: 14px
          size: 12px
        badge:
          offset: 15px
          size: 10px
    size=36:
      enabled:
        root:
          size: 36px
        badgeMask:
          offset: 20px
          size: 18px
        badge:
          offset: 22px
          size: 14px
    size=42:
      enabled:
        root:
          size: 42px
        badgeMask:
          offset: 24px
          size: 20px
        badge:
          offset: 26px
          size: 16px
    size=48:
      enabled:
        root:
          size: 48px
        badgeMask:
          offset: 28px
          size: 22px
        badge:
          offset: 30px
          size: 18px
    size=64:
      enabled:
        root:
          size: 64px
        badgeMask:
          offset: 40px
          size: 26px
        badge:
          offset: 42px
          size: 22px
    size=80:
      enabled:
        root:
          size: 80px
        badgeMask:
          offset: 52px
          size: 32px
        badge:
          offset: 54px
          size: 28px
    size=96:
      enabled:
        root:
          size: 96px
        badgeMask:
          offset: 62px
          size: 38px
        badge:
          offset: 65px
          size: 32px
