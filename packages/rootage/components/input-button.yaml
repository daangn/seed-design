# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: input-button
  name: Input Button
data:
  schema:
    slots:
      root:
        properties:
          height:
            type: dimension
          cornerRadius:
            type: dimension
          gap:
            type: dimension
          paddingX:
            type: dimension
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
          color:
            type: color
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          strokeDuration:
            type: duration
            description: enabled 상태의 stroke 위에 invalid 상태의 stroke가 fade in/out 되는 데에 걸리는 시간입니다. stroke 두께나 색상 자체를 transition하지 않습니다.
          strokeTimingFunction:
            type: cubicBezier
      value:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      placeholder:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      prefixText:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      prefixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      suffixText:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      suffixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      clearButton:
        properties:
          size:
            type: dimension
          color:
            type: color
    variants:
      size:
        values:
          large:
            description: 뷰포트 너비와 관계없이 사용할 수 있습니다.
          medium:
            description: Breakpoint `lg` 이상(데스크톱)에서만 사용하고, 모바일에서는 사용하지 않습니다. 정밀한 선택이 가능한 마우스 입력 환경에서 사이즈를 더 작게 만들고자 할 때 사용합니다.
  definitions:
    base:
      enabled:
        root:
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-weak

          color: $color.bg.transparent
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
          strokeDuration: 0.1s
          strokeTimingFunction: $timing-function.easing

        value:
          fontWeight: $font-weight.regular

          color: $color.fg.neutral

        placeholder:
          fontWeight: $font-weight.regular
          color: $color.fg.placeholder

        prefixText:
          fontWeight: $font-weight.regular

          color: $color.fg.neutral-subtle
        prefixIcon:
          color: $color.fg.neutral-muted
        suffixText:
          fontWeight: $font-weight.regular

          color: $color.fg.neutral-subtle

        suffixIcon:
          color: $color.fg.neutral-muted
        clearButton:
          color: $color.fg.neutral-subtle

      pressed:
        root:
          color: $color.bg.transparent-pressed

      invalid:
        root:
          strokeWidth: 2px
          strokeColor: $color.stroke.critical-solid

      disabled:
        root:
          color: $color.bg.disabled
        value:
          color: $color.fg.disabled
        placeholder:
          color: $color.fg.disabled
        prefixText:
          color: $color.fg.disabled
        prefixIcon:
          color: $color.fg.disabled
        suffixText:
          color: $color.fg.disabled
        suffixIcon:
          color: $color.fg.disabled

      readonly:
        root:
          color: $color.bg.disabled
        value:
          color: $color.fg.neutral
        placeholder:
          color: $color.fg.placeholder
    size=large:
      enabled:
        root:
          height: $dimension.x13
          gap: $dimension.x2_5
          cornerRadius: $radius.r3
          paddingX: $dimension.x4
        value:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        placeholder:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        prefixText:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        prefixIcon:
          size: $dimension.x5
        suffixText:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        suffixIcon:
          size: $dimension.x5
        clearButton:
          size: 22px
    size=medium:
      enabled:
        root:
          height: $dimension.x10
          gap: $dimension.x2
          cornerRadius: $radius.r2
          paddingX: $dimension.x3_5
        value:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        placeholder:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        prefixText:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        prefixIcon:
          size: $dimension.x4
        suffixText:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        suffixIcon:
          size: $dimension.x4
        clearButton:
          size: $dimension.x4_5
