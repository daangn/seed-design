# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: tag-group
  name: Tag Group
data:
  schema:
    slots:
      separator:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
    variants:
      size:
        values:
          t2: {}
          t3: {}
          t4: {}
  rules:
    - slots:
        separator:
          color: $color.palette.gray-600
          fontWeight: $font-weight.regular
    - variants:
        size: t2
      slots:
        separator:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
    - variants:
        size: t3
      slots:
        separator:
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
    - variants:
        size: t4
      slots:
        separator:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
