# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: tag-group-item
  name: Tag Group Item
data:
  schema:
    slots:
      root:
        properties:
          gap:
            type: dimension
      label:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      icon:
        properties:
          size:
            type: dimension
          color:
            type: color
      prefixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      suffixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
    variants:
      size:
        values:
          t2: {}
          t3: {}
          t4: {}
      weight:
        values:
          regular: {}
          bold: {}
      tone:
        values:
          neutralSubtle: {}
          neutral: {}
          brand: {}
  rules:
    - slots:
        root:
          gap: $dimension.x0_5
    - variants:
        size: t2
      slots:
        label:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
        icon:
          size: $dimension.x3 # might change to rem later
        prefixIcon:
          size: $dimension.x3 # might change to rem later
        suffixIcon:
          size: $dimension.x3 # might change to rem later
    - variants:
        size: t3
      slots:
        label:
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
        icon:
          size: 13px # might change to rem later
        prefixIcon:
          size: 13px # might change to rem later
        suffixIcon:
          size: 13px # might change to rem later
    - variants:
        size: t4
      slots:
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        icon:
          size: $dimension.x3_5 # might change to rem later
        prefixIcon:
          size: $dimension.x3_5 # might change to rem later
        suffixIcon:
          size: $dimension.x3_5 # might change to rem later
    - variants:
        weight: regular
      slots:
        label:
          fontWeight: $font-weight.regular
    - variants:
        weight: bold
      slots:
        label:
          fontWeight: $font-weight.bold
    - variants:
        tone: neutralSubtle
      slots:
        label:
          color: $color.fg.neutral-subtle
        icon:
          color: $color.fg.neutral-subtle
        prefixIcon:
          color: $color.fg.neutral-subtle
        suffixIcon:
          color: $color.fg.neutral-subtle
    - variants:
        tone: neutral
      slots:
        label:
          color: $color.fg.neutral
        icon:
          color: $color.fg.neutral
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
    - variants:
        tone: brand
      slots:
        label:
          color: $color.fg.brand
        icon:
          color: $color.fg.brand
        prefixIcon:
          color: $color.fg.brand
        suffixIcon:
          color: $color.fg.brand
