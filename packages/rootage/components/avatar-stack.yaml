# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: avatar-stack
  name: Avatar Stack
data:
  schema:
    slots:
      root:
        properties:
          gap:
            type: dimension
      item:
        properties:
          cornerRadius:
            type: dimension
          strokeColor:
            type: color
          strokeWidth:
            type: dimension
    variants:
      size:
        values:
          "20": {}
          "24": {}
          "36": {}
          "42": {}
          "48": {}
          "56": {}
          "64": {}
          "80": {}
          "96": {}
          "108": {}
  rules:
    - slots:
        item:
          cornerRadius: $radius.full
          strokeColor: $color.bg.layer-default
    - variants:
        size: "20"
      slots:
        root:
          gap: -5px
        item:
          strokeWidth: 1px
    - variants:
        size: "24"
      slots:
        root:
          gap: -6px
        item:
          strokeWidth: 1px
    - variants:
        size: "36"
      slots:
        root:
          gap: -8px
        item:
          strokeWidth: 2px
    - variants:
        size: "42"
      slots:
        root:
          gap: -10px
        item:
          strokeWidth: 2px
    - variants:
        size: "48"
      slots:
        root:
          gap: -12px
        item:
          strokeWidth: 2px
    - variants:
        size: "56"
      slots:
        root:
          gap: -13px
        item:
          strokeWidth: 3px
    - variants:
        size: "64"
      slots:
        root:
          gap: -16px
        item:
          strokeWidth: 3px
    - variants:
        size: "80"
      slots:
        root:
          gap: -20px
        item:
          strokeWidth: 4px
    - variants:
        size: "96"
      slots:
        root:
          gap: -24px
        item:
          strokeWidth: 5px
    - variants:
        size: "108"
      slots:
        root:
          gap: -27px
        item:
          strokeWidth: 5px
