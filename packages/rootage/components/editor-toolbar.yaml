# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: editor-toolbar
  name: Editor Toolbar
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
          minHeight:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          gap:
            type: dimension
          strokeColor:
            type: color
          strokeWidth:
            type: dimension
      item:
        properties:
          color:
            type: color
          minHeight:
            type: dimension
          minWidth:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          gap:
            type: dimension
          cornerRadius:
            type: dimension
      label:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      icon:
        description: Icon Only 레이아웃에서 사용되는 아이콘 슬롯입니다.
        properties:
          color:
            type: color
          size:
            type: dimension
      prefixIcon:
        properties:
          color:
            type: color
          size:
            type: dimension
  definitions:
    base:
      enabled:
        root:
          color: $color.bg.layer-floating
          minHeight: $dimension.x12
          paddingX: $dimension.x2
          paddingY: $dimension.x2
          gap: $dimension.x2
          strokeColor: $color.stroke.neutral
          strokeWidth: 1px
        item:
          color: "#ffffff00"
          minHeight: $dimension.x8
          paddingX: $dimension.x3
          paddingY: $dimension.x1_5
          gap: $dimension.x1
          cornerRadius: $radius.r2
        label:
          color: $color.fg.neutral
          fontWeight: $font-weight.regular
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        icon:
          color: $color.fg.neutral
          size: $dimension.x5
        prefixIcon:
          color: $color.fg.neutral
          size: $dimension.x4
      pressed:
        item:
          color: $color.bg.neutral-weak-pressed
      selected:
        item:
          color: $color.bg.neutral-weak
        label:
          fontWeight: $font-weight.medium
    # Layout variants
    layout=iconOnly:
      enabled:
        item:
          minWidth: $dimension.x8
          paddingX: $dimension.x1_5
    # Show keyboard states
    showKeyboard=false:
      enabled:
        root:
          minHeight: $dimension.x12
    showKeyboard=true:
      enabled:
        root:
          minHeight: $dimension.x12