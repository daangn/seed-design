# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: field-label
  name: Field Label
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
    variants:
      weight:
        values:
          medium: {}
          bold: {}
  rules:
    - slots:
        root:
          color: $color.fg.neutral
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
    - variants:
        weight: medium
      slots:
        root:
          fontWeight: $font-weight.medium
    - variants:
        weight: bold
      slots:
        root:
          fontWeight: $font-weight.bold
