# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: manner-temp
  name: Manner Temp
data:
  schema:
    slots:
      root:
        properties:
          gap:
            type: dimension
      label:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      emote:
        properties:
          size:
            type: dimension
          bleed:
            type: dimension
    variants:
      level:
        values:
          l1: {}
          l2: {}
          l3: {}
          l4: {}
          l5: {}
          l6: {}
          l7: {}
          l8: {}
          l9: {}
          l10: {}
  rules:
    - slots:
        root:
          gap: $dimension.x1
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.bold
        emote:
          size: $dimension.x8
          bleed: $dimension.x1
    - variants:
        level: l1
      slots:
        label:
          color: $color.manner-temp.l1.text
    - variants:
        level: l2
      slots:
        label:
          color: $color.manner-temp.l2.text
    - variants:
        level: l3
      slots:
        label:
          color: $color.manner-temp.l3.text
    - variants:
        level: l4
      slots:
        label:
          color: $color.manner-temp.l4.text
    - variants:
        level: l5
      slots:
        label:
          color: $color.manner-temp.l5.text
    - variants:
        level: l6
      slots:
        label:
          color: $color.manner-temp.l6.text
    - variants:
        level: l7
      slots:
        label:
          color: $color.manner-temp.l7.text
    - variants:
        level: l8
      slots:
        label:
          color: $color.manner-temp.l8.text
    - variants:
        level: l9
      slots:
        label:
          color: $color.manner-temp.l9.text
    - variants:
        level: l10
      slots:
        label:
          color: $color.manner-temp.l10.text
