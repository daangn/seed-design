# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: drawer-close-button
  name: Drawer Close Button
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
          cornerRadius:
            type: dimension
          targetSize:
            type: dimension
          size:
            type: dimension
      icon:
        properties:
          color:
            type: color
          size:
            type: dimension
  definitions:
    base:
      enabled:
        root:
          color: "#ffffff00"
          cornerRadius: $radius.r3
          targetSize: 52px
          size: 52px
        icon:
          color: $color.fg.neutral
          size: 22px
      pressed:
        root:
          color: $color.bg.neutral-weak-pressed
