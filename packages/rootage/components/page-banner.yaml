# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: page-banner
  name: Page Banner
data:
  schema:
    slots:
      root:
        properties:
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          minHeight:
            type: dimension
          color:
            type: color
          gradient:
            type: gradient
      prefixIcon:
        description: 아이콘은 Fill 타입 사용을 권장합니다.
        properties:
          size:
            type: dimension
          marginRight:
            type: dimension
          color:
            type: color
      content:
        properties:
          gap:
            type: dimension
      title:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      description:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      button:
        properties:
          targetHeight:
            type: dimension
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      suffixIcon:
        properties:
          size:
            type: dimension
          targetSize:
            type: dimension
          marginLeft:
            type: dimension
          color:
            type: color
    variants:
      tone:
        values:
          magic:
            description: AI 기능을 나타냅니다. variant=solid와 조합하여 사용하지 않습니다.
          neutral: {}
          positive: {}
          informative: {}
          warning: {}
          critical: {}
      variant:
        values:
          weak:
            description: 배경색이 연한 스타일입니다.
          solid:
            description: 배경색이 진한 스타일입니다.
    states:
      - id: pressed
  rules:
    - slots:
        root:
          paddingX: $dimension.x4
          paddingY: $dimension.x2_5
          minHeight: $dimension.x10
        prefixIcon:
          size: $dimension.x4
          marginRight: $dimension.x2
        content:
          gap: $dimension.x1_5
        title:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
          fontWeight: $font-weight.bold
        description:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
          fontWeight: $font-weight.medium
        button:
          targetHeight: $dimension.x10
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
          fontWeight: $font-weight.bold
        suffixIcon:
          size: $dimension.x4
          targetSize: $dimension.x10
          marginLeft: $dimension.x2
    - variants:
        tone: neutral
        variant: weak
      slots:
        root:
          color: $color.bg.neutral-weak
        prefixIcon:
          color: $color.fg.neutral
        title:
          color: $color.fg.neutral
        description:
          color: $color.fg.neutral
        button:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
    - variants:
        tone: neutral
        variant: weak
      states:
        - pressed
      slots:
        root:
          color: $color.bg.neutral-weak-pressed
    - variants:
        tone: neutral
        variant: solid
      slots:
        root:
          color: $color.bg.neutral-inverted
        prefixIcon:
          color: $color.fg.neutral-inverted
        title:
          color: $color.fg.neutral-inverted
        description:
          color: $color.fg.neutral-inverted
        button:
          color: $color.fg.neutral-inverted
        suffixIcon:
          color: $color.fg.neutral-inverted
    - variants:
        tone: neutral
        variant: solid
      states:
        - pressed
      slots:
        root:
          color: $color.bg.neutral-inverted-pressed
    - variants:
        tone: positive
        variant: weak
      slots:
        root:
          color: $color.bg.positive-weak
        prefixIcon:
          color: $color.fg.positive-contrast
        title:
          color: $color.fg.positive-contrast
        description:
          color: $color.fg.positive-contrast
        button:
          color: $color.fg.positive-contrast
        suffixIcon:
          color: $color.fg.positive-contrast
    - variants:
        tone: positive
        variant: weak
      states:
        - pressed
      slots:
        root:
          color: $color.bg.positive-weak-pressed
    - variants:
        tone: positive
        variant: solid
      slots:
        root:
          color: $color.bg.positive-solid
        prefixIcon:
          color: $color.palette.static-white
        title:
          color: $color.palette.static-white
        description:
          color: $color.palette.static-white
        button:
          color: $color.palette.static-white
        suffixIcon:
          color: $color.palette.static-white
    - variants:
        tone: positive
        variant: solid
      states:
        - pressed
      slots:
        root:
          color: $color.bg.positive-solid-pressed
    - variants:
        tone: informative
        variant: weak
      slots:
        root:
          color: $color.bg.informative-weak
        prefixIcon:
          color: $color.fg.informative-contrast
        title:
          color: $color.fg.informative-contrast
        description:
          color: $color.fg.informative-contrast
        button:
          color: $color.fg.informative-contrast
        suffixIcon:
          color: $color.fg.informative-contrast
    - variants:
        tone: informative
        variant: weak
      states:
        - pressed
      slots:
        root:
          color: $color.bg.informative-weak-pressed
    - variants:
        tone: informative
        variant: solid
      slots:
        root:
          color: $color.bg.informative-solid
        prefixIcon:
          color: $color.palette.static-white
        title:
          color: $color.palette.static-white
        description:
          color: $color.palette.static-white
        button:
          color: $color.palette.static-white
        suffixIcon:
          color: $color.palette.static-white
    - variants:
        tone: informative
        variant: solid
      states:
        - pressed
      slots:
        root:
          color: $color.bg.informative-solid-pressed
    - variants:
        tone: warning
        variant: weak
      slots:
        root:
          color: $color.bg.warning-weak
        prefixIcon:
          color: $color.fg.warning-contrast
        title:
          color: $color.fg.warning-contrast
        description:
          color: $color.fg.warning-contrast
        button:
          color: $color.fg.warning-contrast
        suffixIcon:
          color: $color.fg.warning-contrast
    - variants:
        tone: warning
        variant: weak
      states:
        - pressed
      slots:
        root:
          color: $color.bg.warning-weak-pressed
    - variants:
        tone: warning
        variant: solid
      slots:
        root:
          color: $color.bg.warning-solid
        prefixIcon:
          color: $color.palette.static-black-alpha-900
        title:
          color: $color.palette.static-black-alpha-900
        description:
          color: $color.palette.static-black-alpha-900
        button:
          color: $color.palette.static-black-alpha-900
        suffixIcon:
          color: $color.palette.static-black-alpha-900
    - variants:
        tone: warning
        variant: solid
      states:
        - pressed
      slots:
        root:
          color: $color.bg.warning-solid-pressed
    - variants:
        tone: critical
        variant: weak
      slots:
        root:
          color: $color.bg.critical-weak
        prefixIcon:
          color: $color.fg.critical-contrast
        title:
          color: $color.fg.critical-contrast
        description:
          color: $color.fg.critical-contrast
        button:
          color: $color.fg.critical-contrast
        suffixIcon:
          color: $color.fg.critical-contrast
    - variants:
        tone: critical
        variant: weak
      states:
        - pressed
      slots:
        root:
          color: $color.bg.critical-weak-pressed
    - variants:
        tone: critical
        variant: solid
      slots:
        root:
          color: $color.bg.critical-solid
        prefixIcon:
          color: $color.palette.static-white
        title:
          color: $color.palette.static-white
        description:
          color: $color.palette.static-white
        button:
          color: $color.palette.static-white
        suffixIcon:
          color: $color.palette.static-white
    - variants:
        tone: critical
        variant: solid
      states:
        - pressed
      slots:
        root:
          color: $color.bg.critical-solid-pressed
    - variants:
        tone: magic
        variant: weak
      slots:
        root:
          gradient: $gradient.glow-magic
        prefixIcon:
          color: $color.fg.neutral
        title:
          color: $color.fg.neutral
        description:
          color: $color.fg.neutral
        button:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
    - variants:
        tone: magic
        variant: weak
      states:
        - pressed
      slots:
        root:
          gradient: $gradient.glow-magic-pressed
