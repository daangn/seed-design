# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: select-box-checkmark
  name: Select Box Checkmark
data:
  schema:
    slots:
      root:
        properties:
          size:
            type: dimension
      icon:
        properties:
          size:
            type: dimension
          color:
            type: color
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
    states:
      - id: pressed
      - id: selected
      - id: disabled
        suppresses:
          - pressed
  rules:
    - slots:
        root:
          size: $dimension.x5
        icon:
          size: 15px
          color: $color.fg.placeholder
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
    - states:
        - pressed
      slots:
        icon:
          color: $color.fg.neutral-subtle
    - states:
        - selected
      slots:
        icon:
          color: $color.fg.neutral
    - states:
        - pressed
        - selected
      slots:
        icon:
          color: $color.fg.neutral # being obvious
    - states:
        - disabled
      slots:
        icon:
          color: $color.fg.disabled
    - states:
        - selected
        - disabled
      slots:
        icon:
          color: $color.fg.disabled # being obvious
