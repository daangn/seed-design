# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: file-upload-trigger
  name: File Upload Trigger
data:
  schema:
    slots:
      root:
        properties:
          size:
            type: dimension
          gap:
            type: dimension
          color:
            type: color
          cornerRadius:
            type: dimension
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
      icon:
        properties:
          size:
            type: dimension
          color:
            type: color
      itemCount:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      maxItemCount:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
  definitions:
    base:
      enabled:
        root:
          size: 80px
          gap: $dimension.x1
          color: $color.bg.transparent
          cornerRadius: $radius.r3
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-weak
        icon:
          size: $dimension.x6
          color: $color.fg.neutral-subtle
        itemCount:
          color: $color.fg.neutral
          fontWeight: $font-weight.regular
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
        maxItemCount:
          color: $color.fg.neutral-subtle
          fontWeight: $font-weight.regular
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
      pressed:
        root:
          color: $color.bg.transparent-pressed
      disabled:
        icon:
          color: $color.fg.disabled
        itemCount:
          color: $color.fg.disabled
        maxItemCount:
          color: $color.fg.disabled
