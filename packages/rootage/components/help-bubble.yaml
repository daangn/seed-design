# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: help-bubble
  name: Help Bubble
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
          cornerRadius:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
      arrow:
        properties:
          color:
            type: color
          width:
            type: dimension
          height:
            type: dimension
          cornerRadius:
            type: dimension
          gutter:
            type: dimension
      title:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          fontWeight:
            type: number
          lineHeight:
            type: dimension
      description:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          fontWeight:
            type: number
          lineHeight:
            type: dimension
      closeButton:
        properties:
          color:
            type: color
          fromRight:
            type: dimension
          fromTop:
            type: dimension
          size:
            type: dimension
          targetSize:
            type: dimension
      backdrop:
        properties:
          color:
            type: color
  definitions:
    base:
      enabled:
        root:
          color: $color.bg.neutral-solid
          cornerRadius: $radius.r3
          paddingX: $dimension.x3
          paddingY: $dimension.x2_5
        arrow:
          color: $color.bg.neutral-solid
          width: 12px
          height: 8px
          cornerRadius: 2px
          gutter: 4px
        title:
          color: $color.palette.static-white
          fontSize: $font-size.t3
          fontWeight: $font-weight.bold
          lineHeight: $line-height.t3
        description:
          color: $color.palette.static-white
          fontSize: $font-size.t3
          fontWeight: $font-weight.regular
          lineHeight: $line-height.t3
        closeButton:
          color: $color.palette.static-white
          fromRight: 12px
          fromTop: 12px
          size: 14px
          targetSize: 32px
        backdrop:
          color: $color.bg.overlay
