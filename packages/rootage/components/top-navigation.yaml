# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: top-navigation
  name: Top Navigation
data:
  schema:
    slots:
      root:
        properties:
          height:
            type: dimension
          paddingX:
            type: dimension
          color:
            type: color
          strokeColor:
            type: color
          strokeWidth:
            type: dimension
      left:
        properties: {}
        description: 왼쪽 영역입니다. 일반적으로 뒤로가기/닫기 Top Navigation Icon Button이 위치합니다.
      main:
        properties:
          paddingLeft:
            type: dimension
        description: title과 subtitle을 포함하는 영역입니다.
      right:
        properties: {}
        description: 오른쪽 영역입니다. 일반적으로 Top Navigation Icon Button 또는 Top Navigation Text
          Button이 위치합니다.
      title:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          fontWeight:
            type: number
          lineHeight:
            type: dimension
          maxFontSizeScale:
            type: number
          minFontSizeScale:
            type: number
          maxLineHeightScale:
            type: number
          minLineHeightScale:
            type: number
      subtitle:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          fontWeight:
            type: number
          lineHeight:
            type: dimension
          maxFontSizeScale:
            type: number
          minFontSizeScale:
            type: number
          maxLineHeightScale:
            type: number
          minLineHeightScale:
            type: number
  definitions:
    theme=cupertino:
      enabled:
        root:
          height: 44px
          paddingX: $dimension.x4
        # main:
        #   paddingLeft: $dimension.x1
    theme=android:
      enabled:
        root:
          height: 56px
          paddingX: $dimension.x4
        main:
          paddingLeft: 16px # should be $dimension.x1_5 after we add pressed styles to top navigation icon buttons and do the layout based on the button size rather than the icon size
    tone=layer:
      enabled:
        root:
          color: $color.bg.layer-default
        title:
          color: $color.fg.neutral
        subtitle:
          color: $color.fg.neutral-muted
    tone=transparent:
      enabled:
        root:
          color: "#00000000"
        title:
          color: $color.palette.static-white
        subtitle:
          color: $color.palette.static-white
    divider=true:
      enabled:
        root:
          strokeColor: $color.stroke.neutral-subtle
          strokeWidth: 1px
    titleLayout=titleOnly:
      enabled:
        title:
          fontSize: $font-size.t6
          fontWeight: $font-weight.bold
          lineHeight: $line-height.t6
          maxFontSizeScale: 1.2
          minFontSizeScale: 1
          maxLineHeightScale: 1.2
          minLineHeightScale: 1
    titleLayout=withSubtitle:
      enabled:
        title:
          fontSize: $font-size.t5
          fontWeight: $font-weight.bold
          lineHeight: $line-height.t5
          maxFontSizeScale: 1.2
          minFontSizeScale: 1
          maxLineHeightScale: 1.2
          minLineHeightScale: 1
        subtitle:
          fontSize: $font-size.t2
          fontWeight: $font-weight.regular
          lineHeight: $line-height.t2
          maxFontSizeScale: 1.2
          minFontSizeScale: 1
          maxLineHeightScale: 1.2
          minLineHeightScale: 1
