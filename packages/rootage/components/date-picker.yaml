# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: date-picker
  name: Date Picker
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
      header:
        properties:
          height:
            type: dimension
      headerLabel:
        properties:
          paddingX:
            type: dimension
          gap:
            type: dimension
          iconSize:
            type: dimension
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      months:
        properties:
          gap:
            type: dimension
      continuousScroll:
        properties:
          fogHeight:
            type: dimension
      weekday:
        properties:
          height:
            type: dimension
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      monthLabel:
        properties:
          height:
            type: dimension
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      dateCell:
        properties:
          minHeight:
            type: dimension
      dateVisual:
        properties:
          size:
            type: dimension
          cornerRadius:
            type: dimension
          color:
            type: color
      dateContent:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      rangeBackground:
        properties:
          color:
            type: color
      wheelSelectionIndicator:
        properties:
          cornerRadius:
            type: dimension
          color:
            type: color
      wheelContainer:
        properties:
          height:
            type: dimension
      wheelItem:
        properties:
          paddingX:
            type: dimension
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
    states:
      - id: pressed
      - id: today
      - id: selected
      - id: disabled
        suppresses:
          - pressed
  rules:
    - slots:
        root:
          color: $color.bg.layer-floating
        header:
          height: $dimension.x12
        headerLabel:
          paddingX: $dimension.x1
          gap: $dimension.x1
          iconSize: $dimension.x5
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.bold
          color: $color.fg.neutral
        months:
          gap: $dimension.x6
        continuousScroll:
          fogHeight: 96px
        weekday:
          height: $dimension.x12
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
          fontWeight: $font-weight.medium
          color: $color.fg.neutral-subtle
        monthLabel:
          height: $dimension.x12
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.bold
          color: $color.fg.neutral
        dateCell:
          minHeight: $dimension.x12
        dateVisual:
          size: 42px
          cornerRadius: $radius.full
          color: $color.bg.transparent
        dateContent:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.medium
          color: $color.fg.neutral-muted
        rangeBackground:
          color: $color.bg.neutral-weak
        wheelSelectionIndicator:
          cornerRadius: $radius.r2
          color: $color.bg.neutral-weak
        wheelContainer:
          # 44px × 7개 항목(308px)을 중앙 정렬하고 위아래 14px 여백을 둡니다.
          height: 336px
        wheelItem:
          paddingX: $dimension.x4
          fontSize: $font-size.t10-static
          lineHeight: $line-height.t10-static
          fontWeight: $font-weight.medium
          color: $color.fg.disabled
    - states:
        - pressed
      slots:
        dateVisual:
          color: $color.bg.transparent-pressed
    - states:
        - today
      slots:
        dateVisual:
          color: $color.bg.neutral-weak
    - states:
        - selected
      slots:
        dateVisual:
          color: $color.bg.neutral-inverted
        dateContent:
          color: $color.fg.neutral-inverted
        wheelItem:
          color: $color.fg.neutral
    - states:
        - disabled
      slots:
        dateContent:
          color: $color.fg.disabled
