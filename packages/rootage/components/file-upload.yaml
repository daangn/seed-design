# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: file-upload
  name: File Upload
data:
  schema:
    slots:
      root:
        properties:
          gap:
            type: dimension
        description: File Upload Dropzone과 Items를 감싸는 컨테이너입니다.
      items:
        properties:
          gap:
            type: dimension
        description: File Upload Trigger 및 File Upload Item을 감싸는 컨테이너입니다.
  definitions:
    base:
      enabled:
        root:
          gap: $dimension.x2
        items:
          gap: $dimension.x2
