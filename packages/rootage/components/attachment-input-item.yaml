# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: attachment-input-item
  name: Attachment Input Item
data:
  schema:
    slots:
      root:
        properties:
          width:
            type: dimension
          height:
            type: dimension
          paddingX:
            type: dimension
          gap:
            type: dimension
          color:
            type: color
          cornerRadius:
            type: dimension
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
          opacity:
            type: number
          scaleScope:
            type: enum
            values: [self, content]
      thumbnail:
        properties:
          color:
            type: color
          size:
            type: dimension
          cornerRadius:
            type: dimension
      thumbnailIcon:
        properties:
          color:
            type: color
          size:
            type: dimension
      name:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      size:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      backdrop:
        properties:
          color:
            type: color
      removeButtonMask:
        description: dragging 상태에서는 표시되지 않습니다.
        properties:
          offset:
            type: dimension
          size:
            type: dimension
      badge:
        properties:
          color:
            type: color
          height:
            type: dimension
          cornerRadius:
            type: dimension
          paddingX:
            type: dimension
          backdropBlur:
            type: dimension
            description: 백드롭 블러의 Gaussian 표준편차입니다. CSS `blur()`와 같은 기준이며, Figma Background blur 값의 절반에 해당합니다.
      badgeLabel:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      durationBadge:
        properties:
          color:
            type: color
          cornerRadius:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          fromTop:
            type: dimension
          fromLeft:
            type: dimension
          backdropBlur:
            type: dimension
            description: 백드롭 블러의 Gaussian 표준편차입니다. CSS `blur()`와 같은 기준이며, Figma Background blur 값의 절반에 해당합니다.
      durationBadgeLabel:
        description: Unicode CLDR의 `en` 로케일에 정의된 `durationUnit` 패턴을 기준으로, 1시간 미만은 `ms`, 1시간 이상은 `hms`를 사용합니다. 초 미만은 버림 처리하며, 24시간을 초과하더라도 일 단위로 분리하지 않고 시간 단위로 누적하여 표시합니다.
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number

  definitions:
    base:
      enabled:
        root:
          height: 80px
          color: $color.bg.transparent
          cornerRadius: $radius.r3
          strokeWidth: 1px
          gap: $dimension.x2_5
        thumbnail:
          color: $color.bg.neutral-weak
          size: $dimension.x12
          cornerRadius: $radius.r2
        thumbnailIcon:
          color: $color.fg.neutral-subtle
          size: $dimension.x6
        name:
          color: $color.fg.neutral
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
          fontWeight: $font-weight.medium
        size:
          color: $color.fg.neutral-subtle
          fontSize: $font-size.t1
          lineHeight: $line-height.t1
          fontWeight: $font-weight.regular
        removeButtonMask:
          offset: $dimension.x1_5
          size: $dimension.x6
      pressed:
        root:
          scaleScope: self

    type=file:
      enabled:
        root:
          width: 160px
          strokeColor: $color.stroke.neutral-weak
          paddingX: $dimension.x4
      readonly:
        thumbnailIcon:
          color: $color.fg.disabled
        name:
          color: $color.fg.disabled
        size:
          color: $color.fg.disabled
      dragging:
        thumbnailIcon:
          color: $color.fg.disabled
        name:
          color: $color.fg.disabled
        size:
          color: $color.fg.disabled

    type=image:
      enabled:
        root:
          width: 80px
          strokeColor: $color.stroke.neutral-subtle
        backdrop:
          color: $color.bg.overlay
        badge:
          color: $color.bg.overlay
          height: $dimension.x6
          cornerRadius: $radius.r3
          paddingX: $dimension.x1
          backdropBlur: 2px
        badgeLabel:
          color: $color.palette.static-white
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
          fontWeight: $font-weight.medium
        durationBadge:
          color: $color.palette.static-black-alpha-800
          cornerRadius: $radius.full
          paddingX: $dimension.x1_5
          paddingY: $dimension.x0_5
          fromTop: $dimension.x1_5
          fromLeft: $dimension.x1_5
          backdropBlur: 2px
        durationBadgeLabel:
          color: $color.palette.static-white
          fontSize: $font-size.t1
          lineHeight: $line-height.t1
          fontWeight: $font-weight.medium
      readonly:
        root:
          opacity: 0.5
      dragging:
        root:
          opacity: 0.5
