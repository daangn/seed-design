# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: menu-sheet
  name: Menu Sheet
data:
  schema:
    slots:
      backdrop:
        properties:
          color:
            type: color
          enterDuration:
            type: duration
          enterTimingFunction:
            type: cubicBezier
          enterOpacity:
            type: number
          exitDuration:
            type: duration
          exitTimingFunction:
            type: cubicBezier
          exitOpacity:
            type: number
      content:
        properties:
          color:
            type: color
          maxWidth:
            type: dimension
          maxHeightFraction:
            type: number
            description: inset을 빼지 않은 viewport height 또는 parent height에 대한 최대 비율입니다. 최대 높이는 min(maxHeightFraction × 높이, 상단 inset을 뺀 높이)이므로, content는 상단 안전 영역 경계까지만 커집니다.
          paddingX:
            type: dimension
          paddingY:
            type: dimension
            description: 이 값은 하단 inset과 합산하여 적용합니다.
          topCornerRadius:
            type: dimension
          enterDuration:
            type: duration
          enterTimingFunction:
            type: cubicBezier
          exitDuration:
            type: duration
          exitTimingFunction:
            type: cubicBezier
        description: content는 가로 기준으로 안전 영역의 가운데에 놓입니다.
      header:
        properties:
          gap:
            type: dimension
          paddingBottom:
            type: dimension
      title:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      description:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      list:
        properties:
          gap:
            type: dimension
      group:
        properties:
          cornerRadius:
            type: dimension
      divider:
        properties:
          strokeBottomWidth:
            type: dimension
          strokeColor:
            type: color
      footer:
        properties:
          paddingTop:
            type: dimension
  definitions:
    base:
      enabled:
        backdrop:
          color: $color.bg.overlay
          enterDuration: $duration.d2
          enterTimingFunction: $timing-function.enter
          enterOpacity: 0
          exitDuration: $duration.d2
          exitTimingFunction: $timing-function.exit
          exitOpacity: 0
        content:
          color: $color.bg.layer-floating
          maxWidth: 480px
          maxHeightFraction: 0.9
          paddingX: $dimension.spacing-x.global-gutter
          paddingY: $dimension.x4
          topCornerRadius: $radius.r5
          enterDuration: $duration.d6
          enterTimingFunction: $timing-function.enter-expressive
          # Do we need translateY definition here?
          exitDuration: $duration.d4
          exitTimingFunction: $timing-function.exit
        header:
          gap: $dimension.x1
          paddingBottom: $dimension.x4
        title:
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
          fontWeight: $font-weight.bold
          color: $color.fg.neutral
        description:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
          fontWeight: $font-weight.regular
          color: $color.fg.neutral-muted
        # We might need description in near future
        list:
          gap: $dimension.x2_5
        group:
          cornerRadius: $radius.r4
        divider:
          strokeBottomWidth: 1px
          strokeColor: $color.stroke.neutral-muted
        footer:
          paddingTop: $dimension.x2_5
