# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: side-panel-close-button
  name: Side Panel Close Button
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
          cornerRadius:
            type: dimension
          targetSize:
            type: dimension
          size:
            type: dimension
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
      icon:
        properties:
          color:
            type: color
          size:
            type: dimension
  definitions:
    base:
      enabled:
        root:
          color: $color.bg.transparent
          cornerRadius: $radius.r3
          targetSize: 52px
          size: 52px
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
        icon:
          color: $color.fg.neutral
          size: 22px
      pressed:
        root:
          color: $color.bg.neutral-weak-pressed
