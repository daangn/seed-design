# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: side-panel-close-button
  name: Side Panel Close Button
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
          cornerRadius:
            type: dimension
          size:
            type: dimension
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
      icon:
        properties:
          color:
            type: color
          size:
            type: dimension
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
  definitions:
    base:
      enabled:
        root:
          color: $color.bg.transparent
          cornerRadius: $radius.r3
          size: 52px
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
        icon:
          color: $color.fg.neutral-subtle
          size: 22px
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
      pressed:
        root:
          color: $color.bg.transparent-pressed
