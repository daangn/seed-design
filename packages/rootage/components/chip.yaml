# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: chip
  name: Chip
  lastUpdated: 25-07-17
data:
  schema:
    slots:
      root:
        properties:
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          strokeColor:
            type: color
          strokeWidth:
            type: dimension
          cornerRadius:
            type: dimension
          height:
            type: dimension
          gap:
            type: dimension
          paddingX:
            type: dimension
          minWidth:
            type: dimension
          color:
            type: color
          opacity:
            type: number
      label:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      prefixIcon:
        properties:
          color:
            type: color
          size:
            type: dimension
      prefixAvatar:
        properties:
          size:
            type: dimension
      suffixIcon:
        properties:
          color:
            type: color
          size:
            type: dimension
      icon:
        properties:
          color:
            type: color
          size:
            type: dimension
  definitions:
    base:
      enabled:
        root:
          colorDuration: $duration.d4
          colorTimingFunction: $timing-function.easing
          cornerRadius: $radius.full
        prefixIcon:
          paddingLeft: $dimension.x1_5
        prefixAvatar:
          size: $dimension.x6
        suffixIcon:
          paddingRight: $dimension.x1_5
        label:
          fontWeight: $font-weight.medium
          paddingX: $dimension.x1_5
        icon:
          color: $color.fg.neutral

    variant=solid:
      enabled:
        root:
          color: $color.bg.neutral-weak
        label:
          color: $color.fg.neutral
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
        icon:
          color: $color.fg.neutral
      pressed:
        root:
          color: $color.bg.neutral-weak-pressed
        label:
          color: $color.fg.neutral
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
        icon:
          color: $color.fg.neutral
      disabled:
        root:
          opacity: 0.5
      selected:
        root:
          color: $color.bg.neutral-inverted
        label:
          color: $color.fg.neutral-inverted
        prefixIcon:
          color: $color.fg.neutral-inverted
        suffixIcon:
          color: $color.fg.neutral-inverted
        icon:
          color: $color.fg.neutral-inverted
      selected, pressed:
        root:
          color: $color.bg.neutral-inverted-pressed
        label:
          color: $color.fg.neutral-inverted
        prefixIcon:
          color: $color.fg.neutral-inverted
        suffixIcon:
          color: $color.fg.neutral-inverted
        icon:
          color: $color.fg.neutral-inverted
      selected, disabled:
        root:
          opacity: 0.5

    variant=outlineStrong:
      enabled:
        root:
          strokeColor: $color.stroke.neutral
          strokeWidth: 1px
          color: $color.bg.layer-default
        label:
          color: $color.fg.neutral
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
        icon:
          color: $color.fg.neutral
      pressed:
        root:
          strokeColor: $color.stroke.neutral
          strokeWidth: 1px
          color: $color.bg.layer-default-pressed
        label:
          color: $color.fg.neutral
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
        icon:
          color: $color.fg.neutral
      disabled:
        root:
          opacity: 0.5
      selected:
        root:
          color: $color.bg.neutral-inverted
        label:
          color: $color.fg.neutral-inverted
        prefixIcon:
          color: $color.fg.neutral-inverted
        suffixIcon:
          color: $color.fg.neutral-inverted
        icon:
          color: $color.fg.neutral-inverted
      selected, pressed:
        root:
          color: $color.bg.neutral-inverted-pressed
        label:
          color: $color.fg.neutral-inverted
        prefixIcon:
          color: $color.fg.neutral-inverted
        suffixIcon:
          color: $color.fg.neutral-inverted
        icon:
          color: $color.fg.neutral-inverted
      selected, disabled:
        root:
          opacity: 0.5

    variant=outlineWeak:
      enabled:
        root:
          strokeColor: $color.stroke.neutral
          strokeWidth: 1px
          color: $color.bg.layer-default
        label:
          color: $color.fg.neutral
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
        icon:
          color: $color.fg.neutral
      pressed:
        root:
          strokeColor: $color.stroke.neutral
          strokeWidth: 1px
          color: $color.bg.layer-default-pressed
        label:
          color: $color.fg.neutral
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
        icon:
          color: $color.fg.neutral
      disabled:
        root:
          opacity: 0.5
      selected:
        root:
          strokeColor: $color.stroke.field-focused
          strokeWidth: 1px
          color: $color.bg.neutral-weak
        label:
          color: $color.fg.neutral
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
        icon:
          color: $color.fg.neutral
      selected, pressed:
        root:
          strokeColor: $color.stroke.field-focused
          strokeWidth: 1px
          color: $color.bg.neutral-weak-pressed
        label:
          color: $color.fg.neutral
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral
        icon:
          color: $color.fg.neutral
      selected, disabled:
        root:
          opacity: 0.5

    size=small:
      enabled:
        root:
          height: 32px
          paddingX: $dimension.x1_5
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        prefixIcon:
          size: $dimension.x3_5
        suffixIcon:
          size: $dimension.x3_5
        prefixAvatar:
          size: $dimension.x5
        icon:
          size: $dimension.x3_5
    size=medium:
      enabled:
        root:
          height: 36px
          paddingX: $dimension.x2
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        prefixIcon:
          size: $dimension.x4
        suffixIcon:
          size: $dimension.x3_5
        prefixAvatar:
          size: $dimension.x6
        icon:
          size: $dimension.x4
    size=large:
      enabled:
        root:
          height: 40px
          paddingX: $dimension.x2_5
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        prefixIcon:
          size: $dimension.x4
          paddingLeft: $dimension.x1_5
        suffixIcon:
          size: $dimension.x4
        prefixAvatar:
          size: $dimension.x7
        icon:
          size: $dimension.x4

    size=small,layout=iconOnly:
      enabled:
        root:
          minWidth: $dimension.x8
    size=medium,layout=iconOnly:
      enabled:
        root:
          minWidth: $dimension.x9
    size=large,layout=iconOnly:
      enabled:
        root:
          minWidth: $dimension.x10
