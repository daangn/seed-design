# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: field
  name: Field
data:
  schema:
    slots:
      header:
        properties:
          paddingX:
            type: dimension
          gap:
            type: dimension
      labelContainer:
        properties:
          gap:
            type: dimension
      label:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      indicator:
        properties:
          color:
            type: color
          paddingTop:
            type: dimension
      footer:
        properties:
          paddingX:
            type: dimension
          gap:
            type: dimension
      description:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      errorContainer:
        properties:
          gap:
            type: dimension
      errorMessage:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      errorIcon:
        properties:
          color:
            type: color
          size:
            type: dimension
      characterCount:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      maxCharacterCount:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
  definitions:
    base:
      enabled:
        header:
          paddingX: $dimension.x0_5
          gap: $dimension.x3 # 미정
        labelContainer:
          gap: $dimension.x0_5
        label:
          color: $color.fg.neutral
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        indicator:
          color: $color.fg.neutral
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.regular
        footer:
          paddingX: $dimension.x0_5
          gap: $dimension.x3 # 미정
        description:
          color: $color.palette.gray-700 # 시맨틱 검토 필요
          fontWeight: $font-weight.regular
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        errorContainer:
          gap: $dimension.x1_5
        errorMessage:
          color: $color.fg.critical
          fontWeight: $font-weight.regular
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        errorIcon:
          color: $color.fg.critical
          size: $dimension.x4
        characterCount:
          color: $color.palette.gray-700
          fontWeight: $font-weight.regular
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        maxCharacterCount:
          color: $color.palette.gray-600
          fontWeight: $font-weight.regular
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
      invalid:
        characterCount:
          color: $color.fg.critical
        maxCharacterCount:
          color: $color.fg.critical
    weight=medium: # field 전체의 variant가 medium/bold처럼 느껴지진 않아서 고민 (rootage를 쪼개야 하나)
      enabled:
        label:
          fontWeight: $font-weight.medium # checkbox.yaml 보면 또 어색하지 않기도 한데
    weight=bold:
      enabled:
        label:
          fontWeight: $font-weight.bold
