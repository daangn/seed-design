# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: field
  name: Field
data:
  schema:
    slots:
      header:
        properties:
          paddingBottom:
            type: dimension
          gap:
            type: dimension
      label:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      indicator:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      footer:
        properties:
          gap:
            type: dimension
          paddingTop:
            type: dimension
          minHeight:
            type: dimension
      description:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      errorMessage:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      errorIcon:
        properties:
          size:
            type: dimension
          marginRight:
            type: dimension
      characterCount:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      maxCharacterCount:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
  definitions:
    base:
      enabled:
        label:
          color: $color.fg.neutral
          fontWeight: $font-weight.bold
        indicator:
          color: $color.fg.neutral
          fontWeight: $font-weight.regular
        description:
          color: $color.fg.neutral-subtle
          fontWeight: $font-weight.regular
        errorMessage:
          color: $color.fg.critical
          fontWeight: $font-weight.regular
        characterCount:
          color: $color.fg.neutral
          fontWeight: $font-weight.regular
        maxCharacterCount:
          color: $color.fg.neutral-subtle
          fontWeight: $font-weight.regular

    size=xlarge:
      enabled:
        header:
          paddingBottom: $dimension.x3
          gap: $dimension.x1_5
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        indicator:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        footer:
          gap: $dimension.x3_5
          paddingTop: $dimension.x2
          minHeight: 20px
        description:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        errorMessage:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        errorIcon:
          size: $dimension.x4
          marginRight: $dimension.x1
        characterCount:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
        maxCharacterCount:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2

    size=large:
      enabled:
        header:
          paddingBottom: $dimension.x3
          gap: $dimension.x1_5
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        indicator:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        footer:
          gap: $dimension.x3_5
          paddingTop: $dimension.x2
          minHeight: 20px
        description:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        errorMessage:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        errorIcon:
          size: $dimension.x4
          marginRight: $dimension.x1
        characterCount:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
        maxCharacterCount:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2

    size=medium:
      enabled:
        header:
          paddingBottom: $dimension.x3 # gap 빠져있는 듯
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        indicator:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        footer:
          gap: $dimension.x3_5
          paddingTop: $dimension.x2
          minHeight: $dimension.x4
        description:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
        errorMessage:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
        errorIcon:
          size: $dimension.x3_5
          marginRight: $dimension.x1
        characterCount:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
        maxCharacterCount:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
