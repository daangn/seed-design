# yaml-language-server: $schema=./schema.json
# parts: root, segment, indicator
kind: ComponentSpec
metadata:
  id: segmented-control-item
  name: Segmented Control Item
data:
  schema:
    slots:
      root:
        properties:
          height:
            type: dimension
          cornerRadius:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          gap:
            type: dimension
          minWidth:
            type: dimension
          color:
            type: color
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
      label:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
  definitions:
    base:
      enabled:
        root:
          height: $dimension.x8
          cornerRadius: $radius.full
          paddingX: $dimension.x6
          paddingY: $dimension.x1_5
          gap: $dimension.x1_5
          minWidth: 86px
          colorDuration: $duration.d4
          colorTimingFunction: $timing-function.easing
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.medium
          color: $color.fg.neutral-muted
          colorDuration: $duration.d4
          colorTimingFunction: $timing-function.easing
      pressed:
        root:
          color: $color.bg.neutral-weak-pressed
      selected:
        label:
          color: $color.fg.neutral
      selected,pressed:
        root:
          color: $color.bg.layer-default-pressed
      disabled:
        label:
          color: $color.fg.disabled
