# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: side-panel
  name: Side Panel
data:
  schema:
    slots:
      backdrop:
        properties:
          color:
            type: color
          enterDuration:
            type: duration
          enterTimingFunction:
            type: cubicBezier
          enterOpacity:
            type: number
          exitDuration:
            type: duration
          exitTimingFunction:
            type: cubicBezier
          exitOpacity:
            type: number
      content:
        properties:
          color:
            type: color
          width:
            type: dimension
          widthFraction:
            type: number
            description: viewport 또는 parent width에 대한 mobile content width 비율입니다.
          enterDuration:
            type: duration
          enterTimingFunction:
            type: cubicBezier
          exitDuration:
            type: duration
          exitTimingFunction:
            type: cubicBezier
        description: 하단 safe-area inset을 content의 하단 패딩으로 적용합니다.
      header:
        properties:
          gap:
            type: dimension
          minHeight:
            type: dimension
          paddingX:
            type: dimension
          paddingTop:
            type: dimension
            description: 이 값은 상단 safe-area inset과 합산하여 적용합니다.
          paddingBottom:
            type: dimension
          closeButtonGap:
            type: dimension
            description: closeButton이 표시되는 경우 paddingRight에 추가되는 여백입니다.
      body:
        properties:
          paddingX:
            type: dimension
          paddingBottom:
            type: dimension
            description: body의 하단 padding이며, 동시에 하단 scroll fog 그라데이션의 높이로도 사용됩니다.
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
            description: 본문이 스크롤된(scrolled) 상태에서 body 상단에 나타나는 divider의 색상입니다.
          strokeDuration:
            type: duration
          strokeTimingFunction:
            type: cubicBezier
      footer:
        properties:
          paddingX:
            type: dimension
          paddingTop:
            type: dimension
          paddingBottom:
            type: dimension
      title:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      description:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      closeButton:
        properties:
          fromTop:
            type: dimension
          fromRight:
            type: dimension
    variants:
      size:
        values:
          small: {}
          medium: {}
          large: {}
    states:
      - id: scrolled
  rules:
    - slots:
        backdrop:
          color: $color.bg.overlay
          enterDuration: $duration.d6
          enterTimingFunction: $timing-function.enter
          enterOpacity: 0
          exitDuration: $duration.d6
          exitTimingFunction: $timing-function.exit
          exitOpacity: 0
        content:
          color: $color.bg.layer-floating
          widthFraction: 0.8
          enterDuration: $duration.d6
          enterTimingFunction: $timing-function.enter-expressive
          exitDuration: $duration.d6
          exitTimingFunction: $timing-function.exit-expressive
        header:
          gap: $dimension.x1_5
          minHeight: 70px
          paddingX: $dimension.x6
          paddingTop: $dimension.x6
          paddingBottom: $dimension.x4
          closeButtonGap: $dimension.x1_5
        body:
          paddingX: $dimension.x6
          paddingBottom: $dimension.x12
          strokeDuration: $duration.color-transition
          strokeTimingFunction: $timing-function.easing
        footer:
          paddingX: $dimension.x6
          paddingTop: $dimension.x4
          paddingBottom: $dimension.x6
        title:
          color: $color.fg.neutral
          fontSize: $font-size.t8
          lineHeight: $line-height.t8
          fontWeight: $font-weight.bold
        description:
          color: $color.fg.neutral-muted
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.regular
        closeButton:
          fromTop: 28px
          fromRight: 24px
    - states:
        - scrolled
      slots:
        body:
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-muted
    - variants:
        size: small
      slots:
        content:
          width: 480px
    - variants:
        size: medium
      slots:
        content:
          width: 720px
    - variants:
        size: large
      slots:
        content:
          width: 960px
