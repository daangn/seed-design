# yaml-language-server: $schema=./schema.json
# parts: root, icon
kind: ComponentSpec
metadata:
  id: radiomark
  name: Radiomark
data:
  schema:
    slots:
      root:
        properties:
          size:
            type: dimension
          color:
            type: color
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
          cornerRadius:
            type: dimension
      icon:
        properties:
          size:
            type: dimension
          color:
            type: color
          cornerRadius:
            type: dimension
  definitions:
    base:
      enabled:
        root:
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-weak
          cornerRadius: $radius.full
        icon:
          cornerRadius: $radius.full
      enabled,pressed:
        root:
          color: $color.bg.layer-default-pressed
      enabled,selected:
        root:
          strokeWidth: 0px
      disabled:
        root:
          color: $color.palette.gray-300
      disabled,selected:
        root:
          strokeColor: $color.palette.gray-300
        icon:
          color: $color.palette.gray-300

    tone=brand:
      enabled,selected:
        root:
          color: $color.bg.brand-solid
        icon:
          color: $color.palette.static-white
      enabled,selected,pressed:
        root:
          color: $color.bg.brand-solid-pressed
    tone=neutral:
      enabled,selected:
        root:
          color: $color.bg.neutral-inverted
        icon:
          color: $color.fg.neutral-inverted
      enabled,selected,pressed:
        root:
          color: $color.bg.neutral-inverted-pressed

    size=medium:
      enabled:
        root:
          size: $dimension.x5
        icon:
          size: $dimension.x2
      disabled:
        icon:
          size: $dimension.x2_5 
    size=large:
      enabled:
        root:
          size: $dimension.x6
        icon:
          size: $dimension.x2_5
      disabled:
        icon:
          size: $dimension.x3
