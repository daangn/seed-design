# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: radiomark
  name: Radiomark
data:
  schema:
    slots:
      root:
        properties:
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          size:
            type: dimension
          color:
            type: color
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
          cornerRadius:
            type: dimension
      icon:
        properties:
          size:
            type: dimension
          color:
            type: color
          cornerRadius:
            type: dimension
    states:
      - id: pressed
      - id: selected
      - id: disabled
        suppresses:
          - pressed
    variants:
      tone:
        values:
          brand: {}
          neutral: {}
      size:
        values:
          medium: {}
          large: {}
  rules:
    - slots:
        root:
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-weak
          cornerRadius: $radius.full
        icon:
          cornerRadius: $radius.full
    - states:
        - pressed
      slots:
        root:
          color: $color.bg.transparent-pressed
    - states:
        - selected
      slots:
        root:
          strokeWidth: 0px
          strokeColor: "#00000000"
    - variants:
        tone: brand
      states:
        - selected
      slots:
        root:
          color: $color.bg.brand-solid
        icon:
          color: $color.palette.static-white
    - variants:
        tone: brand
      states:
        - pressed
        - selected
      slots:
        root:
          color: $color.bg.brand-solid-pressed
    - variants:
        tone: brand
      states:
        - disabled
      slots:
        root:
          color: $color.palette.gray-300
    - variants:
        tone: brand
      states:
        - selected
        - disabled
      slots:
        root:
          color: $color.bg.transparent
          strokeWidth: 1px
          strokeColor: $color.palette.gray-300
        icon:
          color: $color.palette.gray-300
    - variants:
        tone: neutral
      states:
        - selected
      slots:
        root:
          color: $color.bg.neutral-inverted
        icon:
          color: $color.fg.neutral-inverted
    - variants:
        tone: neutral
      states:
        - pressed
        - selected
      slots:
        root:
          color: $color.bg.neutral-inverted-pressed
    - variants:
        tone: neutral
      states:
        - disabled
      slots:
        root:
          color: $color.palette.gray-300
    - variants:
        tone: neutral
      states:
        - selected
        - disabled
      slots:
        root:
          color: $color.bg.transparent
          strokeWidth: 1px
          strokeColor: $color.palette.gray-300
        icon:
          color: $color.palette.gray-300
    - variants:
        size: medium
      slots:
        root:
          size: $dimension.x5
        icon:
          size: $dimension.x2
    - variants:
        size: medium
      states:
        - disabled
      slots:
        icon:
          size: $dimension.x2_5
    - variants:
        size: large
      slots:
        root:
          size: $dimension.x6
        icon:
          size: $dimension.x2_5
    - variants:
        size: large
      states:
        - disabled
      slots:
        icon:
          size: $dimension.x3
