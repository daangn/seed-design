# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: radiomark
  name: Radiomark
data:
  schema:
    slots:
      root:
        description: pressed 시 root가 축소됩니다. 누르는 영역은 Radio Group Item root 전체이지만 축소되는 것은 이 슬롯뿐입니다. 감싸는 컴포넌트가 이미 자체 pressed 피드백을 주는 경우(List Item 등)에는 축소되지 않습니다.
        properties:
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          size:
            type: dimension
          color:
            type: color
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
          cornerRadius:
            type: dimension
      icon:
        properties:
          size:
            type: dimension
          color:
            type: color
          cornerRadius:
            type: dimension
  definitions:
    base:
      enabled:
        root:
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-weak
          cornerRadius: $radius.full
        icon:
          cornerRadius: $radius.full
      enabled,pressed:
        root:
          color: $color.bg.transparent-pressed
      enabled,selected:
        root:
          strokeWidth: 0px
          strokeColor: "#00000000"

    tone=brand:
      enabled,selected:
        root:
          color: $color.bg.brand-solid
        icon:
          color: $color.palette.static-white
      enabled,selected,pressed:
        root:
          color: $color.bg.brand-solid-pressed
      disabled:
        root:
          color: $color.palette.gray-300
      disabled,selected:
        root:
          color: $color.bg.transparent
          strokeWidth: 1px
          strokeColor: $color.palette.gray-300
        icon:
          color: $color.palette.gray-300
    tone=neutral:
      enabled,selected:
        root:
          color: $color.bg.neutral-inverted
        icon:
          color: $color.fg.neutral-inverted
      enabled,selected,pressed:
        root:
          color: $color.bg.neutral-inverted-pressed
      disabled:
        root:
          color: $color.palette.gray-300
      disabled,selected:
        root:
          color: $color.bg.transparent
          strokeWidth: 1px
          strokeColor: $color.palette.gray-300
        icon:
          color: $color.palette.gray-300

    size=medium:
      enabled:
        root:
          size: $dimension.x5
        icon:
          size: $dimension.x2
      disabled:
        icon:
          size: $dimension.x2_5
    size=large:
      enabled:
        root:
          size: $dimension.x6
        icon:
          size: $dimension.x2_5
      disabled:
        icon:
          size: $dimension.x3
