# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: control-chip
  name: Control Chip
  deprecated: Use Chip.Toggle or Chip.Button instead.
  lastUpdated: 25-07-16
data:
  schema:
    slots:
      root:
        properties:
          strokeColor:
            type: color
          strokeWidth:
            type: dimension
          cornerRadius:
            type: dimension
          minHeight:
            type: dimension
          paddingY:
            type: dimension
          gap:
            type: dimension
          paddingX:
            type: dimension
          minWidth:
            type: dimension
          color:
            type: color
      label:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      prefixIcon:
        properties:
          color:
            type: color
          size:
            type: dimension
      suffixIcon:
        properties:
          color:
            type: color
          size:
            type: dimension
      icon:
        properties:
          color:
            type: color
          size:
            type: dimension
      count:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
    states:
      - id: pressed
      - id: selected
      - id: disabled
        suppresses:
          - pressed
    variants:
      size:
        values:
          small: {}
          medium: {}
      layout:
        values:
          withText: {}
          iconOnly: {}
  rules:
    - slots:
        root:
          strokeColor: $color.stroke.neutral-muted
          strokeWidth: 1px
          cornerRadius: $radius.full
        label:
          color: $color.fg.neutral
          fontWeight: $font-weight.medium
        prefixIcon:
          color: $color.fg.neutral
        suffixIcon:
          color: $color.fg.neutral-subtle
        icon:
          color: $color.fg.neutral
        count:
          color: $color.fg.neutral-muted
          fontWeight: $font-weight.medium
    - states:
        - pressed
      slots:
        root:
          color: $color.bg.layer-default-pressed
    - states:
        - selected
      slots:
        root:
          strokeWidth: 0px
          color: $color.bg.neutral-solid-muted
        label:
          color: $color.palette.static-white
          fontWeight: $font-weight.bold
        prefixIcon:
          color: $color.palette.static-white
        suffixIcon:
          color: $color.palette.static-white
        icon:
          color: $color.palette.static-white
        count:
          color: $color.palette.static-white-alpha-800
    - states:
        - pressed
        - selected
      slots:
        root:
          color: $color.bg.neutral-solid-muted-pressed
    - states:
        - disabled
      slots:
        root:
          color: $color.bg.disabled
        label:
          color: $color.fg.disabled
        prefixIcon:
          color: $color.fg.disabled
        suffixIcon:
          color: $color.fg.disabled
        icon:
          color: $color.fg.disabled
        count:
          color: $color.fg.disabled
    - variants:
        size: small
      slots:
        root:
          minHeight: $dimension.x8
          paddingY: $dimension.x1_5
          gap: $dimension.x1
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        prefixIcon:
          size: $dimension.x4
        suffixIcon:
          size: $dimension.x3_5
        count:
          fontSize: $font-size.t4
    - variants:
        size: medium
      slots:
        root:
          minHeight: $dimension.x9
          paddingY: $dimension.x2
          gap: $dimension.x1
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        prefixIcon:
          size: $dimension.x4
        suffixIcon:
          size: $dimension.x3_5
        count:
          fontSize: $font-size.t4
    - variants:
        size: small
        layout: withText
      slots:
        root:
          paddingX: $dimension.x3
    - variants:
        size: small
        layout: iconOnly
      slots:
        root:
          minWidth: $dimension.x8
        icon:
          size: $dimension.x4
    - variants:
        size: medium
        layout: withText
      slots:
        root:
          paddingX: $dimension.x3_5
    - variants:
        size: medium
        layout: iconOnly
      slots:
        root:
          minWidth: $dimension.x9
        icon:
          size: $dimension.x4
