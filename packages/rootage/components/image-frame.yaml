# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: image-frame
  name: Image Frame
data:
  schema:
    slots:
      root:
        properties:
          strokeColor:
            type: color
            description: stroke 옵션 사용 시 적용되는 테두리 색상입니다.
          strokeWidth:
            type: dimension
            description: stroke 옵션 사용 시 적용되는 테두리 두께입니다.
          cornerRadius:
            type: dimension
            description: rounded 옵션 사용 시 적용되는 모서리 반경입니다.
    variants:
      stroke:
        values:
          "true":
            description: 이미지 테두리에 스트로크를 표시합니다.
          "false":
            description: 테두리를 표시하지 않습니다.
      rounded:
        values:
          "true":
            description: |
              모서리를 둥글게 처리합니다.
              @deprecated `rounded` 옵션은 @seed-design/react@1.3.0에서 제거될 예정입니다. `borderRadius="r2"`를 사용하세요.
              Reason: 모서리 스타일은 `borderRadius` prop으로 통일합니다.
          "false":
            description: |
              모서리를 둥글게 처리하지 않습니다.
              @deprecated `rounded` 옵션은 @seed-design/react@1.3.0에서 제거될 예정입니다. `borderRadius="r2"`를 사용하세요.
              Reason: 모서리 스타일은 `borderRadius` prop으로 통일합니다.
  definitions:
    stroke=true:
      enabled:
        root:
          strokeColor: $color.stroke.neutral-subtle
          strokeWidth: 1px
    stroke=false:
      enabled:
        root:
          strokeWidth: 0px
    rounded=true:
      enabled:
        root:
          cornerRadius: $radius.r2
    rounded=false:
      enabled:
        root:
          cornerRadius: 0px
