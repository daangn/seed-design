# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: chip-tablist
  name: Chip Tablist
data:
  schema:
    slots:
      root:
        properties:
          paddingX:
            type: dimension
          gap:
            type: dimension
    variants:
      variant:
        values:
          neutralSolid: {}
          neutralOutline: {}
  rules:
    - slots:
        root:
          paddingX: $dimension.x4
          gap: 8px
    - variants:
        variant: neutralSolid
      slots:
        root:
          gap: 8px
    - variants:
        variant: neutralOutline
      slots:
        root:
          gap: 8px
