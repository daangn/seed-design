# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: text-field
  name: Text Field
data:
  schema:
    slots:
      root:
        properties:
          minHeight:
            type: dimension
          cornerRadius:
            type: dimension
          gap:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          color:
            type: color
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
      value:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      placeholder:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      prefixText:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      prefixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      suffixText:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      suffixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
  definitions:
    base:
      enabled:
        root:
          gap: $dimension.x2_5
          strokeColor: $color.stroke.neutral-weak
          strokeColorDuration: $duration.d3
          strokeColorTimingFunction: $timing-function.easing
          strokeWidthDuration: $duration.d3
          strokeWidthTimingFunction: $timing-function.easing
        value:
          color: $color.fg.neutral
        placeholder:
          color: $color.fg.placeholder
        prefixText:
          color: $color.fg.neutral-muted
        prefixIcon:
          color: $color.fg.neutral-muted
        suffixText:
          color: $color.fg.neutral-muted
        suffixIcon:
          color: $color.fg.neutral-muted
      focused:
        root:
          strokeColor: $color.stroke.neutral-contrast
      invalid:
        root:
          strokeColor: $color.stroke.critical-solid
      invalid,focused:
        root:
          strokeColor: $color.stroke.critical-solid # being obvious
      readonly:
        value:
          color: $color.fg.neutral-muted
        placeholder:
          color: $color.fg.neutral-muted
      disabled:
        value:
          color: $color.fg.disabled
        placeholder:
          color: $color.fg.disabled
    variant=rounded:
      enabled:
        root:
          minHeight: 52px
          cornerRadius: $radius.r3
          paddingX: $dimension.x4
          paddingY: $dimension.x3_5
          strokeWidth: 1px
        value:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        placeholder:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        prefixText:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        prefixIcon:
          size: $dimension.x5
        suffixText:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        suffixIcon:
          size: $dimension.x5
      focused:
        root:
          strokeWidth: 2px
      invalid:
        root:
          strokeWidth: 2px
      disabled:
        root:
          color: $color.bg.disabled
    variant=underline:
      enabled:
        root:
          paddingY: $dimension.x2
          strokeBottomWidth: 1px
        value:
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
        placeholder:
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
        prefixText:
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
        prefixIcon:
          size: $dimension.x6
        suffixText:
          fontSize: $font-size.t6
          lineHeight: $line-height.t6
        suffixIcon:
          size: $dimension.x6
      focused:
        root:
          strokeBottomWidth: 2px
      invalid:
        root:
          strokeBottomWidth: 2px
