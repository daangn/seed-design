# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: text-field
  name: Text Field
data:
  schema:
    slots:
      root:
        properties:
          minHeight:
            type: dimension
          cornerRadius:
            type: dimension
          gap:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          color:
            type: color
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
      value:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      placeholder:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      prefixText:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      prefixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      suffixText:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      suffixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
  definitions:
    base:
      enabled:
        root:
          minHeight: 52px
          cornerRadius: $radius.r3
          gap: $dimension.x2_5
          paddingX: $dimension.x4
          paddingY: $dimension.x2_5

          color: $color.bg.layer-fill
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral
        value:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5

          color: $color.fg.neutral
        placeholder:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5

          color: $color.fg.placeholder
        prefixText: # TODO: 확인
          fontSize: $font-size.t5
          lineHeight: $line-height.t5

          color: $color.fg.neutral-muted
        prefixIcon:
          size: $dimension.x5

          color: $color.fg.neutral-muted
        suffixText: # TODO: 확인
          fontSize: $font-size.t5
          lineHeight: $line-height.t5

          color: $color.fg.neutral-muted
        suffixIcon:
          size: $dimension.x5

          color: $color.fg.neutral-muted
      focused:
        root:
          color: $color.bg.layer-default # TODO: 확인 필요
          strokeWidth: 2px
          strokeColor: $color.fg.neutral # TODO: field-focused?
      invalid:
        root:
          strokeWidth: 2px
          strokeColor: $color.fg.critical
      invalid,focused:
        root:
          strokeColor: $color.fg.critical # being obvious
      readonly: # 전반적으로 확인
        root:
          strokeColor: $color.stroke.neutral
      disabled:
        root:
          color: $color.bg.disabled
        value:
          color: $color.fg.disabled
        placeholder:
          color: $color.fg.disabled
