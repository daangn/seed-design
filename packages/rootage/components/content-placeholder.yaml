# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: content-placeholder
  name: Content Placeholder
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
      image:
        properties:
          minWidth:
            type: dimension
          maxWidth:
            type: dimension
          widthFraction:
            type: number
          color:
            type: color
  definitions:
    base:
      enabled:
        root:
          color: $color.palette.gray-200
        image:
          minWidth: $dimension.x4
          maxWidth: 120%
          widthFraction: 0.5
          color: $color.palette.gray-400
    type=default: {}
    type=buySell: {}
    type=car: {}
    type=commerce: {}
    type=coupon: {}
    type=food: {}
    type=group: {}
    type=image: {}
    type=jobs: {}
    type=business: {}
    type=post: {}
    type=realty: {}
