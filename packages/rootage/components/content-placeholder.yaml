# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: content-placeholder
  name: Content Placeholder
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
      container:
        properties:
          minWidth:
            type: dimension
          maxWidth:
            type: dimension
          padding:
            type: dimension
      image:
        properties:
          color:
            type: color
  definitions:
    base:
      enabled:
        root:
          color: $color.palette.gray-200
        container:
          minWidth: $dimension.x4
          maxWidth: 120px
          padding: $dimension.x7
        image:
          color: $color.palette.gray-400
    type=default: {}
    type=buySell: {}
    type=car: {}
    type=coupon: {}
    type=food: {}
    type=group: {}
    type=image: {}
    type=jobs: {}
    type=localProfile: {}
    type=post: {}
    type=realty: {}
