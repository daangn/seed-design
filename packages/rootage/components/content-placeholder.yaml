# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: content-placeholder
  name: Content Placeholder
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
      container:
        properties:
          minWidth:
            type: dimension
          maxWidth:
            type: dimension
          padding:
            type: dimension
      asset:
        properties:
          color:
            type: color
  definitions:
    base:
      enabled:
        root:
          color: $color.palette.gray-200
        container:
          minWidth: $dimension.x4
          maxWidth: 120px
          padding: $dimension.x7
        asset:
          color: $color.palette.gray-400
