# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: checkmark
  name: Checkmark
data:
  schema:
    slots:
      root:
        properties:
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          size:
            type: dimension
          color:
            type: color
          strokeColor:
            type: color
          strokeWidth:
            type: dimension
          cornerRadius:
            type: dimension
      icon:
        properties:
          color:
            type: color
          size:
            type: dimension
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
    variants:
      variant:
        values:
          square:
            description: 필수 선택 항목이고 사용자가 해당 내용을 인지해야 하는 경우 사용합니다.
          ghost:
            description: 필수 선택 항목이 아니고, 3개 이하 항목으로 구성되는 경우 사용하는 것을 권장합니다.
      tone:
        values:
          brand: {}
          neutral: {}
      size:
        values:
          medium: {}
          large: {}
    states:
      - id: pressed
      - id: selected
      - id: disabled
        suppresses:
          - pressed
  rules:
    - slots:
        root:
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
    - variants:
        variant: square
      slots:
        root:
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-weak
    - variants:
        variant: square
      states:
        - pressed
      slots:
        root:
          color: $color.bg.transparent-pressed
    - variants:
        variant: square
      states:
        - selected
      slots:
        root:
          strokeWidth: 0px
          strokeColor: "#00000000"
    - variants:
        variant: square
      states:
        - disabled
      slots:
        root:
          color: $color.bg.disabled
          strokeColor: $color.stroke.neutral-muted
        icon:
          color: $color.fg.disabled
    - variants:
        variant: square
      states:
        - selected
        - disabled
      slots:
        icon:
          color: $color.fg.disabled
    - variants:
        variant: square
        tone: brand
      states:
        - selected
      slots:
        root:
          color: $color.bg.brand-solid
        icon:
          color: $color.palette.static-white
    - variants:
        variant: square
        tone: brand
      states:
        - pressed
        - selected
      slots:
        root:
          color: $color.bg.brand-solid-pressed
    - variants:
        variant: square
        tone: neutral
      states:
        - selected
      slots:
        root:
          color: $color.bg.neutral-inverted
        icon:
          color: $color.fg.neutral-inverted
    - variants:
        variant: square
        tone: neutral
      states:
        - pressed
        - selected
      slots:
        root:
          color: $color.bg.neutral-inverted-pressed
    - variants:
        variant: ghost
      slots:
        icon:
          color: $color.fg.placeholder
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
    - variants:
        variant: ghost
      states:
        - pressed
      slots:
        root:
          color: $color.bg.transparent-pressed
    - variants:
        variant: ghost
      states:
        - disabled
      slots:
        icon:
          color: $color.fg.disabled
    - variants:
        variant: ghost
      states:
        - selected
        - disabled
      slots:
        icon:
          color: $color.fg.disabled
    - variants:
        variant: ghost
        tone: brand
      states:
        - selected
      slots:
        icon:
          color: $color.fg.brand
    - variants:
        variant: ghost
        tone: brand
      states:
        - pressed
        - selected
      slots:
        root:
          color: $color.palette.carrot-200
    - variants:
        variant: ghost
        tone: neutral
      states:
        - selected
      slots:
        icon:
          color: $color.fg.neutral
    - variants:
        variant: ghost
        tone: neutral
      states:
        - pressed
        - selected
      slots:
        root:
          color: $color.palette.gray-200
    - variants:
        size: medium
      slots:
        root:
          size: $dimension.x5
          cornerRadius: $radius.r1
    - variants:
        size: large
      slots:
        root:
          size: $dimension.x6
          cornerRadius: $radius.r1
    - variants:
        variant: square
        size: medium
      slots:
        icon:
          size: 12px
    - variants:
        variant: square
        size: large
      slots:
        icon:
          size: 14px
    - variants:
        variant: ghost
        size: medium
      slots:
        icon:
          size: 14px
    - variants:
        variant: ghost
        size: large
      slots:
        icon:
          size: 18px
