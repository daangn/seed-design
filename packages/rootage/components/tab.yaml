# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: tab
  name: Tab
data:
  schema:
    slots:
      root:
        properties:
          minHeight:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
      label:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
    states:
      - id: selected
      - id: disabled
    variants:
      size:
        values:
          medium: {}
          small: {}
  rules:
    - slots:
        label:
          color: $color.fg.neutral-subtle
    - states:
        - selected
      slots:
        label:
          color: $color.fg.neutral
    - states:
        - disabled
      slots:
        label:
          color: $color.fg.disabled
    - variants:
        size: medium
      slots:
        root:
          minHeight: 44px
          paddingX: $dimension.x2_5
          paddingY: $dimension.x2_5
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.bold
    - variants:
        size: small
      slots:
        root:
          minHeight: 40px
          paddingX: $dimension.x2_5
          paddingY: $dimension.x2_5
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
          fontWeight: $font-weight.bold
