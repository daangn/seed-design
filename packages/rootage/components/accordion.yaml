# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: accordion
  name: Accordion
data:
  schema:
    slots:
      root:
        properties:
          gap:
            type: dimension
      item:
        properties:
          borderColor:
            type: color
          cornerRadius:
            type: dimension
          dividerColor:
            type: color
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
      trigger:
        properties:
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          color:
            type: color
          marginX:
            type: dimension
          cornerRadius:
            type: dimension
      prefix:
        properties:
          paddingRight:
            type: dimension
          color:
            type: color
      title:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      description:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
          gap:
            type: dimension
      suffixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
          paddingLeft:
            type: dimension
          rotateDuration:
            type: duration
          rotateTimingFunction:
            type: cubicBezier
      body:
        properties:
          gap:
            type: dimension
      contentInner:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
          color:
            type: color
      content:
        properties:
          paddingX:
            type: dimension
          paddingTop:
            type: dimension
          paddingBottom:
            type: dimension
          expandHeightDuration:
            type: duration
          expandHeightTimingFunction:
            type: cubicBezier
          collapseHeightDuration:
            type: duration
          collapseHeightTimingFunction:
            type: cubicBezier
    variants:
      variant:
        values:
          inline:
            description: Full-width items with dividers
          separated:
            description: Card-style independent items with gap
      size:
        values:
          medium: {}
          large: {}
  definitions:
    base:
      enabled:
        item:
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
        trigger:
          paddingX: $dimension.spacing-x.global-gutter
        prefix:
          color: $color.fg.neutral-subtle
        body:
          gap: $dimension.x0_5
        title:
          color: $color.fg.neutral
          fontWeight: $font-weight.medium
        description:
          color: $color.fg.neutral-subtle
          fontWeight: $font-weight.medium
          gap: $dimension.x0_5
        suffixIcon:
          color: $color.fg.neutral-subtle
          rotateDuration: $duration.d6
          rotateTimingFunction: $timing-function.easing
        contentInner:
          fontSize: $font-size.t4
          lineHeight: $line-height.t5
          fontWeight: $font-weight.regular
          color: $color.fg.neutral-muted
        content:
          paddingX: $dimension.spacing-x.global-gutter
          expandHeightDuration: $duration.d6
          expandHeightTimingFunction: $timing-function.easing
          collapseHeightDuration: $duration.d6
          collapseHeightTimingFunction: $timing-function.easing
      disabled:
        prefix:
          color: $color.fg.disabled
        title:
          color: $color.fg.disabled
        description:
          color: $color.fg.disabled
        suffixIcon:
          color: $color.fg.disabled
      pressed:
        trigger:
          color: $color.bg.transparent-pressed
          marginX: $dimension.x1_5
          cornerRadius: $dimension.x2_5

    size=medium:
      enabled:
        trigger:
          paddingY: $dimension.x4
        prefix:
          paddingRight: $dimension.x3
        title:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        description:
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
        suffixIcon:
          size: $dimension.x5
          paddingLeft: $dimension.x3
        content:
          paddingTop: $dimension.x0_5
          paddingBottom: $dimension.x4

    size=large:
      enabled:
        trigger:
          paddingY: $dimension.x5
        prefix:
          paddingRight: $dimension.x3
        title:
          fontSize: $font-size.t7
          lineHeight: $line-height.t7
        description:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        suffixIcon:
          size: $dimension.x6
          paddingLeft: $dimension.x3
        content:
          paddingTop: $dimension.x1
          paddingBottom: $dimension.x5

    variant=inline:
      enabled:
        item:
          dividerColor: $color.stroke.neutral-subtle

    variant=separated:
      enabled:
        item:
          borderColor: $color.stroke.neutral-muted
          cornerRadius: $radius.r3

    variant=separated, size=medium:
      enabled:
        root:
          gap: $dimension.x3

    variant=separated, size=large:
      enabled:
        root:
          gap: $dimension.x4
