# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: select-box
  name: Select Box
data:
  schema:
    slots:
      root:
        properties:
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          gap:
            type: dimension
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
          cornerRadius:
            type: dimension
          color:
            type: color
      content:
        properties:
          gap:
            type: dimension
      label:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      description:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
  definitions:
    base:
      enabled:
        root:
          paddingX: $dimension.x4
          paddingY: $dimension.x5
          gap: $dimension.x2_5
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral
          cornerRadius: $radius.r3
        content:
          gap: $dimension.x0_5
        label:
          color: $color.fg.neutral
          fontWeight: $font-weight.bold
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        description:
          color: $color.fg.neutral-muted
          fontWeight: $font-weight.regular
          fontSize: $font-size.t4
          lineHeight: $line-height.t4

      enabled,pressed:
        root:
          color: $color.bg.layer-default-pressed

      enabled,selected:
        root:
          color: $color.bg.neutral-weak
          strokeColor: $color.stroke.control

      enabled,selected,pressed:
        root:
          color: $color.bg.neutral-weak-pressed
