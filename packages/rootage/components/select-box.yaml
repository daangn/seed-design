# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: select-box
  name: Select Box
data:
  schema:
    slots:
      root:
        properties:
          cornerRadius:
            type: dimension
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
          color:
            type: color
          colorTransitionDuration:
            type: duration
          colorTransitionTimingFunction:
            type: cubicBezier
          strokeColorTransitionDuration:
            type: duration
          strokeColorTransitionTimingFunction:
            type: cubicBezier
          strokeWidthTransitionDuration:
            type: duration
          strokeWidthTransitionTimingFunction:
            type: cubicBezier
      trigger:
        properties:
          gap:
            type: dimension
          paddingLeft:
            type: dimension
          paddingRight:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
      content:
        properties:
          gap:
            type: dimension
      prefixIcon:
        properties:
          color:
            type: color
          size:
            type: dimension
      body:
        properties:
          gap:
            type: dimension
          paddingRight:
            type: dimension
      label:
        properties:
          gap:
            type: dimension
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      description:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
  definitions:
    base:
      enabled:
        root:
          cornerRadius: $radius.r3
          color: $color.bg.transparent
          strokeColor: $color.stroke.neutral-muted
          strokeWidth: 1px
          colorTransitionDuration: $duration.color-transition
          colorTransitionTimingFunction: $timing-function.easing
          strokeColorTransitionDuration: $duration.color-transition
          strokeColorTransitionTimingFunction: $timing-function.easing
          strokeWidthTransitionDuration: $duration.d3
          strokeWidthTransitionTimingFunction: $timing-function.easing
        trigger:
          gap: $dimension.x1_5
        prefixIcon:
          color: $color.fg.neutral
          size: 22px
        body:
          gap: $dimension.x0_5
          paddingRight: $dimension.x1
        label:
          gap: $dimension.x1 # might have prefix/suffix
          color: $color.fg.neutral
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.medium
        description:
          color: $color.fg.neutral-muted
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
          fontWeight: $font-weight.regular

      selected:
        root:
          strokeWidth: 2px
      enabled,selected:
        root:
          strokeColor: $color.stroke.neutral-contrast
      disabled:
        root:
          strokeColor: $color.stroke.neutral-muted
        prefixIcon:
          color: $color.fg.disabled
        label:
          color: $color.fg.disabled
        description:
          color: $color.fg.disabled

      enabled,pressed:
        root:
          color: $color.bg.transparent-pressed

    layout=horizontal:
      enabled:
        trigger:
          paddingLeft: $dimension.x5
          paddingRight: $dimension.x4
          paddingY: $dimension.x4
        content: # aligns horizontally
          gap: $dimension.x3

    layout=vertical:
      enabled:
        trigger:
          paddingX: $dimension.x4
          paddingY: $dimension.x5
        content: # aligns vertically
          gap: $dimension.x2_5
