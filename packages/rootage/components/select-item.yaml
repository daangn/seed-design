# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: select-item
  name: Select Item
data:
  schema:
    slots:
      root:
        properties:
          color:
            type: color
          marginX:
            type: dimension
          cornerRadius:
            type: dimension
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          marginDuration:
            type: duration
          marginTimingFunction:
            type: cubicBezier
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          gap:
            type: dimension
      prefixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      body:
        properties:
          gap:
            type: dimension
      label:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      description:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      indicator:
        properties:
          size:
            type: dimension
          color:
            type: color
    variants:
      size:
        values:
          large:
            description: 뷰포트 너비와 관계없이 사용할 수 있습니다.
          medium:
            description: Breakpoint `lg` 이상(데스크톱)에서만 사용하고, 모바일에서는 사용하지 않습니다. 정밀한 선택이 가능한 마우스 입력 환경에서 사이즈를 더 작게 만들고자 할 때 사용합니다.

  definitions:
    base:
      enabled:
        root:
          paddingX: $dimension.x4
          cornerRadius: $radius.r3
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
          marginDuration: $duration.d3
          marginTimingFunction: $timing-function.easing
        prefixIcon:
          color: $color.fg.neutral
        body:
          gap: $dimension.x0_5
        label:
          fontWeight: $font-weight.regular
          color: $color.fg.neutral
        description:
          fontWeight: $font-weight.regular
          color: $color.fg.neutral-subtle
        indicator:
          color: $color.fg.neutral

      pressed:
        root:
          color: $color.bg.transparent-pressed
          marginX: $dimension.x2

      disabled:
        prefixIcon:
          color: $color.fg.disabled
        label:
          color: $color.fg.disabled
        description:
          color: $color.fg.disabled
        indicator:
          color: $color.fg.disabled
    size=large:
      enabled:
        root:
          paddingY: $dimension.x3
          gap: $dimension.x3
        prefixIcon:
          size: 22px
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        description:
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
        indicator:
          size: $dimension.x3_5
    size=medium:
      enabled:
        root:
          paddingY: $dimension.x2_5
          gap: $dimension.x2
        prefixIcon:
          size: $dimension.x4_5
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        description:
          fontSize: $font-size.t2
          lineHeight: $line-height.t2
        indicator:
          size: $dimension.x3
