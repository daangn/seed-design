# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: segmented-text-input
  name: Segmented Text Input
data:
  schema:
    slots:
      root:
        properties:
          gap:
            type: dimension
          minHeight:
            type: dimension
          cornerRadius:
            type: dimension
          paddingX:
            type: dimension
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
          color:
            type: color
          strokeDuration:
            type: duration
            description: enabled 상태의 stroke 위에 focused/invalid 상태의 stroke가 fade in/out 되는 데에
              걸리는 시간입니다. stroke 두께나 색상 자체를 transition하지 않습니다.
          strokeTimingFunction:
            type: cubicBezier
      value:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      placeholder:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      maskedPlaceholder:
        properties:
          color:
            type: color
            description: 빈 masked Segment에 표시하는 placeholder 불릿의 색상입니다.
      separator:
        properties:
          color:
            type: color
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
      staticText:
        properties:
          color:
            type: color
            description: Segment 앞뒤나 Segment 자리에 고정으로 표시하는 정적 텍스트(불릿 등)의 색상입니다.
          fontWeight:
            type: number
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
    variants:
      size:
        values:
          large:
            description: 뷰포트 너비와 관계없이 사용할 수 있습니다.
          medium:
            description: Breakpoint `lg` 이상(데스크톱)에서만 사용하고, 모바일에서는 사용하지 않습니다. 정밀한 선택이 가능한 마우스 입력 환경에서 사이즈를 더 작게 만들고자 할 때 사용합니다.
  definitions:
    base:
      enabled:
        root:
          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-weak
          strokeDuration: 0.1s
          strokeTimingFunction: $timing-function.easing
        value:
          color: $color.fg.neutral
          fontWeight: $font-weight.regular
        placeholder:
          color: $color.fg.placeholder
          fontWeight: $font-weight.regular
        maskedPlaceholder:
          color: $color.fg.placeholder
        separator:
          color: $color.fg.placeholder
          fontWeight: $font-weight.regular
        staticText:
          color: $color.fg.neutral
          fontWeight: $font-weight.regular
      focused:
        root:
          strokeWidth: 2px
          strokeColor: $color.stroke.neutral-contrast
      invalid:
        root:
          strokeWidth: 2px
          strokeColor: $color.stroke.critical-solid
      invalid,focused:
        root:
          strokeColor: $color.stroke.critical-solid # being obvious
      readonly:
        root:
          color: $color.bg.disabled
      disabled:
        root:
          color: $color.bg.disabled
        value:
          color: $color.fg.disabled
        placeholder:
          color: $color.fg.disabled
        maskedPlaceholder:
          color: $color.fg.disabled
        separator:
          color: $color.fg.disabled
        staticText:
          color: $color.fg.disabled
    size=large:
      enabled:
        root:
          gap: $dimension.x2_5
          minHeight: $dimension.x13
          cornerRadius: $radius.r3
          paddingX: $dimension.x4
        value:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        placeholder:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        separator:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
        staticText:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
    size=medium:
      enabled:
        root:
          gap: $dimension.x2
          minHeight: $dimension.x10
          cornerRadius: $radius.r2
          paddingX: $dimension.x3_5
        value:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        placeholder:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        separator:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
        staticText:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
