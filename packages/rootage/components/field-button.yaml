# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: field-button
  name: Field Button
data:
  schema:
    slots:
      root:
        properties:
          minHeight:
            type: dimension
          cornerRadius:
            type: dimension
          gap:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
          color:
            type: color
          strokeWidth:
            type: dimension
          strokeColor:
            type: color
      value:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      placeholder:
        properties:
          color:
            type: color
      prefixText:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      prefixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      suffixText:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          color:
            type: color
      suffixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color

  definitions:
    base:
      enabled:
        root:
          minHeight: 52px
          cornerRadius: $radius.r3
          gap: $dimension.x2_5
          paddingX: $dimension.x4
          paddingY: $dimension.x2_5

          strokeWidth: 1px
          strokeColor: $color.stroke.neutral-weak

          colorDuration: $duration.d3
          colorTimingFunction: $timing-function.easing
          strokeColorDuration: $duration.d3
          strokeColorTimingFunction: $timing-function.easing
          strokeWidthDuration: $duration.d3
          strokeWidthTimingFunction: $timing-function.easing

        value:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5

          color: $color.fg.neutral

        placeholder:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          
          color: $color.fg.placeholder

        prefixText: # TODO: 확인 필요함
          fontSize: $font-size.t5
          lineHeight: $line-height.t5

          color: $color.fg.neutral-muted
        prefixIcon:
          size: $dimension.x5

          color: $color.fg.neutral-muted
        suffixText: # TODO: 확인
          fontSize: $font-size.t5
          lineHeight: $line-height.t5

          color: $color.fg.neutral-muted

        suffixIcon:
          size: $dimension.x5

          color: $color.fg.neutral-muted
        
        clearButton:
          size: 22px
          color: $color.fg.neutral-subtle

      pressed:
        root:
          color: $color.bg.layer-default-pressed

      invalid:
        root:
          strokeWidth: 2px
          strokeColor: $color.stroke.critical-solid

      disabled:
        root:
          color: $color.bg.disabled
        value:
          color: $color.fg.disabled
        placeholder:
          color: $color.fg.disabled
