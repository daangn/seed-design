# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: slider-tick
  name: Slider Tick
data:
  schema:
    slots:
      root:
        properties:
          width:
            type: dimension
          color:
            type: color
    variants:
      weight:
        values:
          thin: {}
          thick: {}
  rules:
    - slots:
        root:
          color: $color.fg.neutral-inverted # fg 토큰인데 적절할까?      
    - variants:
        weight: thin
      slots:
        root:
          width: 1px
    - variants:
        weight: thick
      slots:
        root:
          width: $dimension.x1
