# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: quantity-picker-button
  name: Quantity Picker Button
data:
  schema:
    slots:
      root:
        properties:
          size:
            type: dimension
          cornerRadius:
            type: dimension
          color:
            type: color
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
      icon:
        properties:
          size:
            type: dimension
          color:
            type: color
      progressCircle:
        properties:
          trackColor:
            type: color
          rangeColor:
            type: color
          size:
            type: dimension
          thickness:
            type: dimension
    variants:
      size:
        values:
          small: {}
          medium: {}
          large: {}
  definitions:
    base:
      enabled:
        root:
          color: $color.bg.transparent
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
        icon:
          color: $color.fg.neutral
        progressCircle:
          trackColor: $color.palette.gray-500
          rangeColor: $color.fg.neutral
      pressed:
        root:
          color: $color.bg.transparent-pressed
      disabled:
        icon:
          color: $color.fg.disabled
      loading:
        root:
          color: $color.bg.transparent-pressed
    size=small:
      enabled:
        root:
          size: $dimension.x9
          cornerRadius: $radius.r2
        icon:
          size: 16px
        progressCircle:
          size: 16px
          thickness: 2px
    size=medium:
      enabled:
        root:
          size: $dimension.x10
          cornerRadius: $radius.r2
        icon:
          size: 18px
        progressCircle:
          size: 18px
          thickness: 2px
    size=large:
      enabled:
        root:
          size: $dimension.x13
          cornerRadius: $radius.r3
        icon:
          size: 22px
        progressCircle:
          size: 22px
          thickness: 2px
