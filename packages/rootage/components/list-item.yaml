# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: list-item
  name: List Item
data:
  schema:
    slots:
      root:
        properties:
          paddingY:
            type: dimension
          paddingX:
            type: dimension
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          color:
            type: color
          marginX:
            type: dimension
            description: pressed 시 배경 레이어는 좌우 폭이 marginX만큼 줄어들고, 배경 레이어 위 요소들이 위치하는 레이아웃 레이어는 scale로 인해 전체적으로 줄어드는 형태로 두 레이어가 별개로 작동합니다. 이 값은 OS 동작 줄이기 설정의 영향을 받지 않습니다.
          cornerRadius:
            type: dimension
          marginDuration:
            type: duration
          marginTimingFunction:
            type: cubicBezier
          borderRadiusDuration:
            type: duration
          borderRadiusTimingFunction:
            type: cubicBezier
          contentScale:
            type: number
            description: pressed 시 배경 레이어는 좌우 폭이 marginX만큼 줄어들고, 배경 레이어 위 요소들이 위치하는 레이아웃 레이어는 scale로 인해 전체적으로 줄어드는 형태로 두 레이어가 별개로 작동합니다.
          contentScaleDuration:
            type: duration
          contentScaleTimingFunction:
            type: cubicBezier
      body:
        properties:
          gap:
            type: dimension
          paddingRight:
            type: dimension
      title:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      detail:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      prefix:
        properties:
          paddingRight:
            type: dimension
      prefixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      suffix:
        properties:
          gap:
            type: dimension
      suffixText:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      suffixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
  definitions:
    base:
      enabled:
        root:
          paddingY: $dimension.x3
          paddingX: $dimension.spacing-x.global-gutter
          color: $color.bg.transparent
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
          marginDuration: $duration.d3
          marginTimingFunction: $timing-function.easing
          borderRadiusDuration: $duration.d3
          borderRadiusTimingFunction: $timing-function.easing
          contentScaleDuration: $duration.pressed-scale
          contentScaleTimingFunction: $timing-function.pressed-scale
        body:
          gap: $dimension.x0_5
          paddingRight: $dimension.x2_5
        title:
          color: $color.fg.neutral
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.regular
        detail:
          color: $color.fg.neutral-subtle
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
          fontWeight: $font-weight.regular
        prefix:
          paddingRight: $dimension.x3
        prefixIcon:
          size: 22px
          color: $color.fg.neutral
        suffix:
          gap: $dimension.x1
        suffixText:
          color: $color.fg.neutral-subtle
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.regular
        suffixIcon:
          size: 18px
          color: $color.fg.neutral-subtle
      pressed:
        root:
          color: $color.bg.transparent-pressed
          marginX: $dimension.x1_5
          cornerRadius: $dimension.x2_5
          contentScale: $scale.s97
      highlighted:
        root:
          color: $color.bg.brand-weak
      highlighted,pressed:
        root:
          color: $color.bg.brand-weak-pressed
      disabled:
        title:
          color: $color.fg.disabled
        detail:
          color: $color.fg.disabled
        prefixIcon:
          color: $color.fg.disabled
        suffixIcon:
          color: $color.fg.disabled
