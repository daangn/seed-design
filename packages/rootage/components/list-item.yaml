# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: list-item
  name: List Item
data:
  schema:
    slots:
      root:
        description: pressed 시 배경 레이어와 콘텐츠 레이어가 별개로 동작합니다. 배경 레이어는 좌우 폭이 marginX만큼 줄어들고, 그 위에 요소들이 위치하는 콘텐츠 레이어는 전체가 축소됩니다. 콘텐츠 레이어의 축소 배율은 렌더된 크기로부터 런타임에 계산되어 항상 2px만큼 작아지므로 spec에 값을 정의하지 않습니다. OS 동작 줄이기 설정이 켜져 있으면 콘텐츠 레이어는 축소되지 않습니다.
        properties:
          paddingY:
            type: dimension
          paddingX:
            type: dimension
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          color:
            type: color
          marginX:
            type: dimension
            description: 배경 레이어가 좁아지는 폭입니다. 콘텐츠 레이어의 축소와 달리 OS 동작 줄이기 설정의 영향을 받지 않습니다.
          cornerRadius:
            type: dimension
          marginDuration:
            type: duration
          marginTimingFunction:
            type: cubicBezier
          borderRadiusDuration:
            type: duration
          borderRadiusTimingFunction:
            type: cubicBezier
      body:
        properties:
          gap:
            type: dimension
          paddingRight:
            type: dimension
      title:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      detail:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      prefix:
        description: 여기에 중첩되는 Checkmark, Radiomark, Switchmark는 pressed 시 자체적으로 축소되지 않습니다. 행 전체의 배경과 콘텐츠 레이어 축소만으로 충분한 피드백이 되기 때문입니다.
        properties:
          paddingRight:
            type: dimension
      prefixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
      suffix:
        description: 여기에 중첩되는 Checkmark, Radiomark, Switchmark는 pressed 시 자체적으로 축소되지 않습니다. 행 전체의 배경과 콘텐츠 레이어 축소만으로 충분한 피드백이 되기 때문입니다.
        properties:
          gap:
            type: dimension
      suffixText:
        properties:
          color:
            type: color
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
      suffixIcon:
        properties:
          size:
            type: dimension
          color:
            type: color
  definitions:
    base:
      enabled:
        root:
          paddingY: $dimension.x3
          paddingX: $dimension.spacing-x.global-gutter
          color: $color.bg.transparent
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
          marginDuration: $duration.d3
          marginTimingFunction: $timing-function.easing
          borderRadiusDuration: $duration.d3
          borderRadiusTimingFunction: $timing-function.easing
        body:
          gap: $dimension.x0_5
          paddingRight: $dimension.x2_5
        title:
          color: $color.fg.neutral
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.regular
        detail:
          color: $color.fg.neutral-subtle
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
          fontWeight: $font-weight.regular
        prefix:
          paddingRight: $dimension.x3
        prefixIcon:
          size: 22px
          color: $color.fg.neutral
        suffix:
          gap: $dimension.x1
        suffixText:
          color: $color.fg.neutral-subtle
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
          fontWeight: $font-weight.regular
        suffixIcon:
          size: 18px
          color: $color.fg.neutral-subtle
      pressed:
        root:
          color: $color.bg.transparent-pressed
          marginX: $dimension.x1_5
          cornerRadius: $dimension.x2_5
      highlighted:
        root:
          color: $color.bg.brand-weak
      highlighted,pressed:
        root:
          color: $color.bg.brand-weak-pressed
      disabled:
        title:
          color: $color.fg.disabled
        detail:
          color: $color.fg.disabled
        prefixIcon:
          color: $color.fg.disabled
        suffixIcon:
          color: $color.fg.disabled
