# yaml-language-server: $schema=./schema.json
# parts: root, control, thumb
kind: ComponentSpec
metadata:
  id: switch
  name: Switch
data:
  schema:
    slots:
      root:
        properties:
          height:
            type: dimension
          gap:
            type: dimension
          opacity:
            type: number
      control:
        properties:
          color:
            type: color
          cornerRadius:
            type: dimension
          height:
            type: dimension
          width:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
      thumb:
        properties:
          color:
            type: color
          cornerRadius:
            type: dimension
          height:
            type: dimension
          width:
            type: dimension
          shadow:
            type: shadow
      label:
        properties:
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
  definitions:
    base:
      enabled:
        control:
          color: $color.palette.gray-600
          cornerRadius: $radius.full
        thumb:
          color: $color.palette.static-white
          cornerRadius: $radius.full
      enabled,selected:
        control:
          color: $color.bg.brand-solid
      disabled:
        root:
          opacity: 0.38
    size=medium:
      enabled:
        root:
          height: 32px
        control:
          height: 32px
          width: 52px
          paddingX: 2px
          paddingY: 2px
        thumb:
          height: 28px
          width: 28px
          shadow:
            type: shadow
            value:
              - offsetX: 0px
                offsetY: 3px
                blur: 8px
                spread: 0px
                color: "#00000026"
              - offsetX: 0px
                offsetY: 1px
                blur: 3px
                spread: 0px
                color: "#0000000f"
    size=small:
      enabled:
        root:
          height: 24px
          gap: $dimension.x2
        control:
          height: 16px
          width: 26px
          paddingX: 2px
          paddingY: 2px
        thumb:
          height: 12px
          width: 12px
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
          fontWeight: $font-weight.regular
