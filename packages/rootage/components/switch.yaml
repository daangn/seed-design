# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: switch
  name: Switch
data:
  schema:
    slots:
      root:
        properties:
          height:
            type: dimension
          gap:
            type: dimension
      label:
        properties:
          color:
            type: color
          opacity:
            type: number
          opacityDuration:
            type: duration
          opacityTimingFunction:
            type: cubicBezier
          fontSize:
            type: dimension
          lineHeight:
            type: dimension
          fontWeight:
            type: number
    states:
      - id: disabled
    variants:
      size:
        values:
          "32": {}
          "24": {}
          "16": {}
  rules:
    - slots:
        label:
          color: $color.fg.neutral
          fontWeight: $font-weight.medium
    - states:
        - disabled
      slots:
        label:
          opacity: 0.58
          opacityDuration: $duration.d1
          opacityTimingFunction: $timing-function.easing
    - variants:
        size: "32"
      slots:
        root:
          height: $dimension.x8
          gap: $dimension.x2_5
        label:
          fontSize: $font-size.t5
          lineHeight: $line-height.t5
    - variants:
        size: "24"
      slots:
        root:
          height: $dimension.x6
          gap: $dimension.x2
        label:
          fontSize: $font-size.t4
          lineHeight: $line-height.t4
    - variants:
        size: "16"
      slots:
        root:
          height: $dimension.x6
          gap: $dimension.x1_5
        label:
          fontSize: $font-size.t3
          lineHeight: $line-height.t3
