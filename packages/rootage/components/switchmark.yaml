# yaml-language-server: $schema=./schema.json
# parts: root, thumb
kind: ComponentSpec
metadata:
  id: switchmark
  name: Switchmark
  lastUpdated: 25-12-16
data:
  schema:
    slots:
      root:
        properties:
          cornerRadius:
            type: dimension
          color:
            type: color
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          colorDelay:
            type: duration
          opacity:
            type: number
          opacityDuration:
            type: duration
          opacityTimingFunction:
            type: cubicBezier
          height:
            type: dimension
          width:
            type: dimension
          paddingX:
            type: dimension
          paddingY:
            type: dimension
      thumb:
        properties:
          color:
            type: color
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          colorDelay:
            type: duration
          cornerRadius:
            type: dimension
          height:
            type: dimension
          width:
            type: dimension
          scale:
            type: number
          scaleDuration:
            type: duration
          scaleTimingFunction:
            type: cubicBezier
          translateDuration:
            type: duration
          translateTimingFunction:
            type: cubicBezier
    states:
      - id: selected
      - id: disabled
    variants:
      tone:
        values:
          brand: {}
          neutral: {}
      size:
        values:
          "32": {}
          "24": {}
          "16": {}
  rules:
    - slots:
        root:
          cornerRadius: $radius.full
          color: $color.palette.gray-600
          colorDuration: $duration.d1
          colorTimingFunction: $timing-function.easing
          colorDelay: 20ms
        thumb:
          cornerRadius: $radius.full
          scale: 0.8
          scaleDuration: $duration.d3
          scaleTimingFunction: $timing-function.easing
          translateDuration: $duration.d3
          translateTimingFunction: $timing-function.easing
          colorDuration: $duration.d1
          colorTimingFunction: $timing-function.easing
          colorDelay: 20ms
    - states:
        - disabled
      slots:
        root:
          opacity: 0.38
          opacityDuration: $duration.d1
          opacityTimingFunction: $timing-function.easing
    - states:
        - selected
      slots:
        thumb:
          scale: 1.0
    - variants:
        tone: brand
      slots:
        thumb:
          color: $color.palette.static-white
    - variants:
        tone: brand
      states:
        - selected
      slots:
        root:
          color: $color.bg.brand-solid
    - variants:
        tone: neutral
      slots:
        thumb:
          color: $color.fg.neutral-inverted
    - variants:
        tone: neutral
      states:
        - selected
      slots:
        root:
          color: $color.bg.neutral-inverted
    - variants:
        tone: neutral
      states:
        - disabled
      slots:
        thumb:
          color: $color.palette.static-black-alpha-700
    - variants:
        tone: neutral
      states:
        - selected
        - disabled
      slots:
        root:
          color: $color.palette.gray-600
    - variants:
        size: "32"
      slots:
        root:
          height: 32px
          width: 52px
          paddingX: 3px
          paddingY: 3px
        thumb:
          height: 26px
          width: 26px
    - variants:
        size: "24"
      slots:
        root:
          height: 24px
          width: 38px
          paddingX: 2px
          paddingY: 2px
        thumb:
          height: 20px
          width: 20px
    - variants:
        size: "16"
      slots:
        root:
          height: 16px
          width: 26px
          paddingX: 2px
          paddingY: 2px
        thumb:
          height: 12px
          width: 12px
