# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: top-navigation-icon-button
  name: Top Navigation Icon Button
data:
  schema:
    slots:
      root:
        properties:
          size:
            type: dimension
          cornerRadius:
            type: dimension
          color:
            type: color
          colorDuration:
            type: duration
          colorTimingFunction:
            type: cubicBezier
          scaleScope:
            type: enum
            values: [self, content]
      icon:
        properties:
          size:
            type: dimension
          color:
            type: color
  definitions:
    base:
      enabled:
        root:
          size: 44px
          cornerRadius: $radius.r2
          color: $color.bg.transparent
          colorDuration: $duration.color-transition
          colorTimingFunction: $timing-function.easing
        icon:
          size: 24px
      pressed:
        root:
          color: $color.bg.transparent-pressed
          scaleScope: self
    tone=layer:
      enabled:
        icon:
          color: $color.fg.neutral
      disabled:
        icon:
          color: $color.fg.disabled
    tone=transparent:
      enabled:
        icon:
          color: $color.palette.static-white
      disabled:
        icon:
          color: $color.fg.disabled
