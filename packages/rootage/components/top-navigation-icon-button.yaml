# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: top-navigation-icon-button
  name: Top Navigation Icon Button
data:
  schema:
    slots:
      root:
        properties:
          size:
            type: dimension
          scale:
            type: number
          scaleDuration:
            type: duration
          scaleTimingFunction:
            type: cubicBezier
      icon:
        properties:
          size:
            type: dimension
          color:
            type: color
  definitions:
    base:
      enabled:
        root:
          size: 44px
          scaleDuration: $duration.pressed-scale
          scaleTimingFunction: $timing-function.pressed-scale
        icon:
          size: 24px
      pressed:
        root:
          scale: $scale.s97
    tone=layer:
      enabled:
        icon:
          color: $color.fg.neutral
      disabled:
        icon:
          color: $color.fg.disabled
    tone=transparent:
      enabled:
        icon:
          color: $color.palette.static-white
      disabled:
        icon:
          color: $color.fg.disabled
