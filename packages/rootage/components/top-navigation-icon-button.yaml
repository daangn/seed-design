# yaml-language-server: $schema=./schema.json
kind: ComponentSpec
metadata:
  id: top-navigation-icon-button
  name: Top Navigation Icon Button
data:
  schema:
    slots:
      root:
        properties:
          size:
            type: dimension
      icon:
        properties:
          size:
            type: dimension
          color:
            type: color
    states:
      - id: disabled
    variants:
      tone:
        values:
          layer: {}
          transparent: {}
  rules:
    - slots:
        root:
          size: 44px
        icon:
          size: 24px
    - variants:
        tone: layer
      slots:
        icon:
          color: $color.fg.neutral
    - variants:
        tone: layer
      states:
        - disabled
      slots:
        icon:
          color: $color.fg.disabled
    - variants:
        tone: transparent
      slots:
        icon:
          color: $color.palette.static-white
    - variants:
        tone: transparent
      states:
        - disabled
      slots:
        icon:
          color: $color.fg.disabled
